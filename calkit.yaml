owner: petebachant
name: clima-gpu-profiling
title: CliMA GPU profiling
description: Profiling GPU performance for CliMA.
git_repo_url: https://github.com/petebachant/clima-gpu-profiling

questions:
  # Answers are one sentence pointing at reproducible evidence; the reasoning
  # lives in docs/. Numbers are templated from value evidence by name rather
  # than typed -- but ONLY where the cited file is the same artifact in the
  # working tree as at the pin, because rendering reads the working tree and
  # ignores git_ref. A pinned citation of a regenerated artifact such as
  # results/summary.json must therefore NOT be templated: it would render
  # whichever run wrote that file last. Those figures stay typed and pinned.
  - question: >-
      What is the ceiling on kernel fusion, and which package would have to
      deliver it?
    answer: >-
      At most {ceiling_fuse_4to1_pct}% of a step, and no one package can deliver it.
      {small_share_pct}% of the {launches_per_step:,.0f} kernel launches per step come from kernels short enough that the host time around a launch exceeds the GPU time inside it, and fusing that whole band four-to-one saves {ceiling_fuse_4to1_pct}% of a {step_ms} ms step; making every short launch vanish outright, which no real change achieves, saves {ceiling_all_removed_pct}%.
      ClimaAtmos holds the largest share at {climaatmos_launches_per_step:,.0f} launches per step, worth {climaatmos_fuse_4to1_pct}%, and within it cache/microphysics_cache.jl is the densest source at {mp_cache_launches_per_step:,.0f} per step and {mp_cache_fuse_4to1_pct}%, against {precomputed_launches_per_step:,.0f} and {precomputed_fuse_4to1_pct}% for the cache/precomputed_quantities.jl that CliMA/ClimaAtmos.jl#4261 proposes starting from -- the cache folder is the right instinct, and the microphysics cache is the bigger half of it.
      Read all of these as upper bounds, and as only half the prize. They price the HOST side: the time around a launch, at {host_us_per_launch} microseconds each, measured under nsys, whose own tracing runs to tens of CUDA API calls per launch and inflates exactly this quantity (docs/learnings.md 2b-i); pricing a launch honestly needs the probe run through the unprofiled AMIP stages, parked on ClimaAtmos.jl-mod branch pb/launch-cost-probe.
      Fusion also removes the intermediate arrays a chain of kernels writes and reads back, which is DEVICE time and independent of launch count: the same band is {small_band_pct_of_kernel_time}% of GPU kernel time, and this project's own fusion of the 1M source terms into the linearization accumulators cut kernel time 6.28% for +1.95% SYPD with the launch count identical to the unit (docs/learnings.md 3b).
      So the two halves point at different work: fusing for launch count means merging adjacent short kernels, while fusing for memory traffic means merging the ones that hand arrays to each other, which is what the `@. lazy` and uncached-temporaries subtasks of #4261 do, and it is where the measured gain came from.
      Attempted and declined on the arithmetic, which is worth recording so nobody re-derives it: the band is a long tail rather than a few fat kernels, so there is no bounded experiment in it.
      The launches spread across {distinct_kernels:.0f} distinct kernels, and {other_launches:,.0f} of them over the profiled window come from call sites the attribution cannot name, so the band's share sits in that tail -- the ten largest by launch count contribute only a small part of it.
      The densest cluster a single change could reach, the independent broadcasts in cache/microphysics_cache.jl, is seven launches per call and about a hundred and twenty calls in the window, which ClimaCore's Fields.@fused_direct would take to two: a saving of hundreds of launches out of hundreds of thousands, on kernels that cost microseconds.
      The `@. lazy` half is worse than neutral there, and the code says why: the liquid fraction and the linearized saturation-excess mean are deliberately hoisted OUT of the quadrature because they are invariant across its nine points, so making them lazy recomputes them nine times per cell and adds live state to a kernel already clipped at the register cap and spilling (docs/learnings.md 4aa).
      So capturing this band means hundreds of call sites, which is what CliMA/ClimaAtmos.jl#4261 is for, and not a kernel tweak.
    evidence:
      - kind: result
        path: results/experiments/launch-cost/stats.json
        git_ref: meas/2026-09-19-launch-cost
        values:
          ceiling_fuse_4to1_pct: fusion.ceiling_fuse_4to1_pct
          ceiling_all_removed_pct: fusion.ceiling_all_removed_pct
          host_us_per_launch: marginal.host_us_per_launch
          small_share_pct: fusion.small_share_pct
          launches_per_step: fusion.launches_per_step
          step_ms: fusion.step_ms
          climaatmos_launches_per_step: fusion.by_package.ClimaAtmos.per_step
          climaatmos_fuse_4to1_pct: fusion.by_package.ClimaAtmos.fuse_4to1_pct
          mp_cache_launches_per_step: fusion.climaatmos_by_file.cache_microphysics_cache.per_step
          mp_cache_fuse_4to1_pct: fusion.climaatmos_by_file.cache_microphysics_cache.fuse_4to1_pct
          precomputed_launches_per_step: fusion.climaatmos_by_file.cache_precomputed_quantities.per_step
          precomputed_fuse_4to1_pct: fusion.climaatmos_by_file.cache_precomputed_quantities.fuse_4to1_pct
        explanation: >-
          Every launch-count figure in this answer, from one profiled
          baseline/probe pair. host_us_per_launch is the price the rest rests
          on, measured back to back in a single invocation: an earlier
          cross-day estimate of 18.51 us would have inflated all of it by 2.7x.
          The band is the sub-25 microsecond launches, where host time around a
          launch exceeds GPU time inside it, and ceiling_all_removed_pct is
          quoted so the four-to-one ceiling cannot be read as a target.
          Per-package and per-file shares are attributed by the stack trace
          each launch was issued from; the band spans seven packages, so
          ClimaAtmos's share is the largest single one rather than most of the
          ceiling, and cache/precomputed_quantities.jl is here because
          CliMA/ClimaAtmos.jl#4261 proposes starting there.
      - kind: result
        path: results/kernel-population.json
        values:
          distinct_kernels: mod.distinct_kernels
          other_launches: mod.subsystems.other.launches
        explanation: >-
          The population the band is drawn from, which is what makes it a
          programme rather than an experiment: the launches are spread across
          many distinct kernels and mostly across call sites the attribution
          cannot name. The same file carries top_by_launch_count, where the
          largest in-band entries are a few tens of milliseconds each against
          roughly 25 seconds of kernel time.
      - kind: value
        path: results/kernel-shares.json
        key: baseline.small_kernels.pct_of_kernel_time
        name: small_band_pct_of_kernel_time
        explanation: >-
          What the sub-25 microsecond band costs on the DEVICE, from the
          current stack's kernel population. This is the pool fusion can eat
          into by not materializing intermediates, and it is unrelated to the
          host-side launch overhead priced above.
      - kind: document
        path: docs/experiments/launch-cost.md
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The experiment. It declares both profiling stages itself, so the pair
          cannot be split across sessions.
  - question: >-
      Can the SGS microphysics cache kernel be made faster from inside a single
      package, and how much is that worth?
    answer: >-
      Yes -- a clear-air early-out plus a slimmer evaluator payload make the
      kernel about 7.5% faster, bit-for-bit and entirely within ClimaAtmos --
      but the guard already fires at {guard_fires_pct:.2f}% of quadrature
      points, which caps skip-based work here near 4%, and the whole result is
      worth roughly +0.5% SYPD, below the full-AMIP noise floor. See
      docs/learnings.md 4r.
    evidence:
      - kind: table
        path: results/top-kernels.csv
        git_ref: exp/2026-09-15-microphysics-cache-atmos
        explanation: >-
          set_microphysics_tendency_cache_ 3434.8 -> 3177.7 ms (-7.49%). The
          same file at the null-test commit shows this kernel at +0.15% with
          identical arms, which is what makes the effect meaningful.
      - kind: value
        path: results/earlyout-hits.toml
        key: guard_fires_pct
        name: guard_fires_pct
        explanation: >-
          The share of 13.9M quadrature points still taking the early-out, so
          the decay from August's -21.5% is not a hit-rate problem.
          Deliberately NOT pinned. It was pinned to
          meas/2026-09-15-earlyout-hit-rate, which holds 88.31%, while calkit
          renders from the working tree, which holds 81.80% after the
          2026-09-21 stack update -- so the answer displayed one number and
          cited a tag carrying another. The stage is live and cheap, so the
          working-tree value is reproducible and the two now agree.
          The cap survives the move: it derives from the -3.27% kernel speedup
          that skipping those points buys, so 3.27/0.818 is still near 4%.
      - kind: table
        path: diffs/ClimaAtmos.jl.diff
        git_ref: exp/2026-09-15-microphysics-cache-atmos
        explanation: >-
          The whole treatment: arms_differ_in is ['ClimaAtmos.jl-mod'] and
          nothing else, which is what makes this a single-package result.
  - question: >-
      Can the radiation kernels be made faster without changing results, and
      which change is responsible?
    answer: >-
      Yes -- a binary search replacing a linear scan in RRTMGP's aerosol-optics
      interpolation is worth +7.95% SYPD on its own and carries essentially all
      of the +8.70% measured with a 64-thread block change added, with model
      state bit-identical over 120 coupled steps; it has since merged upstream as
      CliMA/RRTMGP.jl#628, so it is part of the baseline now. docs/learnings.md
      4m has the attribution.
      The register route is closed, which is worth stating because ncu points straight at it: these kernels are latency-bound, occupancy is pinned at the ceiling their register count sets, and fewer registers is the only thing that would buy warps to hide the latency with.
      Compiling them with the optional lookups present and absent shows that payload costs {lw_aerosol_cost:.0f} registers -- dropping the entire aerosol lookup, eleven array fields, frees nothing, because array descriptors live in parameter space rather than registers.
      All {lw_registers:.0f} are live arithmetic and the next occupancy step needs 170, so the shortfall is 85 registers rather than the handful that folding scalar parameters into compile-time constants could recover; capping registers to force that step was measured at 2.91% slower (docs/learnings.md 4v).
      The same run corrects two beliefs this project held: every variant spills, so radiation at "255 registers with zero spill" was wrong, and fusing the two skies added 24 bytes of spill rather than materially worsening pressure.
    evidence:
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: rrtmgp_pair_speedup_pct
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          +8.70% SYPD end to end for the pair. RRTMGP is the only package
          differing between arms. NOT templated into the answer: rendering reads
          the working tree, where results/summary.json holds a later run.
      - kind: table
        path: diffs/RRTMGP.jl.diff
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          The change itself, 69 lines across three files.
      - kind: table
        path: results/top-kernels.csv
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          Per-kernel confirmation: longwave -27.0% and shortwave -26.4%.
          Longwave moving is the attribution, since the block-size change
          affects only shortwave.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: binary_search_speedup_pct
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          The isolation, with block size left at RRTMGP's default in both arms:
          +7.95% SYPD. The 0.75-point gap against the pair sits inside the
          repeat spread, so the block change is not part of the proposal.
      - kind: table
        path: results/top-kernels.csv
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          Same isolation per kernel: radiation -26.92%, against -26.66% with the
          block change added, so the search alone is marginally better.
      - kind: table
        path: diffs/RRTMGP.jl-authored.diff
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          The proposed change in full: 30 lines in one function, as the branch's
          own delta since it diverged from RRTMGP main.
      - kind: result
        path: results/radiation-registers.toml
        values:
          lw_registers: lw_fused_cloud_aerosol.registers
          lw_aerosol_cost: lw_aerosol_register_cost
        explanation: >-
          Registers per thread for each radiation kernel, compiled with
          launch=false so nothing runs, varying only which optional lookups are
          passed. The deltas are the point: both are zero, which is what rules
          out slimming the payload. The file also carries local_bytes per
          variant, which is how the spill came to light -- 216 bytes fused and
          192 unfused for longwave, 256 shortwave, and non-zero even with no
          cloud or aerosol lookups at all.
      - kind: value
        path: results/state-rad-mod.toml
        key: steps
        name: bit_identical_steps
        git_ref: meas/2026-09-12-rrtmgp-bit-identical
        explanation: >-
          Bit-identity, not an accuracy trade: 0 of 12 prognostic fields differ
          against results/state-rad-baseline.toml at every snapshot across these
          coupled steps.
  - question: >-
      How much of a GPU kernel-time saving actually reaches SYPD?
    answer: >-
      It depends on where the saving is, and the difference is large enough to change what is worth doing: radiation work converts at {radiation_mean:.0f}% ({radiation_min:.0f}-{radiation_max:.0f}% over {radiation_n} experiments), microphysics work at {microphysics_mean:.0f}% ({microphysics_min:.0f}-{microphysics_max:.0f}% over {microphysics_n}).
      So the rule of thumb this project carried for months -- about a third of a kernel-time saving shows up end to end -- was measured entirely on microphysics and understates a radiation change by more than a factor of two.
      Both halves of each ratio are read out of the tag that recorded them: kernel time from the profiled nsys stages, SYPD from the unprofiled AMIP ones, which is the only number that answers "is the model faster".
      Why radiation converts better is NOT established. Plausible: radiation runs as a few very long kernels with nothing to overlap them against, while the microphysics kernel is one of thousands per step and its saving may be partly absorbed by whatever else is in flight. Treat the ratios as measured, the explanation as a hypothesis.
    evidence:
      - kind: result
        path: results/pass-through.json
        values:
          radiation_mean: by_subsystem.radiation.mean_pct
          radiation_min: by_subsystem.radiation.min_pct
          radiation_max: by_subsystem.radiation.max_pct
          radiation_n: by_subsystem.radiation.n
          microphysics_mean: by_subsystem.microphysics.mean_pct
          microphysics_min: by_subsystem.microphysics.min_pct
          microphysics_max: by_subsystem.microphysics.max_pct
          microphysics_n: by_subsystem.microphysics.n
        explanation: >-
          Both subsystems' conversion ratios, as mean, range and sample count.
          Each ratio is an end-to-end SYPD gain divided by the GPU kernel-time
          reduction that produced it, and the pass-through stage reads both
          halves out of the experiment tags with git show rather than from the
          working tree. The microphysics mean is where the "about a third" rule
          came from; radiation converts at roughly twice that.
      - kind: table
        path: experiments.csv
        explanation: >-
          The experiments themselves, each reproducible from its tag. The
          pass-through stage reads both halves of every ratio out of those
          tags with git show rather than from the working tree.
  - question: >-
      Can the clear-sky diagnostics be had for less than a second radiation
      solve?
    answer: >-
      Yes, and for most of the cost: the two passes differ only by the cloud increment, while the gas and aerosol optics they both recompute are {lw_optics_frac:.0%} of a longwave solve and {sw_optics_frac:.0%} of a shortwave one.
      Computing those once and sweeping twice -- gas and aerosol optics, sweep, accumulate the clear sky, then add the cloud increment to the same optics, sweep again, accumulate the all-sky -- removes {lw_fused_saving:.0%} of the longwave pair.
      Implemented for both bands on RRTMGP.jl branch `pb/fused-clear-sky`, proposed as CliMA/RRTMGP.jl#631, as solve_lw_both_skies! and solve_sw_both_skies! called from update_lw_fluxes! and update_sw_fluxes!, so nothing above RRTMGP changes: longwave 5702.5 -> 3216.7 ms (-43.6%) and shortwave 5051.0 -> 3038.2 ms (-39.8%), four radiation kernels becoming two.
      The longwave half was measured on its own first, at -8.5% of GPU kernel time with shortwave unchanged at -0.5% as the control that the change did what it claimed and nothing else.
      It is now correct in the strong sense, which it could not be before: the same PR keys McICA sampling on (key, column, g-point, layer), so the fused pass and two separate solves draw the SAME cloud mask and can be compared cell by cell.
      They agree to {fused_mean_diff:.2e} in the mean and {lw_max_abs:.1e} W/m2 in the worst longwave cell, which is the arithmetic order of applying the cloud increment to already-swept optics, not a different draw.
      Under the per-launch sampling this replaced, the same comparison gave 3.34e-3 and 51 W/m2 -- a different cloud field, indistinguishable from reseeding the reference, and unvalidatable by any cell-wise test.
      The clear sky, which involves no sampling, matches exactly in both regimes.
      Carried into the coupled state over {divergence_steps:.0f} coupler steps it still holds, though at the top of the envelope rather than in the middle of it: the fused run ends {final_fusion_diff:.2e} from the baseline against a median {control_median_diff:.2e} for three reseeded draws of the fused code, whose own spread is {control_spread:.1f}x, so the worst per-step ratio is {divergence_ratio:.2f}.
      Both bands fused are worth **+10.94% SYPD** (0.22759 -> 0.25554, tag exp/2026-09-24-fused-radiation): GPU kernel time falls 15.2%, radiation from 36.4% to 25.0% of it, and four radiation kernels become two.
      That is 87% of what deleting the clear-sky diagnostics buys (+12.6%), with the diagnostics kept -- so the question the bound posed to the science owners largely goes away.
    evidence:
      - kind: result
        path: results/radiation-split.toml
        git_ref: meas/2026-09-26-fused-remeasured
        values:
          lw_optics_frac: lw.optics_frac_of_allsky
          sw_optics_frac: sw.optics_frac_of_allsky
          lw_fused_saving: lw.fused_saving_frac_of_pair
        explanation: >-
          What each band's two passes duplicate, from timing the real solve
          against the same kernel with the two-stream sweep and flux
          accumulation removed. Both bands are fused, and each came within a
          couple of points of its own ceiling: half the optics share bounds
          what fusing a pair can save, so at most 44.3% for longwave against
          43.6% measured, and 41.5% for shortwave against 39.8%. Unpinned
          because this stage is live, and a pinned templated value renders the
          working tree's number while citing the tag's.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: fused_speedup_pct
        git_ref: exp/2026-09-24-fused-radiation
        explanation: >-
          Both bands fused, end to end, from the unprofiled AMIP stages with
          both arms measured in one session. The longwave half alone was
          +5.26% at exp/2026-09-23-fused-lw-optics. NOT templated: rendering
          reads the working tree, where results/summary.json holds whichever
          run wrote it last.
      - kind: result
        path: results/fused-lw-check.toml
        values:
          fused_mean_diff: fused_mean_rel_diff
          lw_max_abs: allsky.net.max_abs_diff
        explanation: >-
          Per-call agreement between the fused solve and the two it replaces, on
          a real AMIP state after 60 steps. Keyed sampling makes both draw the
          same cloud mask, so this is a cell-wise comparison and what remains is
          the arithmetic order of applying the cloud increment. The same file
          records the clear sky as exactly equal in both bands, and a clear/
          all-sky contrast of 0.61 -- which is what shows the cloud increment
          did something, rather than the check passing on a clear sky. Unpinned
          because the stage is live: a pinned templated value renders this run's
          number while citing an older one.
      - kind: result
        path: results/state-divergence.json
        git_ref: meas/2026-09-25-fused-state-divergence
        values:
          final_fusion_diff: final_fusion_rel_diff
          control_median_diff: final_control_median
          divergence_ratio: max_ratio_to_control_median
          control_spread: control_spread_ratio
          divergence_steps: steps
        explanation: >-
          The trajectory-level check, over 120 coupler steps. final_fusion_diff
          cannot be zero and says nothing on its own: it is read against
          control_median_diff, the same fused code at three radiation seeds, so
          the only difference between those runs is the cloud draw. The median
          rather than the maximum, because with three arms one bad arm sits in
          two pairs and moves the maximum as readily; control_spread is the
          guard that the three agree at all, and a spread failing it fails the
          comparison. An earlier version used a single control draw and
          reported 3.5 at step 80, which was two chaotic trajectories crossing
          rather than a defect.
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          Six radiation rows that read as the fusion directly: four baseline
          kernels, two longwave and two shortwave, against two fused mod kernels,
          10753.6 ms becoming 6248.0 ms. Each arm's rows have a blank column on
          the other side because the fused solves are new symbols, so the join
          cannot pair them -- they are separate kernels, not a kernel that
          changed. Unpinned deliberately: at exp/2026-09-24-fused-radiation this
          table ranked by baseline cost and kept the top twenty, so the fused
          kernels could not appear at all and the mod side was simply empty. It
          now ranks by whichever arm is larger.
  - question: >-
      How much of the radiation cost is clear-sky diagnostics rather than the
      fluxes the model runs on?
    answer: >-
      Half of it: {clear_sky_pct}% of GPU kernel time against {all_sky_pct}% for the fluxes that drive the model, out of {radiation_pct}% for radiation as a whole.
      The benchmark runs `rad: allskywithclear`, under which ClimaAtmos calls the RRTMGP solver twice per radiation step -- once with the cloud lookup passed as `nothing` -- so the profile carries two longwave and two shortwave kernels, told apart by whether their signature takes a LookUpCld argument rather than by cost.
      That second pass buys the clear-sky fluxes that cloud radiative effect diagnostics are computed from, so whether it is worth it is a question for whoever uses those diagnostics rather than a performance bug.
      Priced by a config-only bounding run, it is worth **+12.6% SYPD** (0.22759 -> 0.26040, tag exp/2026-09-22-clearsky-bound): GPU kernel time falls 17.9% and the two cloud-free kernels disappear while the all-sky kernels move under 0.5%, so the run removes that work and nothing else.
      Two caveats on reading that: it changes results, so it is a bound and not a proposal, and the benchmark fires radiation every 20 steps against the nightly's 30, so radiation is over-weighted here relative to production.
      The conversion is the part worth carrying forward: 17.9% of kernel time bought 12.6% of SYPD, about 70%, where this project's earlier work converted at about a third -- removing a large dense block pays far better than rescheduling one.
    evidence:
      - kind: result
        path: results/kernel-population.json
        values:
          clear_sky_pct: baseline.radiation.clear_sky.pct_of_kernel_time
          all_sky_pct: baseline.radiation.all_sky.pct_of_kernel_time
          radiation_pct: baseline.radiation.pct_of_kernel_time
        explanation: >-
          Radiation split by whether the solve takes a LookUpCld argument,
          which makes this an attribution from the kernel signature rather than
          an inference from which kernel happens to be cheaper, with radiation
          as a whole for scale.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: clearsky_bound_speedup_pct
        git_ref: exp/2026-09-22-clearsky-bound
        explanation: >-
          What dropping the second solve is worth end to end, from the
          unprofiled AMIP stages with both arms measured in one session. NOT
          templated: rendering reads the working tree, where
          results/summary.json holds whichever run wrote it last.
      - kind: table
        path: results/top-kernels.csv
        git_ref: exp/2026-09-22-clearsky-bound
        explanation: >-
          Per-kernel confirmation: the two solves with no cloud lookup vanish
          and the all-sky pair is unchanged, which is what makes the SYPD
          delta attributable to the clear-sky work alone.
  - question: >-
      Where does the AMIP simulation's GPU time actually go, and is the
      microphysics kernel the right thing to optimize?
    answer: >-
      No -- radiation is the largest block at {radiation_pct:.1f}% of GPU kernel
      time against {microphysics_hot_kernel_pct:.1f}% for the microphysics kernel
      this project targeted, and with host time outside the GPU timeline at
      {gap_frac_of_wall:.3%} of wall the run is densely GPU-bound, so kernel time
      is what there is to attack. See docs/learnings.md 4k.
    evidence:
      - kind: result
        path: results/kernel-shares.json
        values:
          radiation_pct: baseline.radiation_pct
          microphysics_hot_kernel_pct: baseline.microphysics_hot_kernel_pct
        explanation: >-
          Baseline-arm shares of GPU kernel time: the four RRTMGP rte_*_2stream
          kernels together, and the largest set_microphysics_tendency_cache
          specialization. The binary search that merged upstream took radiation
          from 43.9% to where it is now.
      - kind: value
        path: results/step-breakdown.toml
        key: gap_frac_of_wall
        name: gap_frac_of_wall
        explanation: >-
          Measured WITHOUT a profiler, using CUDA events. nsys cannot answer
          this: its own instrumentation dominates the idle measurement, and it
          reports MORE idle for the faster arm (docs/learnings.md 2b-i, 4f).
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          The per-kernel breakdown on the 120-step phase-independent window,
          which is LCM(20, 60, 120) of the periodic processes and so fires every
          scheme at its exact long-run share. The earlier 40-step window was
          shorter than the gravity-wave period and made microphysics look
          dominant.
  - question: >-
      What actually limits the hot SGS-quadrature microphysics kernel, and which
      of the available levers can move it?
    answer: >-
      Register pressure, and it is addressable by payload after all -- which is the opposite of what this answer said for three weeks.
      The kernel the model runs compiled to {fold_quad_regs_baseline:.0f} registers, the hardware maximum per thread, which bought it {fold_quad_warps_baseline:.0f} warps per SM out of 64; the isolated quadrature body also wants more than the cap and spills {quad_spill:.0f} bytes, so the live state is genuinely large.
      The payload lever is open after all, and reading it as shut cost three null measurements: the parameters were reaching the kernel inside an evaluator struct, which boxes a compile-time constant into a field and reads it back per quadrature point, so the fold was being erased at the struct boundary rather than refused by the loop.
      Putting them in the struct's TYPE instead takes the kernel from {fold_quad_regs_baseline:.0f} registers to {fold_quad_regs_mod:.0f} and {fold_quad_warps_baseline:.0f} warps per SM to {fold_quad_warps_mod:.0f}, worth {fold_quad_change:.1f}% on the kernel (see the question on Val and CliMA/ClimaCore.jl#2676).
      What remains is reducing the live state itself -- fewer quadrature points, which was priced and withdrawn, or fewer live values per point -- and that is now the lever for the NEXT occupancy step, which this kernel reaches at {fold_quad_next_step:.0f} registers.
    notes: >-
      Answered for the stack before the 2026-09-21 update in docs/learnings.md 2c
      and 4a: register pressure at the 255-register cap, with a guarded
      __launch_bounds__ occupancy target as the lever that works. That update
      re-enabled cloud ice formation and liquid freezing in the 1M microphysics,
      which changes this kernel, so it needs re-measuring; the ncu stages that would
      show its registers and spilling are frozen.

      One lever is now ruled out by measurement rather than argument. The
      kernel's parameters -- CloudMicrophysics 1M params at 348 bytes and
      thermodynamics params at 104 -- are isbits, so Julia accepts them as type
      parameters, and folding them that way is something ClimaAtmos can do
      alone: microphysics_tendencies_1m, Microphysics1MEvaluator and
      integrate_over_sgs are all ClimaAtmos code, so no CloudMicrophysics
      release is involved. In isolation the fold is dramatic, taking one
      evaluation body from {val_args:.0f} registers to {val_val:.0f} and
      clearing two occupancy steps.

      On the path the model runs, a plain Val bought nothing: the quadrature
      body sits at {quad_args:.0f} registers with or without it, spilling
      {quad_spill:.0f} bytes. That was read as the loop's live state consuming
      every freed register, and it was wrong -- the Val was being passed to a
      function that stored it in an evaluator FIELD, which boxes the constant
      and reads it back per quadrature point. The same body with the parameters
      in the struct's type compiles to {eval_type_regs:.0f} registers and
      {eval_type_spill:.0f} bytes against {eval_field_regs:.0f} and
      {eval_field_spill:.0f}, and the change applied to the model is worth
      {fold_quad_change:.1f}% on this kernel. What docs/learnings.md left open
      -- whether the 255 is a demand or the cap -- is answered the other way:
      enough of it was payload to clear an occupancy step.
    evidence:
      - kind: result
        path: results/val-params-registers.toml
        values:
          val_args: runtime_arguments.registers
          val_val: val_type_parameters.registers
          quad_args: quad_runtime_arguments.registers
          quad_spill: quad_runtime_arguments.local_bytes
          eval_field_regs: evaluator_params_as_fields.registers
          eval_field_spill: evaluator_params_as_fields.local_bytes
          eval_type_regs: evaluator_params_in_type.registers
          eval_type_spill: evaluator_params_in_type.local_bytes
        explanation: >-
          One microphysics body compiled three ways -- parameters as runtime
          arguments, as const globals, and folded through Val -- for an isolated
          evaluation and for the quadrature path the model actually calls. The
          isolated columns are why the idea looked promising and the quadrature
          columns are why it is dead: Val lands exactly on the const-global
          figure in both, which is the mechanism working, and in the quadrature
          case that figure is the 255-register cap. Compile-only, so nothing
          runs, and standalone, so it needs no coupled simulation.
      - kind: result
        path: results/param-fold.json
        values:
          fold_quad_regs_baseline: kernels.microphysics_quadrature.baseline.registers
          fold_quad_regs_mod: kernels.microphysics_quadrature.mod.registers
          fold_quad_warps_baseline: kernels.microphysics_quadrature.baseline.warps_per_sm
          fold_quad_warps_mod: kernels.microphysics_quadrature.mod.warps_per_sm
          fold_quad_change: kernels.microphysics_quadrature.mean_change_pct
          fold_quad_next_step: kernels.microphysics_quadrature.mod.registers_for_next_step
        explanation: >-
          The kernel as the profiled run compiled it, in both arms: registers
          per thread, the block size ClimaCore chose from them, and the warps
          per SM the pair allows. Read from the nsys databases rather than
          results/top-kernels.csv because that table averages over a kernel
          name, and one name this treatment touches covers two kernels at
          different register counts.
      - kind: value
        path: results/cm-registers.toml
        key: layers.LinearizedAverage nsub=2.registers
        name: linearized_avg_registers
        explanation: >-
          A full 1M CloudMicrophysics evaluation, compiled standalone with the
          parameter structs passed as kernel ARGUMENTS -- as const globals the
          compiler folds their fields and understates pressure enough to invert
          the conclusion, which it once did. Independent of substep count, so
          microphysics_n_substeps_quadrature costs time but not occupancy. This
          stage is cheap and not frozen, so it re-runs against whatever is
          checked out; read its revision before comparing.
      - kind: value
        path: results/kernel-population.json
        key: baseline.gpu_idle_pct
        name: gpu_idle_pct
        explanation: >-
          READ AS A PROFILING ARTIFACT, NOT A TARGET. The profiler's own tracing
          runs to ~33 CUDA API calls per launch and accounts for the bulk of
          this idle; the profiled window does not even run at the same rate as
          the real one. Kernel TIMES from nsys are device-side and trustworthy;
          the gaps between them are not. See docs/learnings.md 2b-i.
      - kind: result
        path: results/launch-bounds/launch-bounds.toml
        git_ref: exp/2026-09-01-cm-fuse
        explanation: >-
          The three phases this answer compares, in one file: the hot
          SGS-quadrature kernel with launch bounds off, which is what the
          baseline arm runs; the counterfactual with the spill budget loosened
          until the annotation is accepted, reaching 12 warps/SM; and the
          shipped configuration, where the single-call kernel is annotated for
          a small spill cost. guarded.decisions records which kernels were
          accepted. Measuring the rejected configuration deliberately is the
          point, and is what showed the guard was right rather than arbitrary.
      - kind: table
        path: results/kernel-resources.csv
        git_ref: exp/2026-09-07-evaluator-repeat
        explanation: >-
          What establishes the kernel as register-limited rather than
          memory-limited. Pinned because the ncu stages are frozen; cited for
          the characterization of the baseline kernel, which has been stable
          across revisions, not as evidence for any treatment's effect.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          The pipeline-level number this kernel work has to show up in
          eventually. Kernel times are not SYPD, and this mechanism measured a
          SYPD null on its own.
  - question: >-
      Does putting the parameters in `Val` make pointwise kernels measurably faster across the board, as CliMA/ClimaCore.jl#2676 asks?
    answer: >-
      Yes, where the parameters are a real share of the kernel's live state, and the SIZE of the payoff is set by whether the freed registers let one more block fit on an SM.
      Four kernels in ClimaAtmos now have it, measured in the model rather than in isolation, and now measured twice: an upstream change to these kernels moved two of the four across that line in opposite directions, which prices the step itself.
      Three cross one on the current stack: the SGS quadrature {fold_quad_regs_baseline:.0f} -> {fold_quad_regs_mod:.0f} registers, {fold_quad_warps_baseline:.0f} -> {fold_quad_warps_mod:.0f} warps per SM, {fold_quad_change:.1f}% on the kernel; the SGS-moments kernel {fold_sgs_regs_baseline:.0f} -> {fold_sgs_regs_mod:.0f} registers, {fold_sgs_warps_baseline:.0f} -> {fold_sgs_warps_mod:.0f} warps, {fold_sgs_change:.1f}%; the cloud-fraction kernel {fold_cf_regs_baseline:.0f} -> {fold_cf_regs_mod:.0f} registers, {fold_cf_warps_baseline:.0f} -> {fold_cf_warps_mod:.0f} warps, {fold_cf_change:.1f}%.
      The fourth does not: the updraft path sheds {fold_upd_regs_saved:.0f} registers, {fold_upd_regs_baseline:.0f} -> {fold_upd_regs_mod:.0f}, and still sits at {fold_upd_warps_mod:.0f} warps per SM, one block short of the next step, which it would reach at {fold_upd_next_step:.0f} registers.
      It took {fold_upd_change:.1f}% anyway, so a fold that misses a step is not a fold that does nothing -- an earlier answer here said the payoff was all-or-nothing, and this measurement withdraws that.
      What the step is worth can be read off the two kernels that switched sides between the stacks: the updraft path crossed a step before and lost it to an added argument, giving back {fold_upd_lost_points:.1f} points of payoff, while the SGS-moments kernel gained a step and picked up {fold_sgs_gained_points:.1f}.
      Both moved the way the step predicts, in opposite directions, by a similar amount, and that agreement is the strongest form this evidence has taken; it is not a controlled comparison, because the same upstream change also altered the kernel bodies.
      Register count does not predict which case a kernel is in: two kernels that both start at the {fold_quad_regs_baseline:.0f}-register cap land on opposite sides of a step, while a {fold_cf_regs_baseline:.0f}-register one crosses.
      The distance to the next step does predict it, and it is computable before any code is written, because ClimaCore sizes the launch block from the register count and warps per SM follow from the pair.
      Across the whole device this is {fold_total_change:.2f}% of kernel time on a 120-step window, {fold_total_saved:.0f} ms, concentrated almost entirely in the first kernel.
      The population bounds how far it can go: of {kernels:.0f} kernels profiled, {addressable:.0f} ({addressable_pct}%) are capped by registers alone AND below full occupancy, while {at_full_occupancy:.0f} are already at full occupancy and can gain nothing however well their parameters fold.
      The mechanism is settled: Val folds an isbits parameter set to literals and lands on the const-global register count exactly, taking an isolated microphysics evaluation body from {val_args:.0f} registers to {val_val:.0f}, {arg_warps:.0f} to {val_warps:.0f} warps per SM.
      The thing that will defeat anyone applying it is the struct boundary: an evaluator holding the parameters as FIELDS boxes the constant and reads it back per point, {eval_field_regs:.0f} registers and {eval_field_spill:.0f} bytes of spill against {eval_type_regs:.0f} and {eval_type_spill:.0f} for the same body with the parameters in the type.
      Three earlier measurements here reported Val as worthless for exactly that reason, including on the kernel it later improved by half.
    evidence:
      - kind: result
        path: results/val-params-registers.toml
        values:
          val_args: runtime_arguments.registers
          val_val: val_type_parameters.registers
          arg_warps: runtime_arguments.warps_per_sm
          val_warps: val_type_parameters.warps_per_sm
          quad_args: quad_runtime_arguments.registers
          quad_val: quad_val_type_parameters.registers
          quad_spill: quad_runtime_arguments.local_bytes
          quad_val_spill: quad_val_type_parameters.local_bytes
          eval_field_regs: evaluator_params_as_fields.registers
          eval_field_spill: evaluator_params_as_fields.local_bytes
          eval_type_regs: evaluator_params_in_type.registers
          eval_type_spill: evaluator_params_in_type.local_bytes
          mp_bytes: mp_sizeof_bytes
          tps_bytes: tps_sizeof_bytes
        explanation: >-
          One microphysics body compiled three ways -- parameters as runtime
          arguments, as const globals, and folded through Val -- for an isolated
          evaluation and for the quadrature path the model calls. The
          const-global column is the target, so Val matching it is the mechanism
          working rather than a coincidence, and in the quadrature case that
          target is itself the register cap. Compile-only with
          `CUDA.@cuda launch=false`, so nothing executes, and standalone, so it
          needs no coupled simulation: the stage is minutes.
      - kind: result
        path: results/pointwise-registers.json
        values:
          kernels: kernels
          addressable: addressable
          addressable_pct: addressable_pct
          addressable_at_cap: addressable_at_cap
          at_full_occupancy: at_full_occupancy
          register_limited: register_limited
        explanation: >-
          The population the question asks about, measured rather than
          extrapolated: for every kernel in a 120-step run, its registers and
          which of the four occupancy limits binds. Static launch metrics only,
          so ncu needs no kernel replay and the whole population costs one job
          instead of the ninety minutes per six kernels that the frozen --set
          full stages cost. results/pointwise-registers.csv has the per-kernel
          rows behind it, including which kernels sit at the cap.
      - kind: result
        path: results/param-fold.json
        values:
          fold_quad_regs_baseline: kernels.microphysics_quadrature.baseline.registers
          fold_quad_regs_mod: kernels.microphysics_quadrature.mod.registers
          fold_quad_warps_baseline: kernels.microphysics_quadrature.baseline.warps_per_sm
          fold_quad_warps_mod: kernels.microphysics_quadrature.mod.warps_per_sm
          fold_quad_change: kernels.microphysics_quadrature.mean_change_pct
          fold_upd_regs_baseline: kernels.microphysics_updraft.baseline.registers
          fold_upd_regs_mod: kernels.microphysics_updraft.mod.registers
          fold_upd_regs_saved: kernels.microphysics_updraft.registers_saved
          fold_upd_warps_mod: kernels.microphysics_updraft.mod.warps_per_sm
          fold_upd_next_step: kernels.microphysics_updraft.mod.registers_for_next_step
          fold_upd_change: kernels.microphysics_updraft.mean_change_pct
          fold_upd_lost_points: vs_prior_stack.switched.microphysics_updraft.payoff_points
          fold_cf_regs_baseline: kernels.cloud_fraction.baseline.registers
          fold_cf_regs_mod: kernels.cloud_fraction.mod.registers
          fold_cf_warps_baseline: kernels.cloud_fraction.baseline.warps_per_sm
          fold_cf_warps_mod: kernels.cloud_fraction.mod.warps_per_sm
          fold_cf_change: kernels.cloud_fraction.mean_change_pct
          fold_sgs_regs_baseline: kernels.sgs_moments.baseline.registers
          fold_sgs_regs_mod: kernels.sgs_moments.mod.registers
          fold_sgs_warps_baseline: kernels.sgs_moments.baseline.warps_per_sm
          fold_sgs_warps_mod: kernels.sgs_moments.mod.warps_per_sm
          fold_sgs_change: kernels.sgs_moments.mean_change_pct
          fold_sgs_gained_points: vs_prior_stack.switched.sgs_moments.payoff_points
          fold_total_change: device_total.change_pct
          fold_total_saved: device_total.ms_saved
        explanation: >-
          The four kernels the pattern was applied to, as the profiled runs
          compiled them: registers per thread, the block size ClimaCore chose
          from them, the warps per SM the pair allows, and the time. This is
          what makes the answer an in-model result rather than a compile-only
          one -- and the SGS-moments row is the control the other three need,
          since it had the fold applied the same way and did not cross a step.
          Read from the nsys databases rather than results/top-kernels.csv,
          which averages over a kernel name that here covers two kernels at
          different register counts.
      - kind: value
        path: results/cm-registers.toml
        key: layers.LinearizedAverage nsub=2.registers
        name: linearized_avg_registers
        explanation: >-
          Why a layer compiled on its own misleads: it has room for a payload
          saving to appear in its register count, where the broadcast the model
          runs is split into several smaller kernels whose limits differ. Any
          register experiment answers for the body it compiles.
  - question: >-
      Is the nine-point SGS quadrature in the 1-moment microphysics earning the
      throughput it costs?
    answer: >-
      Yes on the current stack, and the measurement that suggested otherwise was answering a narrower question than it appeared to.
      The subgrid PDF still sits a median of {mu_over_sigma_p50:.0f} standard deviations from the SATURATION kink, with {clear_of_kink_10sigma_warp_frac:.2%} of warps entirely clear of it, so by that criterion the quadrature looks idle.
      But reducing the rule to 2x2 changes {order2_changed_frac:.1%} of cells, so it is plainly integrating something: the cloud ice formation and liquid freezing that upstream re-enabled on 2026-09-21 are nonlinear in temperature away from saturation, and the quadrature integrates over temperature too.
      Distance from the saturation kink is therefore necessary but not sufficient evidence that a quadrature is degenerate, which is the part worth carrying forward. docs/sgs-quadrature.md is the write-up, and docs/learnings.md 6a has the distribution.
    evidence:
      - kind: document
        path: docs/sgs-quadrature.md
        explanation: >-
          The decision record, including why the distance-from-kink argument
          was not sufficient.
      - kind: value
        path: results/quadrature-order-error.toml
        key: order_2.changed_frac
        name: order2_changed_frac
        explanation: >-
          What decides it: the share of cells whose tendencies change when the
          rule is reduced. A quadrature integrating nothing would change none
          of them.
      - kind: result
        path: results/sgs-degeneracy.toml
        values:
          mu_over_sigma_p50: mu_over_sigma_percentiles.p50
          clear_of_kink_10sigma_warp_frac: criteria.clear_of_kink_10sigma.warp_frac
        explanation: >-
          Median |mu_S| / sigma_S across all 1,548,288 cells, and the fraction
          of 32-cell groups in which every cell is clear of the kink. The warp
          fraction is what decides whether collapsing could pay on a GPU, since
          a warp costs the maximum over its lanes. The same file carries p1, so
          even the worst percentile is clear of the kink.
      - kind: table
        path: experiments.csv
        explanation: >-
          What the quadrature costs, measured and tagged rather than quoted:
          compare 2026-09-08-quadrature-order-1 against
          2026-09-07-evaluator-repeat, the same stack with the nine-point rule.
          A configuration-only change that alters results and was reverted -- an
          upper bound attached to the question, not a proposal.
  - question: >-
      How much of a GPU profiling job is compilation rather than computation,
      and can any caching strategy recover it between jobs?
    hypothesis: >-
      Most of a profiling job is compilation, and caching it between jobs --
      first GPUCompiler's on-disk kernel cache, then a PrecompileTools warmup
      package -- should recover a large part of it.
    answer: >-
      Compilation is {compile_share_pct}% of the job and it is host-side Julia
      JIT rather than GPU kernel compilation, so neither strategy recovered any
      of it: GPUCompiler's disk cache writes zero files in this stack, and the
      AMIPWarmup package made the job {warmup_penalty_pct}% slower, with the
      penalty landing inside the very phase it was built to speed up.
    evidence:
      - kind: document
        path: docs/compile-time.md
        git_ref: 0551f45
        explanation: >-
          The measurement, both failed strategies, and the recipe for re-running the study at its tag.
          Pinned because the document is downstream of the frozen compile-time-study,
          so nothing would report it stale. Its only input is the pinned TOML above,
          so the pin is about naming which rendering this answer was written against,
          not about the figures, which cannot drift.
      - kind: result
        path: results/compile-time/compile-time.toml
        git_ref: compile-time-warmup-ab
        explanation: >-
          The study's raw timings: the status quo, the AMIPWarmup test in the
          same SLURM job on the same GPU running second (the ordering that
          would flatter it if anything), where the penalty lands, host-side JIT
          alone from Julia's own @timed accounting, and the steady-state cost
          of one step once everything is compiled. Pinned to the only rev where
          this stage's inputs exist, since the AMIPWarmup wiring was reverted
          immediately. GPU kernel compilation is not in the host-compile
          figure, because GPUCompiler runs outside that accounting.
      - kind: result
        path: results/compile-time/doc-values.json
        values:
          compile_share_pct: warmup_off.compile_share_pct
          warmup_penalty_pct: penalty.wall_pct
        explanation: >-
          The two derived shares this answer quotes, computed from the pinned
          measurement above by the compile-time-doc stage. Unpinned on purpose:
          this is the file the write-up injects from, so the answer and
          docs/compile-time.md cannot disagree. The sign of the penalty is the
          result -- this was a negative result, not a null one.
tables:
  - path: results/top-kernels.csv
    title: Top 20 GPU kernels, baseline vs. mod
    description: >-
      Per-kernel Nsight Systems aggregates for the top 20 kernels ranked by
      baseline total time, covering both the baseline and modified runs:
      invocation counts, total and mean duration, share of total GPU time,
      registers per thread, and the percent change in total time.

  - path: results/kernel-resources.csv
    title: Per-kernel register, spill, and occupancy stats
    description: >-
      Nsight Compute resource metrics for the profiled microphysics kernels,
      baseline vs. mod: registers per thread, register spilling (requests and
      the share of memory traffic they cost), stack frame, and achieved vs.
      theoretical occupancy.

      This exists because the nsys table above cannot show the mechanism behind
      the headline speedup. The hot kernel can sit pinned at the 255-register
      cap in BOTH cases, so by the columns nsys collects nothing changed at all,
      while its total time falls by half. Registers at the cap is not the same
      thing as spilling, and nsys does not collect spill metrics -- only Nsight
      Compute does. Specific figures are deliberately left to the table rather
      than quoted here, so this description cannot go stale against the data it
      describes.

environments:
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_options:
      - --gpus=1
      - --time=120
  sassy:
    kind: system
    host: sassy.caltech.edu
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.13"

pipeline:
  stages:
    record-treatment:
      # Reports git state -- submodule SHAs, refs, whether a tree was dirty --
      # which DVC cannot see, because its declared inputs are file contents.
      # Committing a submodule changes no content, so the stage was skipped as
      # unchanged while the very thing it records had changed, and it kept
      # reporting a stale SHA and a dirty tree that was no longer dirty.
      # It is CPU-only and takes seconds, so it runs every time.
      always_run: true
      kind: python-script
      environment: py
      script_path: scripts/record-treatment.py
      # What actually ran, as opposed to what a commit message says ran. A
      # superproject commit pins every submodule SHA, but not whether a package
      # was dev'd into the AMIP environments (a submodule can be checked out and
      # irrelevant), nor whether a tree was dirty, nor which CLIMA_* variables
      # the stages exported. Each of those has changed the meaning of a result
      # in this project at least once.
      #
      # Depends on diffs/ rather than the submodules directly, so it re-runs
      # after make-diffs has observed the same state, and cannot disagree with
      # the archived diff.
      inputs:
        - from_stage_outputs: make-diffs
        - calkit.yaml
      outputs:
        - path: results/treatment.json
          storage: git
    make-diffs:
      kind: shell-script
      environment: _system
      script_path: scripts/make-diffs.sh
      inputs:
        - ClimaCoupler.jl
        - ClimaCoupler.jl-mod
        - ClimaCore.jl
        - ClimaCore.jl-mod
        - ClimaAtmos.jl
        - ClimaAtmos.jl-mod
        - CloudMicrophysics.jl-mod
        - RRTMGP.jl
        - RRTMGP.jl-mod
      outputs:
        - path: diffs
          storage: git
    baseline-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/baseline
        - ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/nsys/baseline.nsys-rep
        - results/nsys/baseline.sqlite
    mod-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/nsys/mod
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
