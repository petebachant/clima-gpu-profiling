    amip-nodiag:
      # Frozen 2026-11-03: one reservation per pass for the diagnostics-off
      # arm. The cost is measured and written up, and no kernel treatment
      # changes it, so the pass was paying for a constant.
      #
      # Frozen together with diagnostics-cost, which differences this arm
      # against amip-baseline. Freezing one alone is the ncu failure in another
      # costume: a stale diagnostics-off run paired with a fresh
      # diagnostics-on run, reported as a sampling cost with nothing saying so.
      #
      # The figures behind it were taken at z_elem 63. The benchmark config
      # moved to z_elem 79 with update_cache_every: stage on 2026-11-03, which
      # changes the share of wall a write step carries, so unfreeze the pair and
      # re-measure before quoting write_steps_pct_of_wall against the current
      # config.
      frozen: true
      # The baseline arm with diagnostics disabled, for differencing against
      # amip-baseline. The config is generated by the script and deleted on exit
      # rather than committed, so the submodule never goes dirty mid-pipeline.
      kind: shell-script
      environment: clima
      script_path: scripts/run-amip-nodiag.sh
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.13.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
        - ClimaAtmos.jl/toml
    diagnostics-cost:
      # Frozen 2026-11-03 with amip-nodiag, which supplies its off arm; see the
      # reasoning there. It is CPU-only and cheap -- it is frozen for
      # correctness, not for time, because it would otherwise divide a frozen
      # off arm against a fresh on arm every pass.
      frozen: true
      kind: python-script
      environment: py
      script_path: scripts/diagnostics-cost.py
      inputs:
        - results/step-comparison.json
        # Not a stage output: appended by scripts/record-sypd-repeat.py. It
        # supplies the spread the sampling residual has to clear to be a
        # measurement, so a new pair should restate whether it clears it.
        - results/sypd-repeats.json
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-nodiag
      outputs:
        - path: results/diagnostics-cost.json
          storage: git
    summarize:
      kind: python-script
      environment: py
      script_path: scripts/summarize.py
      inputs:
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
        - results/step-comparison.json
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: results/summary.json
          storage: git
    compare-kernels:
      kind: jupyter-notebook
      notebook_path: notebooks/compare-kernels.ipynb
      environment: py
      inputs:
        - from_stage_outputs: baseline-nsys
        - from_stage_outputs: mod-nsys
      outputs:
        - path: results/top-kernels.csv
          storage: git
      html_storage: git
      executed_ipynb_storage: git
    pass-through:
      kind: python-script
      script_path: scripts/pass-through.py
      environment: py
      # Reads each experiment out of its tag with git show, so it has no file
      # inputs and nothing in the working tree can change what it reports.
      always_run: true
      outputs:
        - path: results/pass-through.json
          storage: git

    record-sypd-repeat:
      kind: python-script
      script_path: scripts/record-sypd-repeat.py
      environment: py
      # Appends one AMIP pair per pass to an accumulating record, keyed on a
      # hash of both logs so re-running without a new measurement cannot
      # inflate the count. `delete_before_run: false` is load-bearing: DVC
      # deletes a stage's outputs before running it, which for an append-only
      # record would destroy every earlier pair. Always runs because what makes
      # a pair new is the logs being rewritten, which the dedupe guard checks.
      always_run: true
      inputs:
        - results/null-record/summary.json
        # Declared so the census runs first: the floor a pair is read against is
        # the mean over every null at this window, not the one pinned above it.
        - results/null-census.json
        - from_stage_outputs: record-treatment
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: results/sypd-repeats.json
          storage: git
          delete_before_run: false
    census-null-tests:
      kind: python-script
      script_path: scripts/census-null-tests.py
      environment: py
      # Walks the committed history for passes whose arms were identical, so its
      # source is git rather than any file DVC can hash. Every new pass can add
      # one, and a null test is the only thing that measures the noise floor.
      always_run: true
      outputs:
        - path: results/null-census.json
          storage: git
    snapshot-tag-records:
      kind: python-script
      script_path: scripts/snapshot-tag-records.py
      environment: py
      # Copies each measurement's figures out of its tag with git show, so it has
      # no file inputs and the next pass cannot rewrite what it reports. The fold
      # is one record and the null test that calibrates it is the other.
      always_run: true
      outputs:
        - path: results/fold-record/summary.json
          storage: git
        - path: results/fold-record/step-comparison.json
          storage: git
        - path: results/fold-record/param-fold.json
          storage: git
        - path: results/fold-record/provenance.json
          storage: git
        - path: results/null-record/summary.json
          storage: git
        - path: results/null-record/step-comparison.json
          storage: git
        - path: results/null-record/param-fold.json
          storage: git
        - path: results/null-record/provenance.json
          storage: git

    export-kernel-resources:
      kind: python-script
      environment: py
      script_path: scripts/export-kernel-resources.py
      # Reads the CSVs Nsight Compute already exported, so this needs no GPU and
      # is not frozen alongside the ncu stages that produce them.
      inputs:
        - from_stage_outputs: baseline-ncu
        - from_stage_outputs: mod-ncu
      outputs:
        - path: results/kernel-resources.csv
          storage: git
    compile-time-doc:
      kind: markdown
      target_path: docs/compile-time.md
      environment: py
      # Live on main, unlike the experiment documents. Its only input is the
      # committed results/compile-time/compile-time.toml, which the frozen
      # compile-time-study stage does not regenerate here, so re-running this
      # cannot restate the experiment against a different run.
    pass-through-doc:
      kind: markdown
      target_path: docs/pass-through.md
      environment: py
      # Live on main. It declares a values stage that reads the two results
      # files its prose quotes, which is what makes the document a pipeline node
      # rather than hand-written text: it goes stale when they do, and `calkit
      # run` restates it. One of those files is a snapshot of a measurement's
      # tag, so the figures do not move when a later pass measures something
      # else.
    wave-census-doc:
      kind: markdown
      target_path: docs/experiments/wave-census.md
      environment: py
      # Live on main rather than frozen. The template's reason for freezing an
      # experiment document is that a shared nsys path holds whichever
      # experiment ran last, so a live document would be regenerated against a
      # different run. This one reads only committed results files -- the
      # census, the two g-point sweeps and the longwave document's derived
      # values -- and never the profile itself, so there is nothing for a later
      # pass to clobber.
      #
      # Its values stage converts TOML to JSON because value markers read JSON
      # only, and derives the device-time-to-SYPD conversion the prose argues
      # from. That conversion is anchored on the one case where both ends are
      # measured, so it cancels the profiling window's length rather than
      # needing it declared.
    gpoint-group-count-doc:
      kind: markdown
      target_path: docs/experiments/gpoint-group-count.md
      environment: py
      # Live on main although it is an experiment document. The template's
      # reason for an experiment declaring its own profiling stages is that a
      # shared nsys path holds whichever experiment ran last; this one reads
      # results/gpoint-sweep.toml, which the gpoint-group-sweep stage writes and
      # nothing else touches, so there is nothing for a later pass to clobber.
      # Its values stage converts that TOML to JSON because value markers read
      # JSON only, and derives the per-GiB and increment columns the prose
      # argues from.
    sgs-substep-cost:
      kind: markdown
      target_path: docs/experiments/sgs-substep-cost.md
      environment: py
      # Declares its own GPU stage, per the template, because it is the first
      # experiment to take ClimaAtmos.jl-mod/src as an input: the closure it
      # measures is that code, so a microphysics edit moves the answer and has
      # to restale it. Freeze it on main once it has run and been tagged.
    wall-clock-conversion-doc:
      kind: markdown
      target_path: docs/wall-clock-conversion.md
      environment: py
      # Live on main. Every figure it quotes comes from the snapshot copies
      # under results/fold-record/ and results/null-record/ rather than the live
      # results files, because the live ones describe whatever ran last -- and
      # what ran last is a null test, which would render this prose at roughly
      # zero.
    diagnostics-cost-doc:
      kind: markdown
      target_path: docs/diagnostics-cost.md
      environment: py
      # Live on main, and unpinned on purpose: it describes the current
      # benchmark, and both halves of the difference it reports are regenerated
      # together by the same pass, so the ratio cannot come to mix two
      # configurations.
    launch-cost:
      kind: markdown
      target_path: docs/experiments/launch-cost.md
      environment: py
      # Frozen on main, live at meas/2026-09-19-launch-cost, following
      # compile-time-study. The 2026-09-21 submodule
      # update moved the whole stack, which makes both nsys stages this
      # document declares stale. Re-running them here would re-profile for
      # hours and then restate the experiment against a different stack --
      # and because a templated value renders from the WORKING TREE rather
      # than from its git_ref, the fusion-ceiling answers would quietly start
      # displaying the new numbers while their evidence still checked against
      # the tag. Re-measure by tagging a new experiment, not by re-running
      # this one.
      frozen: true
    step-breakdown:
      # Frozen 2026-11-03: two 90-minute reservations per pass for a
      # measurement no live claim rests on. The CUDA-event breakdown answered
      # how much of a coupler step is GPU work -- the question nsys cannot
      # answer, docs/learnings.md 2b-i -- and that question is settled. The
      # documents that quote a conversion read the pinned
      # results/fold-record/ and results/null-record/ snapshots, not this
      # stage's live output. That live output also still carries the section-8g
      # near-zero-divisor pathology, a conversion of tens of thousands of
      # percent, so regenerating it every pass reproduces a known-bad number at
      # a cost of three cluster hours.
      #
      # Unfreeze BOTH step-breakdown stages together, the way the ncu pair is
      # unfrozen, so the two arms describe one revision. compare-step-breakdowns
      # needs no freeze: with both .toml inputs frozen its inputs stop changing
      # and DVC leaves it alone.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # How much of a coupler step is GPU work, measured WITHOUT a profiler.
      # nsys cannot answer this: docs/learnings.md 2b-i showed its own
      # instrumentation dominates the idle measurement here, and the profiled mod
      # arm reports MORE idle than baseline while being faster in SYPD. This uses
      # CUDA events instead -- two records per ~277 ms step -- and reports wall,
      # GPU span, and the gap between them. gpu_span includes inter-kernel gaps,
      # so it bounds GPU busy from above and the gap is a LOWER bound on host
      # time outside the GPU timeline.
      #
      # Must run through this wrapper, not a bare srun: without `module load
      # climacommon` Julia picks up system CUDA libraries and a step takes 118 s
      # instead of 277 ms, which is how the first attempt at this measurement was
      # wasted.
      scheduler:
        options:
          - --gpus=1
          - --time=90
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/measure-step-breakdown.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        # The benchmark's whole run: 2880 steps = 4 simulated days at dt = 120 s.
        - --steps
        - '2880'
        - --out
        - results/step-breakdown.toml
      inputs:
        - scripts/measure-step-breakdown.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.13.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaAtmos.jl-mod/src
      outputs:
        - path: results/step-breakdown.toml
          storage: git

    step-breakdown-baseline:
      # Frozen 2026-11-03 with its sibling step-breakdown; see the reasoning
      # there. Unfreeze the two together or the arms describe different
      # revisions.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # The same measurement on the baseline arm, which the mod arm alone
      # cannot substitute for. On 2026-10-12 the mod arm showed 300 of 2880
      # steps carrying 55.4% of the wall clock, and that skew was read as a
      # property of the model -- but with only one arm measured there is no way
      # to tell a distribution the model always had from one the treatment
      # caused. It is also what the conversion gap needs: a 16.9 ms/step device
      # saving against a 315 ms mean step predicts ~5.4% and steady state
      # measures 2.86%, and attributing that needs the baseline's own step
      # distribution rather than an assumption that it matches.
      #
      # Deliberately NOT named step-breakdown-mod with the existing stage
      # renamed to match. Renaming a DVC stage drops its lock entry and re-runs
      # it, which on a shared machine costs ~40 minutes of GPU to reproduce
      # numbers that are already committed. The arm each file describes is in
      # its name and in its deps in dvc.lock.
      #
      # Read the two as a pair: they are only a comparison if both came from the
      # same revision of the stack, so re-run them together (the hazard
      # kernel-resources.csv hit on 2026-09-03, recorded above).
      scheduler:
        options:
          - --gpus=1
          - --time=90
      args:
        - --project=ClimaCoupler.jl/experiments/AMIP
        - scripts/measure-step-breakdown.jl
        - --config_file
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        # Matches the mod arm exactly.
        - --steps
        - '2880'
        - --out
        - results/step-breakdown-baseline.toml
      inputs:
        - scripts/measure-step-breakdown.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.13.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaAtmos.jl/src
      outputs:
        - path: results/step-breakdown-baseline.toml
          storage: git

    compare-step-breakdowns:
      kind: python-script
      environment: py
      script_path: scripts/compare-step-breakdowns.py
      # Pairs the two arms by step index rather than comparing aggregates. The
      # `expensive_*` fields the source TOMLs carry are thresholded against each
      # arm's own median, so they cannot be read across arms; this stage
      # classifies steps by the periodic schedule instead, which is fixed.
      inputs:
        - scripts/compare-step-breakdowns.py
        - results/step-breakdown.toml
        - results/step-breakdown-baseline.toml
        - results/fold-record/param-fold.json
      outputs:
        - path: results/step-comparison.json
          storage: git

    radiation-memory:
      kind: markdown
      target_path: docs/experiments/radiation-memory.md
      environment: py
      frozen: true
      # Frozen on main and tagged meas/2026-11-06-radiation-memory, the way
      # launch-cost and compile-time-study are: the two ncu stages this
      # document declares cost about three GPU hours between them, and the
      # `.ncu-rep` pair they write is a cache rather than the record. At the tag
      # nothing is frozen and the inputs exist, so the whole experiment
      # reproduces with `git checkout <tag> && calkit run radiation-memory`;
      # on main `calkit run` leaves it alone. Unfreeze the two ncu stages
      # together or the arms come from different revisions.

    occupancy-launch-model:
      kind: markdown
      target_path: docs/experiments/occupancy-launch-model.md
      environment: py
      # Live on main, and it declares no profiling stage at all: every figure
      # comes from profiles already paid for. The template's reason for an
      # experiment owning its own nsys runs is that a shared path holds
      # whichever experiment profiled last, and the indirection that solves it
      # here is `results/launch-inventory.json`, a committed snapshot that
      # `scripts/measure_occupancy.py` writes by hand with the source profiles
      # identified by hash. So nothing this document reads is transient and
      # there is nothing for a freeze to protect.

    quadrature-saturation:
      kind: markdown
      target_path: docs/experiments/quadrature-saturation.md
      environment: py
      # Unlike the launch model above, this one does read the shared arm
      # profiles, because its treatment is a change to one arm and the pipeline
      # already profiles both arms of that comparison. That makes
      # `results/nsys/mod.sqlite` an input, which the next experiment
      # overwrites, so every derived number is snapshotted into the stage's own
      # `stats.json` with the arm refs and each profile's digest, and the stage
      # is frozen once the experiment is tagged. Freeze and unfreeze it with
      # nothing else: it is the only stage this document declares.

    export-gpoint-groups:
      kind: python-script
      environment: py
      script_path: scripts/export-gpoint-groups.py
      # Only the two profiles. The wall-clock side is deliberately absent: a
      # stage that reads anything derived from a scheduler log depends on the
      # AMIP runs through three hops, which is how a Markdown stage submitted
      # amip-mod on 2026-10-31.
      inputs:
        - scripts/export-gpoint-groups.py
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
      outputs:
        - path: results/gpoint-groups.json
          storage: git
      # Live until this pass is tagged, then frozen on main like every snapshot
      # taken off the shared nsys paths, which hold whichever experiment
      # profiled last. The file carries both arms' refs and both database
      # hashes so a stale freeze shows up in the snapshot itself.

    gpoint-group-sweep:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # Does the longwave g-point split need 16 groups? The default widens
      # every longwave workspace to `ncol * 16`, and that memory is the whole
      # cost of the treatment, so the default should rest on a measurement of
      # where the saving stops.
      #
      # One reservation, not five: the group count is a constructor argument,
      # so every point is taken in one process against one settled AMIP state,
      # rebuilding only the group workspaces between them. That makes them
      # in-block comparisons -- it never differences two runs, which is the
      # only way to resolve a few percent on this machine.
      #
      # The same job also times blocks of real coupler steps, so the saving can
      # be reported as SYPD. The blocks run the live grouped solver and the
      # ungrouped SYPD is reconstructed by adding the measured in-block saving
      # back onto a measured block, because an AMIP pair cannot resolve a
      # sub-percent effect: one arm wandered 7.73% between two runs of
      # identical code. Wall clock is timed before the sweep so the sweep
      # cannot perturb a timed step.
      #
      # ClimaAtmos and ClimaCore sources are deliberately NOT inputs. A change
      # upstream of the radiation solve moves every point together and so
      # cannot change which group count suffices; declaring them would re-run
      # a 40-minute GPU stage on every microphysics edit. The stack it ran
      # against is recorded in the output instead. The step time it measures
      # WOULD move with them, which is why that figure is quoted as a
      # steady-state rate rather than as this stack's SYPD.
      scheduler:
        options:
          - --gpus=1
          - --time=110
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/measure-gpoint-sweep.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - scripts/measure-gpoint-sweep.jl
        - scripts/run-julia-script.sh
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.13.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
      outputs:
        - path: results/gpoint-sweep.toml
          storage: git
        - path: results/gpoint-wallclock.toml
          storage: git

    sw-gpoint-sweep:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # Does the shortwave split pay what the longwave one did? The longwave
      # solve was the first treated member of a family -- kernels at the
      # 255-register cap whose grid is one resident wave, where the only lever
      # left is to split the kernel so there are more blocks. The shortwave
      # two-stream solve is its closest member: the same 96 blocks of 256
      # threads, the same cap, the same independent g-point loop. So its saving
      # is a prediction to test rather than a new question, and this stage is
      # the test.
      #
      # Same method as gpoint-group-sweep, and the same reasons: one
      # reservation for every group count, each point rebuilding only the
      # shortwave group workspaces against one settled AMIP state, so the
      # points are in-block comparisons rather than differences of runs. Wall
      # clock is timed before the sweep so the sweep cannot perturb a timed
      # step.
      #
      # It does NOT share the longwave stage's wall-clock file. The live solver
      # now carries the longwave split, so this run's blocks are faster and the
      # two runs' block times are not comparable; each sweep times its own so
      # each gain is a ratio measured within one run.
      #
      # ClimaAtmos and ClimaCore sources are deliberately NOT inputs, for the
      # reason the longwave stage gives: a change upstream of the radiation
      # solve moves every point together and cannot change which group count
      # suffices, and declaring them would re-run a GPU stage on every
      # microphysics edit.
      scheduler:
        options:
          - --gpus=1
          - --time=110
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/measure-sw-gpoint-sweep.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - scripts/measure-sw-gpoint-sweep.jl
        - scripts/run-julia-script.sh
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.13.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
      outputs:
        - path: results/sw-gpoint-sweep.toml
          storage: git
        - path: results/sw-gpoint-wallclock.toml
          storage: git

    wave-census:
      kind: python-script
      environment: py
      script_path: scripts/export-wave-census.py
      # Which kernels cannot fill this device, and which of them splitting can
      # help. The longwave g-point split came out of one observation about one
      # kernel's launch geometry; this asks the same question of every kernel in
      # the profile so the next candidate is chosen from a measurement.
      #
      # It reads the baseline profile, which is transient -- results/nsys holds
      # whichever experiment profiled last -- and commits the small derived
      # numbers as their own results file. Nothing downstream reads the sqlite,
      # so regenerating a profile cannot destroy a census and asking for a
      # census cannot regenerate a profile. Run it with
      # `calkit dvc repro --single-item wave-census` for the second half of that
      # to hold: naming it to `calkit run` would offer to rebuild baseline-nsys.
      #
      # Column count comes from the g-point sweep's output rather than from a
      # constant here, because the ceiling this census is about is a ratio
      # between the column count and the device's resident threads.
      inputs:
        - scripts/export-wave-census.py
        - results/nsys/baseline.sqlite
        - results/gpoint-sweep.toml
      outputs:
        - path: results/wave-census.json
          storage: git

    gpoint-equivalence:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # Does splitting the g-point loop change the answer? The sweeps measure
      # what the split is worth; this checks that it is the same solve, for both
      # bands, and it is the only place that does so from the pipeline. The test
      # runs quoted in CliMA/RRTMGP.jl#637 were taken by hand.
      #
      # Separate from the sweeps because it needs no timing, so it can afford
      # group counts a sweep cannot: counts that divide NEITHER g-point count.
      # Both sweeps use 4, 8, 16 and 32 against 256 longwave and 224 shortwave
      # g-points, which divide exactly, so every group gets an equal stride and
      # the ragged final stride never runs -- which is exactly where a dropped
      # or double-counted g-point would hide.
      #
      # It errors rather than reporting, so a regression fails the pipeline.
      scheduler:
        options:
          - --gpus=1
          - --time=60
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/check-gpoint-group-equivalence.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - scripts/check-gpoint-group-equivalence.jl
        - scripts/run-julia-script.sh
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.13.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
      outputs:
        - path: results/gpoint-equivalence.toml
          storage: git

    kernel-population:
      kind: python-script
      environment: py
      script_path: scripts/analyze-kernel-population.py
      # Cheap: reads the nsys SQLite exports on the login node, no GPU. Answers
      # the questions the per-kernel tables cannot -- how many kernels there are,
      # how much of the time the GPU is idle, and how much work sits in kernels
      # too small to be worth launching.
      inputs:
        - scripts/analyze-kernel-population.py
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
      outputs:
        - path: results/kernel-population.json
          storage: git

    launch-bounds-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-launch-bounds-study.sh
      # Frozen: this stage answered its question and cannot re-run here. It
      # measures ClimaCore's `__launch_bounds__` occupancy targeting, which
      # exists only on ClimaCore.jl-mod branch `pb/launch-bounds` (PR 2601,
      # commits 5428c6e2c and 45bf1792c). That branch is not checked out --
      # both ClimaCore arms currently sit at upstream main -- so
      # measure-launch-bounds.jl dies at its first reference to
      # `CUDAExt.LAUNCH_BOUNDS_TARGET_WARPS_PER_SM[]`, before it builds a
      # CoupledSimulation. The recorded TOML is not at risk (the write is far
      # downstream of that failure), but each of the three phases burns a GPU
      # on a shared node to fail the same way, which is what this flag prevents.
      #
      # To re-evaluate, check out the tag where the inputs exist:
      #   git checkout exp/2026-08-24-launch-bounds
      #   git submodule update --init --recursive
      #   calkit run launch-bounds-study
      # That tag pins ClimaCore.jl-mod at 45bf1792c. At the tag the stage is
      # not frozen and runs normally, which is what makes the recipe work.
      #
      # Unfreeze on this rev only after re-pointing ClimaCore.jl-mod at
      # `pb/launch-bounds` AND re-dev'ing it (see scripts/dev-local-repos-coupler.sh
      # -- a submodule can be checked out without reaching the run).
      frozen: true
      # Three full setup+JIT phases in one job, so the clima environment's
      # default 120 min is not enough. `env_default_options` defaults to
      # `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/launch-bounds/launch-bounds.toml
      inputs:
        - scripts/measure-launch-bounds.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.13.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/launch-bounds/launch-bounds.toml
          storage: git

    compile-time-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-compile-study.sh
      # Frozen: this stage answered its question and must not re-run here. Its
      # warmup arm needs AMIPWarmup dev'd into the AMIP environments, which
      # exists only at tag compile-time-warmup-ab -- the wiring cost a measured
      # 5.1% and was reverted. Re-running on this rev would produce a warmup arm
      # with no warmup, i.e. two identical arms overwriting the evidence with a
      # result that looks like a measurement. (measure-compile-time.jl also
      # fails hard in that case; this keeps `calkit run` from reaching it.)
      # To re-evaluate, check out the tag and run it there.
      frozen: true
      # Two full setup+JIT phases in one job (~32 min each), so the default 120
      # min from the clima environment is not enough. `env_default_options`
      # defaults to `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/compile-time/compile-time.toml
      inputs:
        - scripts/measure-compile-time.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.13.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/compile-time/compile-time.toml
          storage: git
    build-experiment-index:
      kind: python-script
      environment: py
      script_path: scripts/build-experiment-index.py
      # Generated rather than hand-maintained, so the index cannot drift from
      # what was recorded: every row is read out of git at its `exp/*` tag.
      #
      # Depends on results/summary.json because that is what changes when a new
      # experiment is produced. Git tags are not files, so DVC cannot watch them
      # directly -- which is also why an experiment's own row appears only after
      # the tag is created and this stage is re-run.
      inputs:
        - results/summary.json
      outputs:
        - path: experiments.md
          storage: git
        - path: experiments.csv
          storage: git
