    baseline-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
      # describes.
      #
      # Re-frozen 2026-10-22 after the unfreeze that produced
      # exp/2026-10-21-fold-same-revision. The arms are byte-identical on main
      # now that the fold is upstream, so re-running this pair would replace a
      # table showing 255 -> 153 registers and 41.65% -> 0% spill with a table of
      # zeros, at the cost of about three GPU hours.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      args:
        - results/ncu/baseline
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the baseline tree. It
        # also matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl/experiments/AMIP
        - --config
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/ncu/baseline.ncu-rep
        - path: results/ncu/baseline-details.csv
          storage: git
          delete_before_run: true
