owner: petebachant
name: clima-gpu-profiling
title: CliMA GPU profiling
description: Profiling GPU performance for CliMA.
git_repo_url: https://github.com/petebachant/clima-gpu-profiling

questions:
  # Answers are one sentence pointing at reproducible evidence; the reasoning
  # lives in docs/. Numbers are templated from value evidence by name rather
  # than typed -- but ONLY where the cited file is the same artifact in the
  # working tree as at the pin, because rendering reads the working tree and
  # ignores git_ref. A pinned citation of a regenerated artifact such as
  # results/summary.json must therefore NOT be templated: it would render
  # whichever run wrote that file last. Those figures stay typed and pinned.
  - question: >-
      What is the ceiling on kernel fusion, and which package would have to
      deliver it?
    answer: >-
      At most {ceiling_fuse_4to1_pct}% of a step, and no one package can deliver it.
      {small_share_pct}% of the {launches_per_step:,.0f} kernel launches per step come from kernels short enough that the host time around a launch exceeds the GPU time inside it, and fusing that whole band four-to-one saves {ceiling_fuse_4to1_pct}% of a {step_ms} ms step; making every short launch vanish outright, which no real change achieves, saves {ceiling_all_removed_pct}%.
      ClimaAtmos holds the largest share at {climaatmos_launches_per_step:,.0f} launches per step, worth {climaatmos_fuse_4to1_pct}%, and within it cache/microphysics_cache.jl is the densest source at {mp_cache_launches_per_step:,.0f} per step and {mp_cache_fuse_4to1_pct}%, against {precomputed_launches_per_step:,.0f} and {precomputed_fuse_4to1_pct}% for the cache/precomputed_quantities.jl that CliMA/ClimaAtmos.jl#4261 proposes starting from -- the cache folder is the right instinct, and the microphysics cache is the bigger half of it.
      Read all of these as upper bounds, and as only half the prize. They price the HOST side: the time around a launch, at {host_us_per_launch} microseconds each, measured under nsys, whose own tracing runs to tens of CUDA API calls per launch and inflates exactly this quantity (docs/learnings.md 2b-i); pricing a launch honestly needs the probe run through the unprofiled AMIP stages, parked on ClimaAtmos.jl-mod branch pb/launch-cost-probe.
      Fusion also removes the intermediate arrays a chain of kernels writes and reads back, which is DEVICE time and independent of launch count: the same band is {small_band_pct_of_kernel_time}% of GPU kernel time, and this project's own fusion of the 1M source terms into the linearization accumulators cut kernel time 6.28% for +1.95% SYPD with the launch count identical to the unit (docs/learnings.md 3b).
      So the two halves point at different work: fusing for launch count means merging adjacent short kernels, while fusing for memory traffic means merging the ones that hand arrays to each other, which is what the `@. lazy` and uncached-temporaries subtasks of #4261 do, and it is where the measured gain came from.
    evidence:
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.ceiling_fuse_4to1_pct
        name: ceiling_fuse_4to1_pct
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The ceiling for fusing the sub-25 microsecond band four-to-one, priced
          at the marginal host cost from the adjacent probe pair in the same
          document.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.ceiling_all_removed_pct
        name: ceiling_all_removed_pct
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The absolute bound, where every short launch disappears. Quoted so the
          ceiling cannot be mistaken for a target.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: marginal.host_us_per_launch
        name: host_us_per_launch
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The price everything above rests on, from a baseline and probe
          profiled back to back in one invocation. The earlier cross-day
          estimate of 18.51 would have inflated every figure here by 2.7x.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.small_share_pct
        name: small_share_pct
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The share of launches in the sub-25 microsecond band, which is where
          the host time around a launch exceeds the GPU time inside it.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.launches_per_step
        name: launches_per_step
        git_ref: meas/2026-09-19-launch-cost
        explanation: Kernel launches per coupling step, device-side and so trustworthy.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.step_ms
        name: step_ms
        git_ref: meas/2026-09-19-launch-cost
        explanation: The step the percentages above are shares of.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.by_package.ClimaAtmos.per_step
        name: climaatmos_launches_per_step
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          ClimaAtmos's share of the band, attributed by the stack trace each
          launch was issued from.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.by_package.ClimaAtmos.fuse_4to1_pct
        name: climaatmos_fuse_4to1_pct
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          What fusing ClimaAtmos's whole share four-to-one would be worth. The
          band is spread over seven packages, so this is the largest single
          share rather than most of the ceiling.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.climaatmos_by_file.cache_microphysics_cache.per_step
        name: mp_cache_launches_per_step
        git_ref: meas/2026-09-19-launch-cost
        explanation: The densest single file in ClimaAtmos.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.climaatmos_by_file.cache_microphysics_cache.fuse_4to1_pct
        name: mp_cache_fuse_4to1_pct
        git_ref: meas/2026-09-19-launch-cost
        explanation: What fusing that file four-to-one would be worth.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.climaatmos_by_file.cache_precomputed_quantities.per_step
        name: precomputed_launches_per_step
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The file CliMA/ClimaAtmos.jl#4261 proposes starting from, for
          comparison with the microphysics cache beside it.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.climaatmos_by_file.cache_precomputed_quantities.fuse_4to1_pct
        name: precomputed_fuse_4to1_pct
        git_ref: meas/2026-09-19-launch-cost
        explanation: What fusing it four-to-one would be worth.
      - kind: value
        path: results/kernel-shares.json
        key: baseline.small_kernels.pct_of_kernel_time
        name: small_band_pct_of_kernel_time
        explanation: >-
          What the sub-25 microsecond band costs on the DEVICE, from the
          current stack's kernel population. This is the pool fusion can eat
          into by not materializing intermediates, and it is unrelated to the
          host-side launch overhead priced above.
      - kind: document
        path: docs/experiments/launch-cost.md
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The experiment. It declares both profiling stages itself, so the pair
          cannot be split across sessions.
  - question: >-
      Can the SGS microphysics cache kernel be made faster from inside a single
      package, and how much is that worth?
    answer: >-
      Yes -- a clear-air early-out plus a slimmer evaluator payload make the
      kernel about 7.5% faster, bit-for-bit and entirely within ClimaAtmos --
      but the guard already fires at {guard_fires_pct:.2f}% of quadrature
      points, which caps skip-based work here near 4%, and the whole result is
      worth roughly +0.5% SYPD, below the full-AMIP noise floor. See
      docs/learnings.md 4r.
    evidence:
      - kind: table
        path: results/top-kernels.csv
        git_ref: exp/2026-09-15-microphysics-cache-atmos
        explanation: >-
          set_microphysics_tendency_cache_ 3434.8 -> 3177.7 ms (-7.49%). The
          same file at the null-test commit shows this kernel at +0.15% with
          identical arms, which is what makes the effect meaningful.
      - kind: value
        path: results/earlyout-hits.toml
        key: guard_fires_pct
        name: guard_fires_pct
        explanation: >-
          The share of 13.9M quadrature points still taking the early-out, so
          the decay from August's -21.5% is not a hit-rate problem.
          Deliberately NOT pinned. It was pinned to
          meas/2026-09-15-earlyout-hit-rate, which holds 88.31%, while calkit
          renders from the working tree, which holds 81.80% after the
          2026-09-21 stack update -- so the answer displayed one number and
          cited a tag carrying another. The stage is live and cheap, so the
          working-tree value is reproducible and the two now agree.
          The cap survives the move: it derives from the -3.27% kernel speedup
          that skipping those points buys, so 3.27/0.818 is still near 4%.
      - kind: table
        path: diffs/ClimaAtmos.jl.diff
        git_ref: exp/2026-09-15-microphysics-cache-atmos
        explanation: >-
          The whole treatment: arms_differ_in is ['ClimaAtmos.jl-mod'] and
          nothing else, which is what makes this a single-package result.
  - question: Can we improve the performance of the flagship AMIP simulation?
    notes: >-
      Open. After the 2026-09-21 update to main the arms are identical, and the
      null test measured {speedup_pct:+.3f}% SYPD at {mod_sypd:.5f} SYPD, so there is
      no treatment in the pipeline to answer this with. The largest result so far,
      the RRTMGP aerosol-optics binary search, merged upstream as
      CliMA/RRTMGP.jl#628 and is part of the baseline now. experiments.csv has
      every recorded experiment, and docs/learnings.md 3a-3c the reasoning.
    evidence:
      - kind: figure
        path: figures/sypd-time-series.png
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          The end-to-end number for whatever revision last ran the pipeline.
          Read the cumulative rows in experiments.csv as cumulative: no row
          after the first is that change's own effect.
      - kind: value
        path: results/summary.json
        key: mod.sypd
        name: mod_sypd
        explanation: Absolute throughput of the modified arm, for scale.
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          Top 20 GPU kernels by baseline cost for both arms. What the two arms
          actually were is recorded per run in results/treatment.json rather
          than here, so this description cannot go stale against the data.
  - question: >-
      Can the radiation kernels be made faster without changing results, and
      which change is responsible?
    answer: >-
      Yes -- a binary search replacing a linear scan in RRTMGP's aerosol-optics
      interpolation is worth +7.95% SYPD on its own and carries essentially all
      of the +8.70% measured with a 64-thread block change added, with model
      state bit-identical over 120 coupled steps; it has since merged upstream as
      CliMA/RRTMGP.jl#628, so it is part of the baseline now. docs/learnings.md
      4m has the attribution.
    evidence:
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: rrtmgp_pair_speedup_pct
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          +8.70% SYPD end to end for the pair. RRTMGP is the only package
          differing between arms. NOT templated into the answer: rendering reads
          the working tree, where results/summary.json holds a later run.
      - kind: table
        path: diffs/RRTMGP.jl.diff
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          The change itself, 69 lines across three files.
      - kind: table
        path: results/top-kernels.csv
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          Per-kernel confirmation: longwave -27.0% and shortwave -26.4%.
          Longwave moving is the attribution, since the block-size change
          affects only shortwave.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: binary_search_speedup_pct
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          The isolation, with block size left at RRTMGP's default in both arms:
          +7.95% SYPD. The 0.75-point gap against the pair sits inside the
          repeat spread, so the block change is not part of the proposal.
      - kind: table
        path: results/top-kernels.csv
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          Same isolation per kernel: radiation -26.92%, against -26.66% with the
          block change added, so the search alone is marginally better.
      - kind: table
        path: diffs/RRTMGP.jl-authored.diff
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          The proposed change in full: 30 lines in one function, as the branch's
          own delta since it diverged from RRTMGP main.
      - kind: value
        path: results/state-rad-mod.toml
        key: steps
        name: bit_identical_steps
        git_ref: meas/2026-09-12-rrtmgp-bit-identical
        explanation: >-
          Bit-identity, not an accuracy trade: 0 of 12 prognostic fields differ
          against results/state-rad-baseline.toml at every snapshot across these
          coupled steps.
  - question: >-
      How much of a GPU kernel-time saving actually reaches SYPD?
    answer: >-
      It depends on where the saving is, and the difference is large enough to change what is worth doing: radiation work converts at {radiation_mean:.0f}% ({radiation_min:.0f}-{radiation_max:.0f}% over {radiation_n} experiments), microphysics work at {microphysics_mean:.0f}% ({microphysics_min:.0f}-{microphysics_max:.0f}% over {microphysics_n}).
      So the rule of thumb this project carried for months -- about a third of a kernel-time saving shows up end to end -- was measured entirely on microphysics and understates a radiation change by more than a factor of two.
      Both halves of each ratio are read out of the tag that recorded them: kernel time from the profiled nsys stages, SYPD from the unprofiled AMIP ones, which is the only number that answers "is the model faster".
      Why radiation converts better is NOT established. Plausible: radiation runs as a few very long kernels with nothing to overlap them against, while the microphysics kernel is one of thousands per step and its saving may be partly absorbed by whatever else is in flight. Treat the ratios as measured, the explanation as a hypothesis.
    evidence:
      - kind: value
        path: results/pass-through.json
        key: by_subsystem.radiation.mean_pct
        name: radiation_mean
        explanation: >-
          Mean over the radiation experiments. Each ratio is the end-to-end
          SYPD gain divided by the GPU kernel-time reduction that produced it.
      - kind: value
        path: results/pass-through.json
        key: by_subsystem.radiation.min_pct
        name: radiation_min
        explanation: The narrowest radiation conversion measured.
      - kind: value
        path: results/pass-through.json
        key: by_subsystem.radiation.max_pct
        name: radiation_max
        explanation: The widest.
      - kind: value
        path: results/pass-through.json
        key: by_subsystem.radiation.n
        name: radiation_n
        explanation: How many tagged experiments the radiation range rests on.
      - kind: value
        path: results/pass-through.json
        key: by_subsystem.microphysics.mean_pct
        name: microphysics_mean
        explanation: >-
          Mean over the CloudMicrophysics fusion experiments, which is where
          the "about a third" rule came from.
      - kind: value
        path: results/pass-through.json
        key: by_subsystem.microphysics.min_pct
        name: microphysics_min
        explanation: The narrowest microphysics conversion measured.
      - kind: value
        path: results/pass-through.json
        key: by_subsystem.microphysics.max_pct
        name: microphysics_max
        explanation: The widest.
      - kind: value
        path: results/pass-through.json
        key: by_subsystem.microphysics.n
        name: microphysics_n
        explanation: How many tagged experiments the microphysics range rests on.
      - kind: table
        path: experiments.csv
        explanation: >-
          The experiments themselves, each reproducible from its tag. The
          pass-through stage reads both halves of every ratio out of those
          tags with git show rather than from the working tree.
  - question: >-
      Can the clear-sky diagnostics be had for less than a second radiation
      solve?
    answer: >-
      Yes, and for most of the cost: the two passes differ only by the cloud increment, while the gas and aerosol optics they both recompute are {lw_optics_frac:.0%} of a longwave solve and {sw_optics_frac:.0%} of a shortwave one.
      Computing those once and sweeping twice -- gas and aerosol optics, sweep, accumulate the clear sky, then add the cloud increment to the same optics, sweep again, accumulate the all-sky -- removes {lw_fused_saving:.0%} of the longwave pair.
      Implemented for both bands in RRTMGP.jl-mod `pb/optics-split` as solve_lw_both! and solve_sw_both!, called from update_lw_fluxes! and update_sw_fluxes!, so nothing above RRTMGP changes: longwave 5702.5 -> 3216.7 ms (-43.6%) and shortwave 5051.0 -> 3038.2 ms (-39.8%), four radiation kernels becoming two.
      The longwave half was measured on its own first, at -8.5% of GPU kernel time with shortwave unchanged at -0.5% as the control that the change did what it claimed and nothing else.
      It is correct in the only sense available: the cloud mask is McICA-sampled per kernel launch, so one fused launch draws a different cloud sample than the reference's two, and no cell-wise comparison can validate it.
      Against the reference resampled against itself, the fused solve differs by {fused_mean_diff:.3e} where resampling alone differs by {control_mean_diff:.3e} -- indistinguishable -- while the clear sky, which has no sampling, matches exactly.
      Carried into the coupled state over {divergence_steps:.0f} coupler steps it still holds, though at the top of the envelope rather than in the middle of it: the fused run ends {final_fusion_diff:.2e} from the baseline against a median {control_median_diff:.2e} for three reseeded draws of the fused code, whose own spread is {control_spread:.1f}x, so the worst per-step ratio is {divergence_ratio:.2f}.
      Both bands fused are worth **+10.94% SYPD** (0.22759 -> 0.25554, tag exp/2026-09-24-fused-radiation): GPU kernel time falls 15.2%, radiation from 36.4% to 25.0% of it, and four radiation kernels become two.
      That is 87% of what deleting the clear-sky diagnostics buys (+12.6%), with the diagnostics kept -- so the question the bound posed to the science owners largely goes away.
    evidence:
      - kind: value
        path: results/radiation-split.toml
        key: lw.optics_frac_of_allsky
        name: lw_optics_frac
        explanation: >-
          The share of a longwave solve spent on optics rather than the
          two-stream sweep, from timing the real solve against the same kernel
          with the sweep and flux accumulation removed. This is what both
          passes duplicate, and so what fusing them recovers.
      - kind: value
        path: results/radiation-split.toml
        key: sw.optics_frac_of_allsky
        name: sw_optics_frac
        explanation: The same for shortwave, which is not yet fused.
      - kind: value
        path: results/radiation-split.toml
        key: lw.fused_saving_frac_of_pair
        name: lw_fused_saving
        explanation: >-
          One copy of the optics as a share of what the two longwave solves
          cost together, i.e. what a fused solve removes.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: fused_speedup_pct
        git_ref: exp/2026-09-24-fused-radiation
        explanation: >-
          Both bands fused, end to end, from the unprofiled AMIP stages with
          both arms measured in one session. The longwave half alone was
          +5.26% at exp/2026-09-23-fused-lw-optics. NOT templated: rendering
          reads the working tree, where results/summary.json holds whichever
          run wrote it last.
      - kind: value
        path: results/fused-lw-check.toml
        key: fused_mean_rel_diff
        git_ref: exp/2026-09-24-fused-radiation
        name: fused_mean_diff
        explanation: >-
          How far the fused all-sky fluxes sit from two separate solves, in the
          mean over the field.
      - kind: value
        path: results/fused-lw-check.toml
        key: control_mean_rel_diff
        git_ref: exp/2026-09-24-fused-radiation
        name: control_mean_diff
        explanation: >-
          The control that makes that number mean something: the reference
          solved twice, differing only by McICA resampling. The fused solve
          lands inside it. An earlier version of this check compared for
          equality and failed at 14%, which was the sampling, not a defect;
          an earlier one still ran with three warmup steps, had no clouds at
          all, and passed while testing nothing.
      - kind: value
        path: results/state-divergence.json
        key: final_fusion_rel_diff
        git_ref: meas/2026-09-25-fused-state-divergence
        name: final_fusion_diff
        explanation: >-
          How far the fused run's state sits from the baseline's after 120
          coupler steps, as the worst relative difference in any prognostic
          field's mass-weighted sum. Fusing changes how McICA consumes
          randomness, so this number cannot be zero and its size alone says
          nothing -- it is only readable against the controls below.
      - kind: value
        path: results/state-divergence.json
        key: final_control_median
        git_ref: meas/2026-09-25-fused-state-divergence
        name: control_median_diff
        explanation: >-
          The yardstick: the same fused code run at three radiation seeds, so
          the only difference between those runs is the cloud draw. The median
          of the three pairs, not the maximum -- with three arms a single bad
          arm sits in two pairs and moves the median as readily as the widest
          point, so the three are also checked against each other and an
          inconsistent spread fails the comparison.
      - kind: value
        path: results/state-divergence.json
        key: max_ratio_to_control_median
        git_ref: meas/2026-09-25-fused-state-divergence
        name: divergence_ratio
        explanation: >-
          The worst per-step ratio of the two, over the whole window. One near
          one means fusing is indistinguishable from a different cloud draw. An
          earlier version of this check used a single control draw and reported
          3.5 at step 80, which was the control dipping as two chaotic
          trajectories crossed, not a defect.
      - kind: value
        path: results/state-divergence.json
        key: control_spread_ratio
        git_ref: meas/2026-09-25-fused-state-divergence
        name: control_spread
        explanation: >-
          How far apart the three control pairs are from each other at the last
          step. It is the guard on the comparison, not a result: three seeds of
          one code must agree, and if they do not then the median is measuring
          something other than resampling. It is also the scale that makes the
          ratio readable -- the fused run ends just above the widest control
          pair, which is a smaller gap than the controls have among themselves.
      - kind: value
        path: results/state-divergence.json
        key: steps
        git_ref: meas/2026-09-25-fused-state-divergence
        name: divergence_steps
        explanation: How long the trajectories were compared for.
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          Six radiation rows that read as the fusion directly: four baseline
          kernels, two longwave and two shortwave, against two fused mod kernels,
          10753.6 ms becoming 6248.0 ms. Each arm's rows have a blank column on
          the other side because the fused solves are new symbols, so the join
          cannot pair them -- they are separate kernels, not a kernel that
          changed. Unpinned deliberately: at exp/2026-09-24-fused-radiation this
          table ranked by baseline cost and kept the top twenty, so the fused
          kernels could not appear at all and the mod side was simply empty. It
          now ranks by whichever arm is larger.
  - question: >-
      How much of the radiation cost is clear-sky diagnostics rather than the
      fluxes the model runs on?
    answer: >-
      Half of it: {clear_sky_pct}% of GPU kernel time against {all_sky_pct}% for the fluxes that drive the model, out of {radiation_pct}% for radiation as a whole.
      The benchmark runs `rad: allskywithclear`, under which ClimaAtmos calls the RRTMGP solver twice per radiation step -- once with the cloud lookup passed as `nothing` -- so the profile carries two longwave and two shortwave kernels, told apart by whether their signature takes a LookUpCld argument rather than by cost.
      That second pass buys the clear-sky fluxes that cloud radiative effect diagnostics are computed from, so whether it is worth it is a question for whoever uses those diagnostics rather than a performance bug.
      Priced by a config-only bounding run, it is worth **+12.6% SYPD** (0.22759 -> 0.26040, tag exp/2026-09-22-clearsky-bound): GPU kernel time falls 17.9% and the two cloud-free kernels disappear while the all-sky kernels move under 0.5%, so the run removes that work and nothing else.
      Two caveats on reading that: it changes results, so it is a bound and not a proposal, and the benchmark fires radiation every 20 steps against the nightly's 30, so radiation is over-weighted here relative to production.
      The conversion is the part worth carrying forward: 17.9% of kernel time bought 12.6% of SYPD, about 70%, where this project's earlier work converted at about a third -- removing a large dense block pays far better than rescheduling one.
    evidence:
      - kind: value
        path: results/kernel-population.json
        key: baseline.radiation.clear_sky.pct_of_kernel_time
        name: clear_sky_pct
        explanation: >-
          The two solves with no LookUpCld argument, which is what makes this
          an attribution rather than an inference from which kernel is cheaper.
      - kind: value
        path: results/kernel-population.json
        key: baseline.radiation.all_sky.pct_of_kernel_time
        name: all_sky_pct
        explanation: The solves the model's own fluxes come from.
      - kind: value
        path: results/kernel-population.json
        key: baseline.radiation.pct_of_kernel_time
        name: radiation_pct
        explanation: Radiation as a whole, for scale.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: clearsky_bound_speedup_pct
        git_ref: exp/2026-09-22-clearsky-bound
        explanation: >-
          What dropping the second solve is worth end to end, from the
          unprofiled AMIP stages with both arms measured in one session. NOT
          templated: rendering reads the working tree, where
          results/summary.json holds whichever run wrote it last.
      - kind: table
        path: results/top-kernels.csv
        git_ref: exp/2026-09-22-clearsky-bound
        explanation: >-
          Per-kernel confirmation: the two solves with no cloud lookup vanish
          and the all-sky pair is unchanged, which is what makes the SYPD
          delta attributable to the clear-sky work alone.
  - question: >-
      Where does the AMIP simulation's GPU time actually go, and is the
      microphysics kernel the right thing to optimize?
    answer: >-
      No -- radiation is the largest block at {radiation_pct:.1f}% of GPU kernel
      time against {microphysics_hot_kernel_pct:.1f}% for the microphysics kernel
      this project targeted, and with host time outside the GPU timeline at
      {gap_frac_of_wall:.3%} of wall the run is densely GPU-bound, so kernel time
      is what there is to attack. See docs/learnings.md 4k.
    evidence:
      - kind: value
        path: results/kernel-shares.json
        key: baseline.radiation_pct
        name: radiation_pct
        explanation: >-
          The four RRTMGP rte_*_2stream kernels together, baseline arm. The
          binary search that merged upstream took this from 43.9% to where it is
          now.
      - kind: value
        path: results/kernel-shares.json
        key: baseline.microphysics_hot_kernel_pct
        name: microphysics_hot_kernel_pct
        explanation: >-
          The largest set_microphysics_tendency_cache specialization, baseline
          arm.
      - kind: value
        path: results/step-breakdown.toml
        key: gap_frac_of_wall
        name: gap_frac_of_wall
        explanation: >-
          Measured WITHOUT a profiler, using CUDA events. nsys cannot answer
          this: its own instrumentation dominates the idle measurement, and it
          reports MORE idle for the faster arm (docs/learnings.md 2b-i, 4f).
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          The per-kernel breakdown on the 120-step phase-independent window,
          which is LCM(20, 60, 120) of the periodic processes and so fires every
          scheme at its exact long-run share. The earlier 40-step window was
          shorter than the gravity-wave period and made microphysics look
          dominant.
  - question: >-
      What CI checks would catch a kernel this inefficient before it reaches
      main, and block it until it is fixed?
    hypothesis: >-
      A benchmark-and-threshold gate cannot work here, because full-AMIP SYPD
      noise is larger than the changes worth catching, so the gate has to be
      built on compile-time quantities instead.
    notes: >-
      Proposed, not implemented or validated: gate on per-kernel compile-time
      resource use -- registers per thread AND absolute local-memory bytes, from
      CUDA.registers and CUDA.memory, recorded as a checked-in baseline -- rather
      than on end-to-end timing. The design is in docs/ci-kernel-gate.md.
    evidence:
      - kind: value
        path: results/cm-registers.toml
        key: layers.E microphysics_tendencies_1m (9-pt quadrature).registers
        git_ref: exp/2026-09-04-fuse-and-bounds
        explanation: >-
          Why a register-only gate fails: this kernel reports the sm_80 cap of
          255 no matter how far over it is, so the count cannot distinguish
          "fine" from "catastrophic" nor show whether a fix helped. Pinned
          because the A-E broadcast layers are only produced when ClimaCore.jl-mod
          is on pb/launch-bounds, so the key is absent from the current file.
      - kind: value
        path: results/cm-registers.toml
        key: layers.E microphysics_tendencies_1m (9-pt quadrature).unbounded_local_bytes
        git_ref: exp/2026-09-06-evaluator-param-args
        explanation: >-
          The quantity that actually moved while the register count sat still,
          and which was not recorded at all until 2026-09-06. This is why the
          gate must record absolute local-memory bytes, not just registers.
      - kind: table
        path: results/kernel-resources.csv
        git_ref: exp/2026-09-07-evaluator-repeat
        explanation: >-
          The per-kernel table a CI check would compare against a stored
          baseline. Pinned because the ncu stages that produce it are frozen, so
          on main it describes whichever revision last ran them.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          Why the gate cannot be a model benchmark: this is the end-to-end
          number, whose repeat spread is 0.43% at best and ~2% typically, while
          the kernel-level measurement repeats to 0.31%.
  - question: >-
      Which changes actually improve AMIP performance, by how much, and how do
      we know a result is real rather than run-to-run variation?
    notes: >-
      The earlier answer described the CloudMicrophysics register and fusion
      work and ClimaCore's occupancy targeting on stacks that no longer exist, and
      predates the RRTMGP binary search, which is upstream now; it needs
      re-measuring on the current stack. The second half is answered: identical arms
      on the current stack differ by {speedup_pct:+.3f}% SYPD, consistent with the
      earlier null tests in experiments.csv. docs/learnings.md 3a-3c has what
      the earlier stacks showed.
    evidence:
      - kind: table
        path: experiments.csv
        explanation: >-
          Every recorded experiment, generated from exp/* git tags by
          scripts/build-experiment-index.py and read out of git at the tagged
          commit, so it cannot drift. THE reproducible COLUMN IS LOAD-BEARING: a
          run made against a dirty submodule tree measured code that exists
          nowhere afterwards, so the checkout recipe cannot reproduce it.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          The mod-vs-baseline delta at a given revision, which is the only thing
          this project can claim. Upstream baseline movement -- +4.36% from one
          dependency update -- belongs to whoever wrote the upstream PR and must
          never be added into a cumulative figure.
  - question: >-
      What actually limits the hot SGS-quadrature microphysics kernel, and which
      of the available levers can move it?
    notes: >-
      Answered for the stack before the 2026-09-21 update in docs/learnings.md 2c
      and 4a: register pressure at the 255-register cap, with a guarded
      __launch_bounds__ occupancy target as the lever that works. That update
      re-enabled cloud ice formation and liquid freezing in the 1M microphysics,
      which changes this kernel, so it needs re-measuring; the ncu stages that would
      show its registers and spilling are frozen.
    evidence:
      - kind: value
        path: results/cm-registers.toml
        key: layers.LinearizedAverage nsub=2.registers
        name: linearized_avg_registers
        explanation: >-
          A full 1M CloudMicrophysics evaluation, compiled standalone with the
          parameter structs passed as kernel ARGUMENTS -- as const globals the
          compiler folds their fields and understates pressure enough to invert
          the conclusion, which it once did. Independent of substep count, so
          microphysics_n_substeps_quadrature costs time but not occupancy. This
          stage is cheap and not frozen, so it re-runs against whatever is
          checked out; read its revision before comparing.
      - kind: value
        path: results/kernel-population.json
        key: baseline.gpu_idle_pct
        name: gpu_idle_pct
        explanation: >-
          READ AS A PROFILING ARTIFACT, NOT A TARGET. The profiler's own tracing
          runs to ~33 CUDA API calls per launch and accounts for the bulk of
          this idle; the profiled window does not even run at the same rate as
          the real one. Kernel TIMES from nsys are device-side and trustworthy;
          the gaps between them are not. See docs/learnings.md 2b-i.
      - kind: value
        path: results/launch-bounds/launch-bounds.toml
        key: off.kernels.L1013.mean_ms
        git_ref: exp/2026-09-01-cm-fuse
        explanation: >-
          The reference every other phase is read against: the hot
          SGS-quadrature kernel with launch bounds disabled, which is what the
          baseline arm runs.
      - kind: value
        path: results/launch-bounds/launch-bounds.toml
        key: unguarded.kernels.L1013.mean_ms
        git_ref: exp/2026-09-01-cm-fuse
        explanation: >-
          The counterfactual, and the reason this stage exists: with the spill
          budget loosened until the annotation is accepted, the kernel reaches
          12 warps/SM and gets SLOWER. A rejected configuration never appears in
          an ordinary profiling run.
      - kind: value
        path: results/launch-bounds/launch-bounds.toml
        key: guarded.kernels.L970.mean_ms
        git_ref: exp/2026-09-01-cm-fuse
        explanation: >-
          The gain, in the shipped configuration: the single-call microphysics
          kernel annotated at 12 warps/SM for a small spill cost. The
          guarded.decisions array records, per kernel, what was accepted and why.
      - kind: table
        path: results/kernel-resources.csv
        git_ref: exp/2026-09-07-evaluator-repeat
        explanation: >-
          What establishes the kernel as register-limited rather than
          memory-limited. Pinned because the ncu stages are frozen; cited for
          the characterization of the baseline kernel, which has been stable
          across revisions, not as evidence for any treatment's effect.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          The pipeline-level number this kernel work has to show up in
          eventually. Kernel times are not SYPD, and this mechanism measured a
          SYPD null on its own.
  - question: >-
      Should the SGS quadrature order be reduced from 3 to 2, and what does that
      trade?
    answer: >-
      Not on the current stack: the earlier recommendation is withdrawn.
      Re-measured after the 2026-09-21 update to ClimaAtmos main, which re-enabled cloud ice formation and liquid freezing in the 1-moment scheme, dropping the rule from 3x3 to 2x2 changes {order2_changed_frac:.1%} of cells rather than the ~1% it changed before, for {order2_icl_rms_over_scale:.2%} of RMS on the cloud-ice tendency and {order2_lcl_rms_over_scale:.2%} on cloud liquid, with the worst single cell moving {order2_icl_max_over_scale:.1f}x the field's own RMS.
      The throughput side is not comparable either: +6.14% SYPD on upstream code and +8.05% with this project's numerics work were both measured before that update, on the physics this measurement shows the quadrature now interacts with differently, so the trade cannot be struck until the cost is re-measured on the current configuration.
      The accuracy figures remain the DIRECT effect, with lambda_lagrange held at its 3x3 fit; a real order-2 run refits it and would compensate in part. docs/sgs-quadrature.md is the write-up.
    evidence:
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: order2_isolated_speedup_pct
        git_ref: exp/2026-09-08-quadrature-order-2-isolated
        explanation: >-
          Standalone benefit on unmodified upstream code, with the quadrature
          order the only live difference between arms. NOT templated: rendering
          reads the working tree, where results/summary.json holds a later run.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: order2_full_stack_speedup_pct
        git_ref: exp/2026-09-09-order2-full-stack
        explanation: >-
          Benefit with the numerics work also in place. Sub-additive against the
          two levers separately, because the numerics cut cost per quadrature
          point and the order cuts the number of points -- so the numerics work
          is not made redundant by this change.
      - kind: document
        path: docs/sgs-quadrature.md
        explanation: >-
          The decision record: what was measured, what was decided, and what
          would change it. Built by a Markdown stage, so its figures and its
          before/after comparison are injected rather than typed.
      - kind: value
        path: results/quadrature-order-error.toml
        key: order_2.dq_icl_dt.rms_over_scale
        name: order2_icl_rms_over_scale
        explanation: >-
          The accuracy cost on the current configuration, measured on a real
          AMIP state with byte-identical inputs. Unpinned because the
          quadrature-order-error stage now regenerates it: the same key read
          1.20% before the 2026-09-21 update, on physics that no longer runs.
      - kind: value
        path: results/quadrature-order-error.toml
        key: order_2.dq_lcl_dt.rms_over_scale
        name: order2_lcl_rms_over_scale
        explanation: The same for the cloud-liquid tendency, 0.65% before the update.
      - kind: value
        path: results/quadrature-order-error.toml
        key: order_2.dq_icl_dt.max_over_scale
        name: order2_icl_max_over_scale
        explanation: >-
          The worst single cell, in units of the field's own RMS. The error is
          concentrated where the PDF reaches a kink, which is where the
          quadrature is doing its job.
      - kind: value
        path: results/quadrature-order-error.toml
        key: order_2.changed_frac
        name: order2_changed_frac
        explanation: >-
          The share of cells whose tendencies change at all. This is the figure
          that moved most: about 1% before the update, and the majority of the
          field after it, which is what withdrew the recommendation.
  - question: >-
      Is the nine-point SGS quadrature in the 1-moment microphysics earning the
      throughput it costs?
    answer: >-
      Yes on the current stack, and the measurement that suggested otherwise was answering a narrower question than it appeared to.
      The subgrid PDF still sits a median of {mu_over_sigma_p50:.0f} standard deviations from the SATURATION kink, with {clear_of_kink_10sigma_warp_frac:.2%} of warps entirely clear of it, so by that criterion the quadrature looks idle.
      But reducing the rule to 2x2 changes {order2_changed_frac:.1%} of cells, so it is plainly integrating something: the cloud ice formation and liquid freezing that upstream re-enabled on 2026-09-21 are nonlinear in temperature away from saturation, and the quadrature integrates over temperature too.
      Distance from the saturation kink is therefore necessary but not sufficient evidence that a quadrature is degenerate, which is the part worth carrying forward. docs/sgs-quadrature.md is the write-up, and docs/learnings.md 6a has the distribution.
    evidence:
      - kind: document
        path: docs/sgs-quadrature.md
        explanation: >-
          The decision record, including why the distance-from-kink argument
          was not sufficient.
      - kind: value
        path: results/quadrature-order-error.toml
        key: order_2.changed_frac
        name: order2_changed_frac
        explanation: >-
          What decides it: the share of cells whose tendencies change when the
          rule is reduced. A quadrature integrating nothing would change none
          of them.
      - kind: value
        path: results/sgs-degeneracy.toml
        key: mu_over_sigma_percentiles.p50
        name: mu_over_sigma_p50
        explanation: >-
          Median |mu_S| / sigma_S across all 1,548,288 cells. The same file
          carries p1, so even the worst percentile is clear of the kink.
      - kind: value
        path: results/sgs-degeneracy.toml
        key: criteria.clear_of_kink_10sigma.warp_frac
        name: clear_of_kink_10sigma_warp_frac
        explanation: >-
          The fraction of 32-cell groups in which EVERY cell is clear of the
          kink, which is what decides whether collapsing could pay on a GPU: a
          warp costs the maximum over its lanes, so a criterion true at
          scattered points saves nothing.
      - kind: table
        path: experiments.csv
        explanation: >-
          What the quadrature costs, measured and tagged rather than quoted:
          compare 2026-09-08-quadrature-order-1 against
          2026-09-07-evaluator-repeat, the same stack with the nine-point rule.
          A configuration-only change that alters results and was reverted -- an
          upper bound attached to the question, not a proposal.
  - question: >-
      How much of a GPU profiling job is compilation rather than computation,
      and can any caching strategy recover it between jobs?
    hypothesis: >-
      Most of a profiling job is compilation, and caching it between jobs --
      first GPUCompiler's on-disk kernel cache, then a PrecompileTools warmup
      package -- should recover a large part of it.
    answer: >-
      Compilation is {compile_share_pct}% of the job and it is host-side Julia
      JIT rather than GPU kernel compilation, so neither strategy recovered any
      of it: GPUCompiler's disk cache writes zero files in this stack, and the
      AMIPWarmup package made the job {warmup_penalty_pct}% slower, with the
      penalty landing inside the very phase it was built to speed up.
    evidence:
      - kind: document
        path: docs/compile-time.md
        git_ref: 0551f45
        explanation: >-
          The measurement, both failed strategies, and the recipe for re-running the study at its tag.
          Pinned because the document is downstream of the frozen compile-time-study,
          so nothing would report it stale. Its only input is the pinned TOML above,
          so the pin is about naming which rendering this answer was written against,
          not about the figures, which cannot drift.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_off.totals.wall_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          Status quo, and the reference the whole study rests on. Pinned to the
          only rev where this stage's inputs exist: the AMIPWarmup wiring was
          reverted immediately after the measurement, because keeping it would
          impose the measured penalty on every future profiling job. At that tag
          the stage is not frozen, so calkit run compile-time-study reproduces it.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_on.totals.wall_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          The test, in the same SLURM job on the same GPU, running second --
          the ordering that would flatter it if anything. Higher than
          warmup_off, which is the negative result.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_on.coupled_simulation.wall_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          Where the penalty is: simulation construction, the phase AMIPWarmup
          targets, so the cost is not merely the price of loading a package.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_off.totals.host_compile_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          Host-side JIT only, from Julia's own @timed compile_time accounting.
          GPU kernel compilation is NOT counted here, since GPUCompiler runs
          outside it -- which is what rules out the whole class of
          GPU-kernel-caching fixes independently of the disk cache being broken.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_off.second_step.wall_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          Steady-state cost of one step once everything is compiled -- the
          fraction of a second that the surrounding half hour exists to produce.
      - kind: value
        path: results/compile-time/doc-values.json
        key: warmup_off.compile_share_pct
        name: compile_share_pct
        explanation: >-
          Host-side JIT as a share of the whole job, derived from the pinned
          measurement above by the compile-time-doc stage. Unpinned on purpose:
          this is the file the write-up injects from, so the answer and
          docs/compile-time.md cannot disagree.
      - kind: value
        path: results/compile-time/doc-values.json
        key: penalty.wall_pct
        name: warmup_penalty_pct
        explanation: >-
          What AMIPWarmup cost, as a share of the job it was meant to speed up.
          The sign is the result: this was a negative result, not a null one.

tables:
  - path: results/top-kernels.csv
    title: Top 20 GPU kernels, baseline vs. mod
    description: >-
      Per-kernel Nsight Systems aggregates for the top 20 kernels ranked by
      baseline total time, covering both the baseline and modified runs:
      invocation counts, total and mean duration, share of total GPU time,
      registers per thread, and the percent change in total time.

  - path: results/kernel-resources.csv
    title: Per-kernel register, spill, and occupancy stats
    description: >-
      Nsight Compute resource metrics for the profiled microphysics kernels,
      baseline vs. mod: registers per thread, register spilling (requests and
      the share of memory traffic they cost), stack frame, and achieved vs.
      theoretical occupancy.

      This exists because the nsys table above cannot show the mechanism behind
      the headline speedup. The hot kernel can sit pinned at the 255-register
      cap in BOTH cases, so by the columns nsys collects nothing changed at all,
      while its total time falls by half. Registers at the cap is not the same
      thing as spilling, and nsys does not collect spill metrics -- only Nsight
      Compute does. Specific figures are deliberately left to the table rather
      than quoted here, so this description cannot go stale against the data it
      describes.

environments:
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_options:
      - --gpus=1
      - --time=120
  sassy:
    kind: system
    host: sassy.caltech.edu
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.13"

pipeline:
  stages:
    record-treatment:
      # Reports git state -- submodule SHAs, refs, whether a tree was dirty --
      # which DVC cannot see, because its declared inputs are file contents.
      # Committing a submodule changes no content, so the stage was skipped as
      # unchanged while the very thing it records had changed, and it kept
      # reporting a stale SHA and a dirty tree that was no longer dirty.
      # It is CPU-only and takes seconds, so it runs every time.
      always_run: true
      kind: python-script
      environment: py
      script_path: scripts/record-treatment.py
      # What actually ran, as opposed to what a commit message says ran. A
      # superproject commit pins every submodule SHA, but not whether a package
      # was dev'd into the AMIP environments (a submodule can be checked out and
      # irrelevant), nor whether a tree was dirty, nor which CLIMA_* variables
      # the stages exported. Each of those has changed the meaning of a result
      # in this project at least once.
      #
      # Depends on diffs/ rather than the submodules directly, so it re-runs
      # after make-diffs has observed the same state, and cannot disagree with
      # the archived diff.
      inputs:
        - from_stage_outputs: make-diffs
        - calkit.yaml
      outputs:
        - path: results/treatment.json
          storage: git
    make-diffs:
      kind: shell-script
      environment: _system
      script_path: scripts/make-diffs.sh
      inputs:
        - ClimaCoupler.jl
        - ClimaCoupler.jl-mod
        - ClimaCore.jl
        - ClimaCore.jl-mod
        - ClimaAtmos.jl
        - ClimaAtmos.jl-mod
        - CloudMicrophysics.jl-mod
        - RRTMGP.jl
        - RRTMGP.jl-mod
      outputs:
        - path: diffs
          storage: git
    baseline-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/baseline
        - ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/nsys/baseline.nsys-rep
        - results/nsys/baseline.sqlite
    mod-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/nsys/mod
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
        - ClimaAtmos.jl-mod/config
      outputs:
        - results/nsys/mod.nsys-rep
        - results/nsys/mod.sqlite
    baseline-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
