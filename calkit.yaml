owner: petebachant
name: clima-gpu-profiling
title: CliMA GPU profiling
description: Profiling GPU performance for CliMA.
git_repo_url: https://github.com/petebachant/clima-gpu-profiling

questions:
  # Answers are one sentence pointing at reproducible evidence; the reasoning
  # lives in docs/. Numbers are templated from value evidence by name rather
  # than typed -- but ONLY where the cited file is the same artifact in the
  # working tree as at the pin, because rendering reads the working tree and
  # ignores git_ref. A pinned citation of a regenerated artifact such as
  # results/summary.json must therefore NOT be templated: it would render
  # whichever run wrote that file last. Those figures stay typed and pinned.
  - question: >-
      What is the current bottleneck in the AMIP simulation?
    answer: >-
      Kernel time, and no longer any single kernel: with host time outside the GPU timeline at {gap_frac_of_wall:.3%} of wall the run is densely GPU-bound, so there is no launch-latency or idle win to be had and the device total is the whole budget.
      Inside it the cost is concentrated at the top and then spreads fast: {kernels_for_50pct:.0f} of {distinct_kernels:.0f} distinct kernels carry half the device time, but it takes {kernels_for_80pct:.0f} to reach 80% and {kernels_for_90pct:.0f} to reach 90%.
      Radiation is still the largest named block at {radiation_pct:.1f}% even with the fused all-sky/clear-sky solves now in both arms, followed by the microphysics cache at {microphysics_pct:.1f}%, the implicit solver's MatrixFields kernels at {matrix_pct:.1f}%, spectral-element operators at {spectral_pct:.1f}% and EDMF at {edmf_pct:.1f}%, with {other_pct:.1f}% spread across everything else.
      So the honest answer is that attacking the next 10% now means a population rather than a kernel, and the small-launch band is not where it lives: the {small_launches:,.0f} launches under {small_threshold:.0f}us are {small_pct_of_launches:.0f}% of all launches and only {small_pct_of_time:.1f}% of the time.
      What bounds the population approach is occupancy: of {reg_kernels:.0f} pointwise kernels measured under Nsight Compute, {reg_addressable:.0f} ({reg_addressable_pct:.1f}%) are capped by registers ALONE and below full occupancy, so a register saving could buy them something, while {reg_at_full:.0f} are already at full occupancy and can gain nothing however well their parameters fold.
      The `other` share is a residual and is reported as one; `other_top` in the same file names its largest members, which is how the implicit solver's biggest kernel was found to be misattributed to it.
    evidence:
      - kind: value
        path: results/step-breakdown.toml
        key: gap_frac_of_wall
        name: gap_frac_of_wall
        explanation: >-
          Measured WITHOUT a profiler, using CUDA events. nsys cannot answer
          this: its own instrumentation dominates the idle measurement, and it
          reports MORE idle for the faster arm (docs/learnings.md 2b-i, 4f).
          This is the number that makes the rest of the answer about kernel
          time rather than about scheduling.
      - kind: result
        path: results/kernel-population.json
        values:
          kernels_for_50pct: baseline.concentration.kernels_for_50pct
          kernels_for_80pct: baseline.concentration.kernels_for_80pct
          kernels_for_90pct: baseline.concentration.kernels_for_90pct
          distinct_kernels: baseline.concentration.distinct_kernels
          radiation_pct: baseline.subsystems.radiation.pct_of_kernel_time
          microphysics_pct: baseline.subsystems.microphysics_cache.pct_of_kernel_time
          matrix_pct: baseline.subsystems.matrix_field_solve.pct_of_kernel_time
          spectral_pct: baseline.subsystems.spectral_element.pct_of_kernel_time
          edmf_pct: baseline.subsystems.edmf.pct_of_kernel_time
          other_pct: baseline.subsystems.other.pct_of_kernel_time
        explanation: >-
          The baseline arm's full device decomposition, which sums to 100% by
          construction, plus how many kernels it takes to cover half, 80% and
          90% of kernel time. The concentration figures are what distinguish a
          single bottleneck from a population and are the reason this answer
          does not name one. Radiation is attributed by the `rte_` prefix and
          claimed before any other pattern; note that the all-sky and clear-sky
          solves share a kernel shortName and are told apart only by the
          demangled signature, which is what the `radiation` sub-table does.
      - kind: result
        path: results/kernel-shares.json
        values:
          small_launches: baseline.small_kernels.launches
          small_threshold: baseline.small_kernels.threshold_us
          small_pct_of_launches: baseline.small_kernels.pct_of_launches
          small_pct_of_time: baseline.small_kernels.pct_of_kernel_time
        explanation: >-
          The short-launch band, as device time rather than host overhead. It
          is the standing temptation on this project -- most launches are tiny,
          so fusing them looks like the obvious win -- and it is quantified
          here precisely so that it can be ruled out: a majority of launches
          carrying a few percent of the time cannot pay for the work.
      - kind: result
        path: results/pointwise-registers.json
        values:
          reg_kernels: kernels
          reg_addressable: addressable
          reg_addressable_pct: addressable_pct
          reg_at_full: at_full_occupancy
        explanation: >-
          From Nsight Compute, so it carries occupancy limiters that nsys does
          not collect. `addressable` is the count capped by registers ALONE and
          below full occupancy, which is the only group a parameter fold can
          help; `at_full_occupancy` is the group that bounds the approach from
          the other side. A kernel already over the 255-register cap spends any
          freed register on its live state rather than on occupancy.
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          The per-kernel breakdown on the 120-step phase-independent window,
          which is LCM(20, 60, 120) of the periodic processes and so fires every
          scheme at its exact long-run share. The earlier 40-step window was
          shorter than the gravity-wave period and made microphysics look
          dominant.
  - question: >-
      How much of a GPU kernel-time saving actually reaches SYPD?
    answer: >-
      It depends on where the saving is, and the difference is large enough to change what is worth doing: radiation work converts at {radiation_mean:.0f}% ({radiation_min:.0f}-{radiation_max:.0f}% over {radiation_n} experiments), microphysics work at {microphysics_mean:.0f}% ({microphysics_min:.0f}-{microphysics_max:.0f}% over {microphysics_n}).
      So the rule of thumb this project carried for months -- about a third of a kernel-time saving shows up end to end -- was measured entirely on microphysics and understates a radiation change by more than a factor of two.
      Both halves of each ratio are read out of the tag that recorded them: kernel time from the profiled nsys stages, SYPD from the unprofiled AMIP ones, which is the only number that answers "is the model faster".
      Why radiation converts better is NOT established. Plausible: radiation runs as a few very long kernels with nothing to overlap them against, while the microphysics kernel is one of thousands per step and its saving may be partly absorbed by whatever else is in flight. Treat the ratios as measured, the explanation as a hypothesis.
    evidence:
      - kind: result
        path: results/pass-through.json
        values:
          radiation_mean: by_subsystem.radiation.mean_pct
          radiation_min: by_subsystem.radiation.min_pct
          radiation_max: by_subsystem.radiation.max_pct
          radiation_n: by_subsystem.radiation.n
          microphysics_mean: by_subsystem.microphysics.mean_pct
          microphysics_min: by_subsystem.microphysics.min_pct
          microphysics_max: by_subsystem.microphysics.max_pct
          microphysics_n: by_subsystem.microphysics.n
        explanation: >-
          Both subsystems' conversion ratios, as mean, range and sample count.
          Each ratio is an end-to-end SYPD gain divided by the GPU kernel-time
          reduction that produced it, and the pass-through stage reads both
          halves out of the experiment tags with git show rather than from the
          working tree. The microphysics mean is where the "about a third" rule
          came from; radiation converts at roughly twice that.
      - kind: table
        path: experiments.csv
        explanation: >-
          The experiments themselves, each reproducible from its tag. The
          pass-through stage reads both halves of every ratio out of those
          tags with git show rather than from the working tree.
  - question: >-
      What actually limits the hot SGS-quadrature microphysics kernel, and which
      of the available levers can move it?
    answer: >-
      Register pressure, and it is addressable by payload after all -- which is the opposite of what this answer said for three weeks.
      The kernel the model runs compiled to {fold_quad_regs_baseline:.0f} registers, the hardware maximum per thread, which bought it {fold_quad_warps_baseline:.0f} warps per SM out of 64; the isolated quadrature body also wants more than the cap and spills {quad_spill:.0f} bytes, so the live state is genuinely large.
      The payload lever is open after all, and reading it as shut cost three null measurements: the parameters were reaching the kernel inside an evaluator struct, which boxes a compile-time constant into a field and reads it back per quadrature point, so the fold was being erased at the struct boundary rather than refused by the loop.
      Putting them in the struct's TYPE instead takes the kernel from {fold_quad_regs_baseline:.0f} registers to {fold_quad_regs_mod:.0f} and {fold_quad_warps_baseline:.0f} warps per SM to {fold_quad_warps_mod:.0f}, worth {fold_quad_change:.1f}% on the kernel (see the question on Val and CliMA/ClimaCore.jl#2676).
      What remains is reducing the live state itself -- fewer quadrature points, which was priced and withdrawn, or fewer live values per point -- and that is now the lever for the NEXT occupancy step, which this kernel reaches at {fold_quad_next_step:.0f} registers.
    notes: >-
      Answered for the stack before the 2026-09-21 update in docs/learnings.md 2c
      and 4a: register pressure at the 255-register cap, with a guarded
      __launch_bounds__ occupancy target as the lever that works. That update
      re-enabled cloud ice formation and liquid freezing in the 1M microphysics,
      which changes this kernel, so it needs re-measuring; the ncu stages that would
      show its registers and spilling are frozen.

      One lever is now ruled out by measurement rather than argument. The
      kernel's parameters -- CloudMicrophysics 1M params at 348 bytes and
      thermodynamics params at 104 -- are isbits, so Julia accepts them as type
      parameters, and folding them that way is something ClimaAtmos can do
      alone: microphysics_tendencies_1m, Microphysics1MEvaluator and
      integrate_over_sgs are all ClimaAtmos code, so no CloudMicrophysics
      release is involved. In isolation the fold is dramatic, taking one
      evaluation body from {val_args:.0f} registers to {val_val:.0f} and
      clearing two occupancy steps.

      On the path the model runs, a plain Val bought nothing: the quadrature
      body sits at {quad_args:.0f} registers with or without it, spilling
      {quad_spill:.0f} bytes. That was read as the loop's live state consuming
      every freed register, and it was wrong -- the Val was being passed to a
      function that stored it in an evaluator FIELD, which boxes the constant
      and reads it back per quadrature point. The same body with the parameters
      in the struct's type compiles to {eval_type_regs:.0f} registers and
      {eval_type_spill:.0f} bytes against {eval_field_regs:.0f} and
      {eval_field_spill:.0f}, and the change applied to the model is worth
      {fold_quad_change:.1f}% on this kernel. What docs/learnings.md left open
      -- whether the 255 is a demand or the cap -- is answered the other way:
      enough of it was payload to clear an occupancy step.
    evidence:
      - kind: result
        path: results/val-params-registers.toml
        values:
          val_args: runtime_arguments.registers
          val_val: val_type_parameters.registers
          quad_args: quad_runtime_arguments.registers
          quad_spill: quad_runtime_arguments.local_bytes
          eval_field_regs: evaluator_params_as_fields.registers
          eval_field_spill: evaluator_params_as_fields.local_bytes
          eval_type_regs: evaluator_params_in_type.registers
          eval_type_spill: evaluator_params_in_type.local_bytes
        explanation: >-
          One microphysics body compiled three ways -- parameters as runtime
          arguments, as const globals, and folded through Val -- for an isolated
          evaluation and for the quadrature path the model actually calls. The
          isolated columns are why the idea looked promising and the quadrature
          columns are why it is dead: Val lands exactly on the const-global
          figure in both, which is the mechanism working, and in the quadrature
          case that figure is the 255-register cap. Compile-only, so nothing
          runs, and standalone, so it needs no coupled simulation.
      - kind: result
        path: results/param-fold.json
        values:
          fold_quad_regs_baseline: kernels.microphysics_quadrature.baseline.registers
          fold_quad_regs_mod: kernels.microphysics_quadrature.mod.registers
          fold_quad_warps_baseline: kernels.microphysics_quadrature.baseline.warps_per_sm
          fold_quad_warps_mod: kernels.microphysics_quadrature.mod.warps_per_sm
          fold_quad_change: kernels.microphysics_quadrature.mean_change_pct
          fold_quad_next_step: kernels.microphysics_quadrature.mod.registers_for_next_step
        explanation: >-
          The kernel as the profiled run compiled it, in both arms: registers
          per thread, the block size ClimaCore chose from them, and the warps
          per SM the pair allows. Read from the nsys databases rather than
          results/top-kernels.csv because that table averages over a kernel
          name, and one name this treatment touches covers two kernels at
          different register counts.
      - kind: value
        path: results/cm-registers.toml
        key: layers.LinearizedAverage nsub=2.registers
        name: linearized_avg_registers
        explanation: >-
          A full 1M CloudMicrophysics evaluation, compiled standalone with the
          parameter structs passed as kernel ARGUMENTS -- as const globals the
          compiler folds their fields and understates pressure enough to invert
          the conclusion, which it once did. Independent of substep count, so
          microphysics_n_substeps_quadrature costs time but not occupancy. This
          stage is cheap and not frozen, so it re-runs against whatever is
          checked out; read its revision before comparing.
      - kind: value
        path: results/kernel-population.json
        key: baseline.gpu_idle_pct
        name: gpu_idle_pct
        explanation: >-
          READ AS A PROFILING ARTIFACT, NOT A TARGET. The profiler's own tracing
          runs to ~33 CUDA API calls per launch and accounts for the bulk of
          this idle; the profiled window does not even run at the same rate as
          the real one. Kernel TIMES from nsys are device-side and trustworthy;
          the gaps between them are not. See docs/learnings.md 2b-i.
      - kind: result
        path: results/launch-bounds/launch-bounds.toml
        git_ref: exp/2026-09-01-cm-fuse
        explanation: >-
          The three phases this answer compares, in one file: the hot
          SGS-quadrature kernel with launch bounds off, which is what the
          baseline arm runs; the counterfactual with the spill budget loosened
          until the annotation is accepted, reaching 12 warps/SM; and the
          shipped configuration, where the single-call kernel is annotated for
          a small spill cost. guarded.decisions records which kernels were
          accepted. Measuring the rejected configuration deliberately is the
          point, and is what showed the guard was right rather than arbitrary.
      - kind: table
        path: results/kernel-resources.csv
        git_ref: exp/2026-09-07-evaluator-repeat
        explanation: >-
          What establishes the kernel as register-limited rather than
          memory-limited. Pinned because the ncu stages are frozen; cited for
          the characterization of the baseline kernel, which has been stable
          across revisions, not as evidence for any treatment's effect.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          The pipeline-level number this kernel work has to show up in
          eventually. Kernel times are not SYPD, and this mechanism measured a
          SYPD null on its own. Not templated into the answer, and must not be:
          the working tree's value is whatever the mod arm last carried, which
          since 2026-10-07 is the fold AND the fused radiation together. The
          fold measured on its own is commit 4a2424b; check that revision's
          results/summary.json rather than this one for the fold alone.
  - question: >-
      Does putting the parameters in `Val` make pointwise kernels measurably faster across the board, as CliMA/ClimaCore.jl#2676 asks?
    answer: >-
      Yes, where the parameters are a real share of the kernel's live state AND the kernel is a real share of the device, and the SIZE of the payoff is set by whether the freed registers let one more block fit on an SM.
      Four kernels in ClimaAtmos now have it, measured in the model rather than in isolation, and measured across two successive upstream rewrites of those kernels, which is what prices the step itself.
      Two cross one on the current stack: the SGS quadrature {fold_quad_regs_baseline:.0f} -> {fold_quad_regs_mod:.0f} registers, {fold_quad_warps_baseline:.0f} -> {fold_quad_warps_mod:.0f} warps per SM, {fold_quad_change:.1f}% on the kernel; and the cloud-fraction kernel {fold_cf_regs_baseline:.0f} -> {fold_cf_regs_mod:.0f} registers, {fold_cf_warps_baseline:.0f} -> {fold_cf_warps_mod:.0f} warps, {fold_cf_change:.1f}%.
      The other two do not: the updraft path sheds {fold_upd_regs_saved:.0f} registers, {fold_upd_regs_baseline:.0f} -> {fold_upd_regs_mod:.0f}, and still sits at {fold_upd_warps_mod:.0f} warps per SM, one block short of the next step, which it would reach at {fold_upd_next_step:.0f}; the SGS-moments kernel sheds {fold_sgs_regs_saved:.0f}, {fold_sgs_regs_baseline:.0f} -> {fold_sgs_regs_mod:.0f}, and stays at {fold_sgs_warps_mod:.0f} warps, needing {fold_sgs_next_step:.0f}.
      They took {fold_upd_change:.1f}% and {fold_sgs_change:.1f}% anyway, so a fold that misses a step is not a fold that does nothing -- an earlier answer here said the payoff was all-or-nothing, and this measurement withdraws that.
      What the step is worth can be read off a kernel that switched sides: the updraft path crossed one before and lost it to an added argument, giving back {fold_upd_lost_points:.1f} points of payoff.
      The SGS-moments kernel supplied the other half of that comparison last time, having gained a step and picked up a comparable amount in the opposite direction; the rewrite that fused it into the cloud-fraction pass has since taken that step away again, so the two-sided form of this evidence is withdrawn and only the losing side is live.
      Neither direction is a controlled comparison, because each of those rewrites also altered the kernel bodies.
      Share of the device bounds the whole question, and the SGS-moments kernel is the case: at {fold_sgs_ms:.1f} ms of a {fold_dev_ms:.0f} ms baseline device total, a perfect fold there is worth less than a run can resolve, and closing the last two bare-parameter terms in it -- so the fold applies to all of the kernel rather than most of it -- moved the AMIP pair by less than the noise floor.
      Register count does not predict which case a kernel is in: two kernels that both start at the {fold_quad_regs_baseline:.0f}-register cap land on opposite sides of a step, while a {fold_cf_regs_baseline:.0f}-register one crosses.
      The distance to the next step does predict it, and it is computable before any code is written, because ClimaCore sizes the launch block from the register count and warps per SM follow from the pair.
      Across the four kernels this is {fold_own_change:.2f}% of their time on a 120-step window, {fold_total_saved:.0f} ms, concentrated almost entirely in the first kernel, which is {fold_total_change:.2f}% of the whole device.
      The population bounds how far it can go: of {kernels:.0f} kernels profiled, {addressable:.0f} ({addressable_pct}%) are capped by registers alone AND below full occupancy, while {at_full_occupancy:.0f} are already at full occupancy and can gain nothing however well their parameters fold.
      The mechanism is settled: Val folds an isbits parameter set to literals and lands on the const-global register count exactly, taking an isolated microphysics evaluation body from {val_args:.0f} registers to {val_val:.0f}, {arg_warps:.0f} to {val_warps:.0f} warps per SM.
      The thing that will defeat anyone applying it is the struct boundary: an evaluator holding the parameters as FIELDS boxes the constant and reads it back per point, {eval_field_regs:.0f} registers and {eval_field_spill:.0f} bytes of spill against {eval_type_regs:.0f} and {eval_type_spill:.0f} for the same body with the parameters in the type.
      Three earlier measurements here reported Val as worthless for exactly that reason, including on the kernel it later improved by half.
    evidence:
      - kind: result
        path: results/val-params-registers.toml
        values:
          val_args: runtime_arguments.registers
          val_val: val_type_parameters.registers
          arg_warps: runtime_arguments.warps_per_sm
          val_warps: val_type_parameters.warps_per_sm
          quad_args: quad_runtime_arguments.registers
          quad_val: quad_val_type_parameters.registers
          quad_spill: quad_runtime_arguments.local_bytes
          quad_val_spill: quad_val_type_parameters.local_bytes
          eval_field_regs: evaluator_params_as_fields.registers
          eval_field_spill: evaluator_params_as_fields.local_bytes
          eval_type_regs: evaluator_params_in_type.registers
          eval_type_spill: evaluator_params_in_type.local_bytes
          mp_bytes: mp_sizeof_bytes
          tps_bytes: tps_sizeof_bytes
        explanation: >-
          One microphysics body compiled three ways -- parameters as runtime
          arguments, as const globals, and folded through Val -- for an isolated
          evaluation and for the quadrature path the model calls. The
          const-global column is the target, so Val matching it is the mechanism
          working rather than a coincidence, and in the quadrature case that
          target is itself the register cap. Compile-only with
          `CUDA.@cuda launch=false`, so nothing executes, and standalone, so it
          needs no coupled simulation: the stage is minutes.
      - kind: result
        path: results/pointwise-registers.json
        values:
          kernels: kernels
          addressable: addressable
          addressable_pct: addressable_pct
          addressable_at_cap: addressable_at_cap
          at_full_occupancy: at_full_occupancy
          register_limited: register_limited
        explanation: >-
          The population the question asks about, measured rather than
          extrapolated: for every kernel in a 120-step run, its registers and
          which of the four occupancy limits binds. Static launch metrics only,
          so ncu needs no kernel replay and the whole population costs one job
          instead of the ninety minutes per six kernels that the frozen --set
          full stages cost. results/pointwise-registers.csv has the per-kernel
          rows behind it, including which kernels sit at the cap.
      - kind: result
        path: results/param-fold.json
        values:
          fold_quad_regs_baseline: kernels.microphysics_quadrature.baseline.registers
          fold_quad_regs_mod: kernels.microphysics_quadrature.mod.registers
          fold_quad_warps_baseline: kernels.microphysics_quadrature.baseline.warps_per_sm
          fold_quad_warps_mod: kernels.microphysics_quadrature.mod.warps_per_sm
          fold_quad_change: kernels.microphysics_quadrature.mean_change_pct
          fold_upd_regs_baseline: kernels.microphysics_updraft.baseline.registers
          fold_upd_regs_mod: kernels.microphysics_updraft.mod.registers
          fold_upd_regs_saved: kernels.microphysics_updraft.registers_saved
          fold_upd_warps_mod: kernels.microphysics_updraft.mod.warps_per_sm
          fold_upd_next_step: kernels.microphysics_updraft.mod.registers_for_next_step
          fold_upd_change: kernels.microphysics_updraft.mean_change_pct
          fold_upd_lost_points: vs_prior_stack.switched.microphysics_updraft.payoff_points
          fold_cf_regs_baseline: kernels.cloud_fraction.baseline.registers
          fold_cf_regs_mod: kernels.cloud_fraction.mod.registers
          fold_cf_warps_baseline: kernels.cloud_fraction.baseline.warps_per_sm
          fold_cf_warps_mod: kernels.cloud_fraction.mod.warps_per_sm
          fold_cf_change: kernels.cloud_fraction.mean_change_pct
          fold_sgs_regs_baseline: kernels.sgs_moments.baseline.registers
          fold_sgs_regs_mod: kernels.sgs_moments.mod.registers
          fold_sgs_warps_baseline: kernels.sgs_moments.baseline.warps_per_sm
          fold_sgs_warps_mod: kernels.sgs_moments.mod.warps_per_sm
          fold_sgs_change: kernels.sgs_moments.mean_change_pct
          fold_sgs_regs_saved: kernels.sgs_moments.registers_saved
          fold_sgs_next_step: kernels.sgs_moments.mod.registers_for_next_step
          fold_sgs_ms: kernels.sgs_moments.baseline.total_ms
          fold_dev_ms: device_total.baseline_ms
          fold_total_change: fold_attributable.pct_of_device_total
          fold_total_saved: fold_attributable.ms_saved
          fold_own_change: fold_attributable.change_pct
        explanation: >-
          The four kernels the pattern was applied to, as the profiled runs
          compiled them: registers per thread, the block size ClimaCore chose
          from them, the warps per SM the pair allows, and the time. This is
          what makes the answer an in-model result rather than a compile-only
          one -- and the SGS-moments row is the control the other three need,
          since it had the fold applied the same way and did not cross a step.
          Read from the nsys databases rather than results/top-kernels.csv,
          which averages over a kernel name that here covers two kernels at
          different register counts. The device figure quoted is
          fold_attributable, the subtotal over these four kernels, not
          device_total: the mod arm now also carries the fused radiation, so
          the whole-arm total measures two treatments at once.
      - kind: value
        path: results/cm-registers.toml
        key: layers.LinearizedAverage nsub=2.registers
        name: linearized_avg_registers
        explanation: >-
          Why a layer compiled on its own misleads: it has room for a payload
          saving to appear in its register count, where the broadcast the model
          runs is split into several smaller kernels whose limits differ. Any
          register experiment answers for the body it compiles.
tables:
  - path: results/top-kernels.csv
    title: Top 20 GPU kernels, baseline vs. mod
    description: >-
      Per-kernel Nsight Systems aggregates for the top 20 kernels ranked by
      baseline total time, covering both the baseline and modified runs:
      invocation counts, total and mean duration, share of total GPU time,
      registers per thread, and the percent change in total time.

  - path: results/kernel-resources.csv
    title: Per-kernel register, spill, and occupancy stats
    description: >-
      Nsight Compute resource metrics for the profiled microphysics kernels,
      baseline vs. mod: registers per thread, register spilling (requests and
      the share of memory traffic they cost), stack frame, and achieved vs.
      theoretical occupancy.

      This exists because the nsys table above cannot show the mechanism behind
      the headline speedup. The hot kernel can sit pinned at the 255-register
      cap in BOTH cases, so by the columns nsys collects nothing changed at all,
      while its total time falls by half. Registers at the cap is not the same
      thing as spilling, and nsys does not collect spill metrics -- only Nsight
      Compute does. Specific figures are deliberately left to the table rather
      than quoted here, so this description cannot go stale against the data it
      describes.

environments:
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_options:
      - --gpus=1
      - --time=120
  sassy:
    kind: system
    host: sassy.caltech.edu
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.13"

pipeline:
  stages:
    record-treatment:
      # Reports git state -- submodule SHAs, refs, whether a tree was dirty --
      # which DVC cannot see, because its declared inputs are file contents.
      # Committing a submodule changes no content, so the stage was skipped as
      # unchanged while the very thing it records had changed, and it kept
      # reporting a stale SHA and a dirty tree that was no longer dirty.
      # It is CPU-only and takes seconds, so it runs every time.
      always_run: true
      kind: python-script
      environment: py
      script_path: scripts/record-treatment.py
      # What actually ran, as opposed to what a commit message says ran. A
      # superproject commit pins every submodule SHA, but not whether a package
      # was dev'd into the AMIP environments (a submodule can be checked out and
      # irrelevant), nor whether a tree was dirty, nor which CLIMA_* variables
      # the stages exported. Each of those has changed the meaning of a result
      # in this project at least once.
      #
      # Depends on diffs/ rather than the submodules directly, so it re-runs
      # after make-diffs has observed the same state, and cannot disagree with
      # the archived diff.
      inputs:
        - from_stage_outputs: make-diffs
        - calkit.yaml
      outputs:
        - path: results/treatment.json
          storage: git
    make-diffs:
      kind: shell-script
      environment: _system
      script_path: scripts/make-diffs.sh
      inputs:
        - ClimaCoupler.jl
        - ClimaCoupler.jl-mod
        - ClimaCore.jl
        - ClimaCore.jl-mod
        - ClimaAtmos.jl
        - ClimaAtmos.jl-mod
        - CloudMicrophysics.jl-mod
        - RRTMGP.jl
        - RRTMGP.jl-mod
      outputs:
        - path: diffs
          storage: git
    baseline-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/baseline
        - ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/nsys/baseline.nsys-rep
        - results/nsys/baseline.sqlite
    mod-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/nsys/mod
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
        - ClimaAtmos.jl-mod/config
      outputs:
        - results/nsys/mod.nsys-rep
        - results/nsys/mod.sqlite
    baseline-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
      # describes.
      # FROZEN 2026-09-03, both together and at the same revision. They cost
      # ~1.5 h each, more than half the pipeline's cluster time. Unfreeze BOTH
      # or NEITHER: they were previously frozen independently and last ran three
      # days apart (baseline 2026-08-20, a null test; mod 2026-08-23, the
      # clear-air early-out), so results/kernel-resources.csv presented two
      # unrelated runs as one comparison. See "Freeze and unfreeze the two ncu
      # stages together" in AGENTS.md.
      frozen: true    # refreshed 2026-09-05 against the 128-register kernel; both re-frozen together
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      args:
        - results/ncu/baseline
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the baseline tree. It
        # also matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl/experiments/AMIP
        - --config
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/ncu/baseline.ncu-rep
        - path: results/ncu/baseline-details.csv
          storage: git
          delete_before_run: true
    mod-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
      # describes.
      # FROZEN 2026-09-03, both together and at the same revision. They cost
      # ~1.5 h each, more than half the pipeline's cluster time. Unfreeze BOTH
      # or NEITHER: they were previously frozen independently and last ran three
      # days apart (baseline 2026-08-20, a null test; mod 2026-08-23, the
      # clear-air early-out), so results/kernel-resources.csv presented two
      # unrelated runs as one comparison. See "Freeze and unfreeze the two ncu
      # stages together" in AGENTS.md.
      frozen: true    # refreshed 2026-09-05 against the 128-register kernel; both re-frozen together
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/ncu/mod
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the mod tree. It also
        # matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_mod_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl-mod/experiments/AMIP
        - --config
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
      outputs:
        - results/ncu/mod.ncu-rep
        - path: results/ncu/mod-details.csv
          storage: git
          delete_before_run: true
    amip-baseline:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      args:
        - --project=ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - --config_file
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --job_id
        - gpu_amip_progedmf_1M_land_he16_baseline
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
        - ClimaAtmos.jl/toml
    amip-mod:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/experiments/AMIP/run_simulation.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --job_id
        - gpu_amip_progedmf_1M_land_he16_mod
      inputs:
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - ClimaCoupler.jl-mod/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
        - ClimaAtmos.jl-mod/toml
        - ClimaAtmos.jl-mod/config
    summarize:
      kind: python-script
      environment: py
      script_path: scripts/summarize.py
      inputs:
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: results/summary.json
          storage: git
    compare-kernels:
      kind: jupyter-notebook
      notebook_path: notebooks/compare-kernels.ipynb
      environment: py
      inputs:
        - from_stage_outputs: baseline-nsys
        - from_stage_outputs: mod-nsys
      outputs:
        - path: results/top-kernels.csv
          storage: git
      html_storage: git
      executed_ipynb_storage: git
    pass-through:
      kind: python-script
      script_path: scripts/pass-through.py
      environment: py
      # Reads each experiment out of its tag with git show, so it has no file
      # inputs and nothing in the working tree can change what it reports.
      always_run: true
      outputs:
        - path: results/pass-through.json
          storage: git

    kernel-shares:
      kind: python-script
      script_path: scripts/kernel-shares.py
      environment: py
      inputs:
        - results/top-kernels.csv
        - results/kernel-population.json
      outputs:
        - path: results/kernel-shares.json
          storage: git
    export-kernel-resources:
      kind: python-script
      environment: py
      script_path: scripts/export-kernel-resources.py
      # Reads the CSVs Nsight Compute already exported, so this needs no GPU and
      # is not frozen alongside the ncu stages that produce them.
      inputs:
        - from_stage_outputs: baseline-ncu
        - from_stage_outputs: mod-ncu
      outputs:
        - path: results/kernel-resources.csv
          storage: git
    compile-time-doc:
      kind: markdown
      target_path: docs/compile-time.md
      environment: py
      # Live on main, unlike the experiment documents. Its only input is the
      # committed results/compile-time/compile-time.toml, which the frozen
      # compile-time-study stage does not regenerate here, so re-running this
      # cannot restate the experiment against a different run.
    launch-cost:
      kind: markdown
      target_path: docs/experiments/launch-cost.md
      environment: py
      # Frozen on main, live at meas/2026-09-19-launch-cost, following
      # compile-time-study. The 2026-09-21 submodule
      # update moved the whole stack, which makes both nsys stages this
      # document declares stale. Re-running them here would re-profile for
      # hours and then restate the experiment against a different stack --
      # and because a templated value renders from the WORKING TREE rather
      # than from its git_ref, the fusion-ceiling answers would quietly start
      # displaying the new numbers while their evidence still checked against
      # the tag. Re-measure by tagging a new experiment, not by re-running
      # this one.
      frozen: true
    step-breakdown:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # How much of a coupler step is GPU work, measured WITHOUT a profiler.
      # nsys cannot answer this: docs/learnings.md 2b-i showed its own
      # instrumentation dominates the idle measurement here, and the profiled mod
      # arm reports MORE idle than baseline while being faster in SYPD. This uses
      # CUDA events instead -- two records per ~277 ms step -- and reports wall,
      # GPU span, and the gap between them. gpu_span includes inter-kernel gaps,
      # so it bounds GPU busy from above and the gap is a LOWER bound on host
      # time outside the GPU timeline.
      #
      # Must run through this wrapper, not a bare srun: without `module load
      # climacommon` Julia picks up system CUDA libraries and a step takes 118 s
      # instead of 277 ms, which is how the first attempt at this measurement was
      # wasted.
      scheduler:
        options:
          - --gpus=1
          - --time=90
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/measure-step-breakdown.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        # 2880 steps = one simulated day. The 40-step benchmark window fires
        # radiation (20 steps) but NEVER fires either gravity-wave scheme (60),
        # the cloud-fraction update (120), or the hourly diagnostics write (120).
        # One day covers all of those many times over, and the daily ocean and
        # sea-ice diagnostics once. Only the monthly and 30-day work stays out of
        # reach. At ~150 ms/step this is ~7 minutes of stepping.
        - --steps
        - '2880'
        - --t_end
        - 90000secs
        - --out
        - results/step-breakdown.toml
      inputs:
        - scripts/measure-step-breakdown.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaAtmos.jl-mod/src
        - CloudMicrophysics.jl-mod/src
      outputs:
        - path: results/step-breakdown.toml
          storage: git

    pointwise-registers:
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu-pointwise.sh
      # Answers the half of CliMA/ClimaCore.jl#2676 that needs no code change:
      # across the whole kernel population, which kernels are capped by
      # registers at all? Val can only pay where they are, so this bounds the
      # answer before anyone wraps a parameter.
      #
      # Static launch/occupancy metrics only, so ncu needs no kernel replay --
      # minutes over every kernel, where the frozen --set full stages cost an
      # hour and a half for six.
      #
      # No --launch-skip: ncu intercepts every launch it skips, and skipping
      # 4000 of them burned a 90-minute allocation without profiling anything.
      # These metrics are properties of the compiled kernel rather than of the
      # run, so a warm model buys nothing here.
      scheduler:
        options:
          - --gpus=1
          - --time=240
      args:
        - results/ncu/pointwise
        - --project
        - ClimaCoupler.jl-mod/experiments/AMIP
        - --config
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-count
        - "1500"
      inputs:
        - scripts/run-ncu-pointwise.sh
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
      outputs:
        - path: results/ncu/pointwise.ncu-rep
          storage: dvc
        - path: results/ncu/pointwise-details.csv
          storage: dvc

    export-pointwise-registers:
      kind: python-script
      environment: py
      script_path: scripts/export-pointwise-registers.py
      args:
        - results/ncu/pointwise-details.csv
      inputs:
        - scripts/export-pointwise-registers.py
        - results/ncu/pointwise-details.csv
      outputs:
        - path: results/pointwise-registers.csv
          storage: git
        - path: results/pointwise-registers.json
          storage: git

    export-param-fold:
      kind: python-script
      environment: py
      script_path: scripts/export-param-fold.py
      # Reads the two profiles the pipeline already produced, so no GPU. It
      # exists because top-kernels.csv averages over a kernel name, and one of
      # the names this treatment touches covers two kernels at different
      # register counts.
      inputs:
        - scripts/export-param-fold.py
        - results/param-fold-prior.json
        - from_stage_outputs: baseline-nsys
        - from_stage_outputs: mod-nsys
      outputs:
        - path: results/param-fold.json
          storage: git

    val-params-registers:
      kind: shell-script
      environment: clima
      script_path: scripts/run-val-params-registers.sh
      # Tests whether Val reaches what const globals reach. cm-registers
      # recorded the same body at 246 registers with parameters as runtime
      # arguments and 101 as const globals, which clears two occupancy steps --
      # but const globals are not available to a model whose parameters come
      # from configuration. Val is, and folds for the same reason.
      #
      # Compile-only and standalone: CMP.Microphysics1MParams constructs without
      # a coupled simulation, so this is minutes rather than an hour.
      scheduler:
        options:
          - --gpus=1
          - --time=40
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
      inputs:
        - scripts/measure-val-params-registers.jl
        - scripts/run-val-params-registers.sh
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
      outputs:
        - path: results/val-params-registers.toml
          storage: git

    cm-registers:
      kind: shell-script
      environment: clima
      script_path: scripts/run-cm-registers.sh
      # Minutes, not an hour: compiles kernels and reads register counts rather
      # than running a simulation. Answers where the hot kernel's registers go,
      # in two halves -- the CloudMicrophysics evaluation on its own, and the
      # ClimaCore broadcast layers it runs inside.
      #
      # NOT FROZEN, BUT ONLY HALF OF IT ALWAYS RUNS. The broadcast layers are
      # read out of `ClimaCoreCUDAExt.LAUNCH_BOUNDS_CACHE`, which exists only on
      # ClimaCore.jl-mod branch `pb/launch-bounds` (PR 2601). With any other
      # ClimaCore checked out, measure-cm-registers.jl logs "ClimaCore lacks the
      # launch-bounds record; skipping the broadcast layers" and emits the
      # CloudMicrophysics layers alone -- a partial file, not a failed one. So
      # the framework half of the 163/68 decomposition is reproducible only with
      # that branch checked out, and a run without it silently drops the layers
      # rather than erroring. Check for the A-D keys before reading a comparison
      # out of this file, and see the revision caveat on the Q3 evidence entry.
      scheduler:
        options:
          - --gpus=1
          - --time=40
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
      inputs:
        - scripts/measure-cm-registers.jl
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
        - ClimaCore.jl-mod/ext
      outputs:
        - path: results/cm-registers.toml
          storage: git

    kernel-population:
      kind: python-script
      environment: py
      script_path: scripts/analyze-kernel-population.py
      # Cheap: reads the nsys SQLite exports on the login node, no GPU. Answers
      # the questions the per-kernel tables cannot -- how many kernels there are,
      # how much of the time the GPU is idle, and how much work sits in kernels
      # too small to be worth launching.
      inputs:
        - scripts/analyze-kernel-population.py
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
      outputs:
        - path: results/kernel-population.json
          storage: git

    launch-bounds-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-launch-bounds-study.sh
      # Frozen: this stage answered its question and cannot re-run here. It
      # measures ClimaCore's `__launch_bounds__` occupancy targeting, which
      # exists only on ClimaCore.jl-mod branch `pb/launch-bounds` (PR 2601,
      # commits 5428c6e2c and 45bf1792c). That branch is not checked out --
      # both ClimaCore arms currently sit at upstream main -- so
      # measure-launch-bounds.jl dies at its first reference to
      # `CUDAExt.LAUNCH_BOUNDS_TARGET_WARPS_PER_SM[]`, before it builds a
      # CoupledSimulation. The recorded TOML is not at risk (the write is far
      # downstream of that failure), but each of the three phases burns a GPU
      # on a shared node to fail the same way, which is what this flag prevents.
      #
      # To re-evaluate, check out the tag where the inputs exist:
      #   git checkout exp/2026-08-24-launch-bounds
      #   git submodule update --init --recursive
      #   calkit run launch-bounds-study
      # That tag pins ClimaCore.jl-mod at 45bf1792c. At the tag the stage is
      # not frozen and runs normally, which is what makes the recipe work.
      #
      # Unfreeze on this rev only after re-pointing ClimaCore.jl-mod at
      # `pb/launch-bounds` AND re-dev'ing it (see scripts/dev-local-repos-coupler.sh
      # -- a submodule can be checked out without reaching the run).
      frozen: true
      # Three full setup+JIT phases in one job, so the clima environment's
      # default 120 min is not enough. `env_default_options` defaults to
      # `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/launch-bounds/launch-bounds.toml
      inputs:
        - scripts/measure-launch-bounds.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/launch-bounds/launch-bounds.toml
          storage: git

    compile-time-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-compile-study.sh
      # Frozen: this stage answered its question and must not re-run here. Its
      # warmup arm needs AMIPWarmup dev'd into the AMIP environments, which
      # exists only at tag compile-time-warmup-ab -- the wiring cost a measured
      # 5.1% and was reverted. Re-running on this rev would produce a warmup arm
      # with no warmup, i.e. two identical arms overwriting the evidence with a
      # result that looks like a measurement. (measure-compile-time.jl also
      # fails hard in that case; this keeps `calkit run` from reaching it.)
      # To re-evaluate, check out the tag and run it there.
      frozen: true
      # Two full setup+JIT phases in one job (~32 min each), so the default 120
      # min from the clima environment is not enough. `env_default_options`
      # defaults to `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/compile-time/compile-time.toml
      inputs:
        - scripts/measure-compile-time.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/compile-time/compile-time.toml
          storage: git
    build-experiment-index:
      kind: python-script
      environment: py
      script_path: scripts/build-experiment-index.py
      # Generated rather than hand-maintained, so the index cannot drift from
      # what was recorded: every row is read out of git at its `exp/*` tag.
      #
      # Depends on results/summary.json because that is what changes when a new
      # experiment is produced. Git tags are not files, so DVC cannot watch them
      # directly -- which is also why an experiment's own row appears only after
      # the tag is created and this stage is re-run.
      inputs:
        - results/summary.json
      outputs:
        - path: experiments.md
          storage: git
        - path: experiments.csv
          storage: git
    analyze-logs:
      kind: jupyter-notebook
      notebook_path: notebooks/analyze-logs.ipynb
      environment: py
      inputs:
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: figures/sypd-time-series.png
          storage: git
      html_storage: git
      executed_ipynb_storage: git

showcase:
  - notebook: notebooks/analyze-logs.ipynb
