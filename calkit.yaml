owner: petebachant
name: clima-gpu-profiling
title: CliMA GPU profiling
description: Profiling GPU performance for CliMA.
git_repo_url: https://github.com/petebachant/clima-gpu-profiling

questions:
  # Answers are one sentence pointing at reproducible evidence; the reasoning
  # lives in docs/. Numbers are templated from value evidence by name rather
  # than typed -- but ONLY where the cited file is the same artifact in the
  # working tree as at the pin, because rendering reads the working tree and
  # ignores git_ref. A pinned citation of a regenerated artifact such as
  # results/summary.json must therefore NOT be templated: it would render
  # whichever run wrote that file last. Those figures stay typed and pinned.
  - question: >-
      What is the ceiling on kernel fusion, and which package would have to
      deliver it?
    answer: >-
      At most {ceiling_fuse_4to1_pct}% of a step from fusing the sub-25
      microsecond band four-to-one, or {ceiling_all_removed_pct}% if every short
      launch vanished outright, priced at {host_us_per_launch} microseconds of
      host time per launch -- an upper bound measured under a profiler that
      inflates exactly this quantity, and spread across seven packages, so no
      single repository can deliver it.
    evidence:
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.ceiling_fuse_4to1_pct
        name: ceiling_fuse_4to1_pct
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The ceiling for fusing the sub-25 microsecond band four-to-one, priced
          at the marginal host cost from the adjacent probe pair in the same
          document.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: fusion.ceiling_all_removed_pct
        name: ceiling_all_removed_pct
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The absolute bound, where every short launch disappears. Quoted so the
          ceiling cannot be mistaken for a target.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: marginal.host_us_per_launch
        name: host_us_per_launch
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The price everything above rests on, from a baseline and probe
          profiled back to back in one invocation. The earlier cross-day
          estimate of 18.51 would have inflated every figure here by 2.7x.
      - kind: publication
        path: docs/experiments/launch-cost.md
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The experiment. It declares both profiling stages itself, so the pair
          cannot be split across sessions.
  - question: >-
      How much of a timestep is spent launching kernels rather than running
      them, and is that a bigger target than the kernels themselves?
    answer: >-
      Superseded and mostly unsupported -- the launch and kernel counts stand
      because they are device-side, but the idle and gap times come from nsys
      gap analysis, which docs/learnings.md 2b-i shows is dominated by the
      profiler rather than the model; a launch costs {host_us_per_launch}
      microseconds of host time, and what survives is in the fusion-ceiling
      question above.
    evidence:
      - kind: publication
        path: docs/learnings.md
        section: "2b-i"
        explanation: >-
          Why the gap and idle times are withdrawn: profiled idle is dominated by the profiler's own tracing, not the model.
      - kind: publication
        path: docs/experiments/launch-overhead.md
        git_ref: meas/2026-09-17-launch-overhead
        explanation: >-
          The write-up, with every figure injected from
          results/launch-overhead.json rather than typed.
      - kind: value
        path: results/experiments/launch-cost/stats.json
        key: marginal.host_us_per_launch
        name: host_us_per_launch
        git_ref: meas/2026-09-19-launch-cost
        explanation: >-
          The re-measurement that replaced the withdrawn 18.51, taken as an
          adjacent pair from one invocation.
      - kind: value
        path: results/launch-probe.json
        key: launches
        name: probe_launches
        git_ref: meas/2026-09-17-launch-overhead
        explanation: >-
          Statistics of the probe profile, committed because the profile itself
          is transient: results/nsys/mod.sqlite is overwritten by the next
          experiment, and depending on it destroyed the measurement once.
  - question: >-
      Can the SGS microphysics cache kernel be made faster from inside a single
      package, and how much is that worth?
    answer: >-
      Yes -- a clear-air early-out plus a slimmer evaluator payload make the
      kernel about 7.5% faster, bit-for-bit and entirely within ClimaAtmos --
      but the guard already fires at {guard_fires_pct:.2f}% of quadrature
      points, which caps skip-based work here near 4%, and the whole result is
      worth roughly +0.5% SYPD, below the full-AMIP noise floor.
    evidence:
      - kind: publication
        path: docs/learnings.md
        section: "4r"
        explanation: >-
          Why the kernel is bound by register pressure and memory traffic rather than by the microphysics it computes, which is what caps skip-based work.
      - kind: table
        path: results/top-kernels.csv
        git_ref: exp/2026-09-15-microphysics-cache-atmos
        explanation: >-
          set_microphysics_tendency_cache_ 3434.8 -> 3177.7 ms (-7.49%). The
          same file at the null-test commit shows this kernel at +0.15% with
          identical arms, which is what makes the effect meaningful.
      - kind: value
        path: results/earlyout-hits.toml
        key: guard_fires_pct
        name: guard_fires_pct
        git_ref: meas/2026-09-15-earlyout-hit-rate
        explanation: >-
          The share of 13.9M quadrature points still taking the early-out, so
          the decay from August's -21.5% is not a hit-rate problem.
      - kind: table
        path: diffs/ClimaAtmos.jl.diff
        git_ref: exp/2026-09-15-microphysics-cache-atmos
        explanation: >-
          The whole treatment: arms_differ_in is ['ClimaAtmos.jl-mod'] and
          nothing else, which is what makes this a single-package result.
  - question: Can we improve the performance of the flagship AMIP simulation?
    answer:
      "if speedup_pct > 5": >-
        Yes -- the pipeline currently measures {speedup_pct:.2f}% SYPD for the
        modified stack at {mod_sypd:.5f} SYPD, carried by the RRTMGP
        aerosol-optics binary search rather than by the microphysics work this
        project started with.
      "elif speedup_pct > 0.5": >-
        Marginally -- the pipeline currently measures {speedup_pct:.2f}% SYPD at
        {mod_sypd:.5f} SYPD, above the noise floor but well short of what the
        radiation work has shown.
      "else": >-
        Not at the revision currently measured -- the pipeline reads
        {speedup_pct:.2f}% SYPD at {mod_sypd:.5f} SYPD, inside the run-to-run
        spread, so there is no effect to claim here.
    evidence:
      - kind: publication
        path: docs/whole-stack.md
        explanation: >-
          How the headline number decomposes, and which rows of the experiment index are cumulative.
      - kind: figure
        path: figures/sypd-time-series.png
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          The end-to-end number for whatever revision last ran the pipeline.
          Read the cumulative rows in experiments.csv as cumulative: no row
          after the first is that change's own effect.
      - kind: value
        path: results/summary.json
        key: mod.sypd
        name: mod_sypd
        explanation: Absolute throughput of the modified arm, for scale.
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          Top 20 GPU kernels by baseline cost for both arms. What the two arms
          actually were is recorded per run in results/treatment.json rather
          than here, so this description cannot go stale against the data.
  - question: >-
      Can the radiation kernels be made faster without changing results, and
      which change is responsible?
    answer: >-
      Yes -- a binary search replacing a linear scan in RRTMGP's aerosol-optics
      interpolation is worth +7.95% SYPD on its own and carries essentially all
      of the +8.70% measured with a 64-thread block change added, with model
      state bit-identical over 120 coupled steps.
    evidence:
      - kind: publication
        path: docs/learnings.md
        section: "4m"
        explanation: >-
          What the scan was, how it was found, and why ncu's source attribution understated it by about 4x.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: rrtmgp_pair_speedup_pct
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          +8.70% SYPD end to end for the pair. RRTMGP is the only package
          differing between arms. NOT templated into the answer: rendering reads
          the working tree, where results/summary.json holds a later run.
      - kind: table
        path: diffs/RRTMGP.jl.diff
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          The change itself, 69 lines across three files.
      - kind: table
        path: results/top-kernels.csv
        git_ref: exp/2026-09-12-rrtmgp-optics
        explanation: >-
          Per-kernel confirmation: longwave -27.0% and shortwave -26.4%.
          Longwave moving is the attribution, since the block-size change
          affects only shortwave.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: binary_search_speedup_pct
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          The isolation, with block size left at RRTMGP's default in both arms:
          +7.95% SYPD. The 0.75-point gap against the pair sits inside the
          repeat spread, so the block change is not part of the proposal.
      - kind: table
        path: results/top-kernels.csv
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          Same isolation per kernel: radiation -26.92%, against -26.66% with the
          block change added, so the search alone is marginally better.
      - kind: table
        path: diffs/RRTMGP.jl-authored.diff
        git_ref: meas/2026-09-13-binary-search-alone
        explanation: >-
          The proposed change in full: 30 lines in one function, as the branch's
          own delta since it diverged from RRTMGP main.
      - kind: value
        path: results/state-rad-mod.toml
        key: steps
        name: bit_identical_steps
        git_ref: meas/2026-09-12-rrtmgp-bit-identical
        explanation: >-
          Bit-identity, not an accuracy trade: 0 of 12 prognostic fields differ
          against results/state-rad-baseline.toml at every snapshot across these
          coupled steps.
  - question: >-
      Where does the AMIP simulation's GPU time actually go, and is the
      microphysics kernel the right thing to optimize?
    answer: >-
      No -- radiation is the largest block at about 44% of GPU kernel time
      against roughly 10% for the microphysics kernel this project targeted, and
      with host time outside the GPU timeline at {gap_frac_of_wall:.3%} of wall
      the run is densely GPU-bound, so kernel time is what there is to attack.
    evidence:
      - kind: publication
        path: docs/learnings.md
        section: "4k"
        explanation: >-
          The breakdown on the phase-independent window, and why occupancy is not radiation's lever either.
      - kind: value
        path: results/step-breakdown.toml
        key: gap_frac_of_wall
        name: gap_frac_of_wall
        explanation: >-
          Measured WITHOUT a profiler, using CUDA events. nsys cannot answer
          this: its own instrumentation dominates the idle measurement, and it
          reports MORE idle for the faster arm (docs/learnings.md 2b-i, 4f).
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          The per-kernel breakdown on the 120-step phase-independent window,
          which is LCM(20, 60, 120) of the periodic processes and so fires every
          scheme at its exact long-run share. The earlier 40-step window was
          shorter than the gravity-wave period and made microphysics look
          dominant.
  - question: >-
      What CI checks would catch a kernel this inefficient before it reaches
      main, and block it until it is fixed?
    hypothesis: >-
      A benchmark-and-threshold gate cannot work here, because full-AMIP SYPD
      noise is larger than the changes worth catching, so the gate has to be
      built on compile-time quantities instead.
    answer: >-
      Gate on per-kernel compile-time resource use -- registers per thread AND
      absolute local-memory bytes, from CUDA.registers and CUDA.memory, recorded
      as a checked-in baseline -- never on end-to-end timing, which at this
      project's noise floor can neither reward the changes worth making nor
      catch their inverse; designed but not yet implemented.
    evidence:
      - kind: publication
        path: docs/ci-kernel-gate.md
        explanation: >-
          The gate design and the three things a naive version of it would get wrong.
      - kind: value
        path: results/cm-registers.toml
        key: layers.E microphysics_tendencies_1m (9-pt quadrature).registers
        name: quad9_registers
        git_ref: exp/2026-09-04-fuse-and-bounds
        explanation: >-
          Why a register-only gate fails: this kernel reports the sm_80 cap of
          255 no matter how far over it is, so the count cannot distinguish
          "fine" from "catastrophic" nor show whether a fix helped. Pinned
          because the A-E broadcast layers are only produced when ClimaCore.jl-mod
          is on pb/launch-bounds, so the key is absent from the current file.
      - kind: value
        path: results/cm-registers.toml
        key: layers.E microphysics_tendencies_1m (9-pt quadrature).unbounded_local_bytes
        name: quad9_local_bytes
        git_ref: exp/2026-09-06-evaluator-param-args
        explanation: >-
          The quantity that actually moved while the register count sat still,
          and which was not recorded at all until 2026-09-06. This is why the
          gate must record absolute local-memory bytes, not just registers.
      - kind: table
        path: results/kernel-resources.csv
        git_ref: exp/2026-09-07-evaluator-repeat
        explanation: >-
          The per-kernel table a CI check would compare against a stored
          baseline. Pinned because the ncu stages that produce it are frozen, so
          on main it describes whichever revision last ran them.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          Why the gate cannot be a model benchmark: this is the end-to-end
          number, whose repeat spread is 0.43% at best and ~2% typically, while
          the kernel-level measurement repeats to 0.31%.
  - question: >-
      Which changes actually improve AMIP performance, by how much, and how do
      we know a result is real rather than run-to-run variation?
    answer: >-
      Two lines of work, and they are complements rather than alternatives --
      CloudMicrophysics register and fusion work removes work and creates
      register headroom, ClimaCore's occupancy targeting converts headroom it
      cannot create, so the pair beats the sum of its parts -- and four
      byte-identical null tests put run-to-run variation at a few tenths of a
      percent, which is what makes differences near 0.5% real.
    evidence:
      - kind: publication
        path: docs/learnings.md
        section: "3a-3c"
        explanation: >-
          The fusion result, its re-measurement on the updated stack, and why upstream baseline movement is not ours to claim.
      - kind: table
        path: experiments.csv
        explanation: >-
          Every recorded experiment, generated from exp/* git tags by
          scripts/build-experiment-index.py and read out of git at the tagged
          commit, so it cannot drift. THE reproducible COLUMN IS LOAD-BEARING: a
          run made against a dirty submodule tree measured code that exists
          nowhere afterwards, so the checkout recipe cannot reproduce it.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          The mod-vs-baseline delta at a given revision, which is the only thing
          this project can claim. Upstream baseline movement -- +4.36% from one
          dependency update -- belongs to whoever wrote the upstream PR and must
          never be added into a cumulative figure.
  - question: >-
      What actually limits the hot SGS-quadrature microphysics kernel, and which
      of the available levers can move it?
    answer: >-
      Register pressure rather than arithmetic or memory -- the kernel sits at
      the 255-register sm_80 cap while a full CloudMicrophysics evaluation
      compiles standalone to {linearized_avg_registers}, with docs/learnings.md
      2c carrying the physics-to-framework split -- and the lever that works is
      a __launch_bounds__ occupancy target rather than a hard register cap,
      guarded by a spill budget without which it is net negative: forcing the
      annotation onto the nine-point kernel takes it from {l1013_off_ms:.1f} to
      {l1013_unguarded_ms:.1f} ms, i.e. slower.
    evidence:
      - kind: publication
        path: docs/learnings.md
        section: "2c"
        explanation: >-
          Where the registers go, layer by layer, and why the physics-to-framework split must be read against its revision.
      - kind: value
        path: results/cm-registers.toml
        key: layers.LinearizedAverage nsub=2.registers
        name: linearized_avg_registers
        explanation: >-
          A full 1M CloudMicrophysics evaluation, compiled standalone with the
          parameter structs passed as kernel ARGUMENTS -- as const globals the
          compiler folds their fields and understates pressure enough to invert
          the conclusion, which it once did. Independent of substep count, so
          microphysics_n_substeps_quadrature costs time but not occupancy. This
          stage is cheap and not frozen, so it re-runs against whatever is
          checked out; read its revision before comparing.
      - kind: value
        path: results/kernel-population.json
        key: baseline.gpu_idle_pct
        name: gpu_idle_pct
        explanation: >-
          READ AS A PROFILING ARTIFACT, NOT A TARGET. The profiler's own tracing
          runs to ~33 CUDA API calls per launch and accounts for the bulk of
          this idle; the profiled window does not even run at the same rate as
          the real one. Kernel TIMES from nsys are device-side and trustworthy;
          the gaps between them are not. See docs/learnings.md 2b-i.
      - kind: value
        path: results/launch-bounds/launch-bounds.toml
        key: off.kernels.L1013.mean_ms
        name: l1013_off_ms
        git_ref: exp/2026-09-01-cm-fuse
        explanation: >-
          The reference every other phase is read against: the hot
          SGS-quadrature kernel with launch bounds disabled, which is what the
          baseline arm runs.
      - kind: value
        path: results/launch-bounds/launch-bounds.toml
        key: unguarded.kernels.L1013.mean_ms
        name: l1013_unguarded_ms
        git_ref: exp/2026-09-01-cm-fuse
        explanation: >-
          The counterfactual, and the reason this stage exists: with the spill
          budget loosened until the annotation is accepted, the kernel reaches
          12 warps/SM and gets SLOWER. A rejected configuration never appears in
          an ordinary profiling run.
      - kind: value
        path: results/launch-bounds/launch-bounds.toml
        key: guarded.kernels.L970.mean_ms
        name: l970_guarded_ms
        git_ref: exp/2026-09-01-cm-fuse
        explanation: >-
          The gain, in the shipped configuration: the single-call microphysics
          kernel annotated at 12 warps/SM for a small spill cost. The
          guarded.decisions array records, per kernel, what was accepted and why.
      - kind: table
        path: results/kernel-resources.csv
        git_ref: exp/2026-09-07-evaluator-repeat
        explanation: >-
          What establishes the kernel as register-limited rather than
          memory-limited. Pinned because the ncu stages are frozen; cited for
          the characterization of the baseline kernel, which has been stable
          across revisions, not as evidence for any treatment's effect.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: speedup_pct
        explanation: >-
          The pipeline-level number this kernel work has to show up in
          eventually. Kernel times are not SYPD, and this mechanism measured a
          SYPD null on its own.
  - question: >-
      Should the SGS quadrature order be reduced from 3 to 2, and what does that
      trade?
    answer: >-
      Recommended subject to science sign-off -- worth +6.14% SYPD on unmodified
      upstream code and +8.05% with this project's numerics work, against a
      field-wide cloud-ice tendency error of {order2_icl_rms_over_scale:.2%} of
      RMS with only about 1% of cells changing at all -- but the accuracy figure
      is the direct effect rather than the self-consistent one, and individual
      cells move far more than the field does.
    evidence:
      - kind: publication
        path: docs/sgs-quadrature.md
        explanation: >-
          The write-up for the science team, including the three caveats a reviewer must weigh.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: order2_isolated_speedup_pct
        git_ref: exp/2026-09-08-quadrature-order-2-isolated
        explanation: >-
          Standalone benefit on unmodified upstream code, with the quadrature
          order the only live difference between arms. NOT templated: rendering
          reads the working tree, where results/summary.json holds a later run.
      - kind: value
        path: results/summary.json
        key: speedup_pct
        name: order2_full_stack_speedup_pct
        git_ref: exp/2026-09-09-order2-full-stack
        explanation: >-
          Benefit with the numerics work also in place. Sub-additive against the
          two levers separately, because the numerics cut cost per quadrature
          point and the order cuts the number of points -- so the numerics work
          is not made redundant by this change.
      - kind: value
        path: results/quadrature-order-error.toml
        key: order_2.dq_icl_dt.rms_over_scale
        name: order2_icl_rms_over_scale
        git_ref: meas/2026-09-09-quadrature-order-accuracy
        explanation: >-
          The accuracy cost, measured on a real AMIP state with byte-identical
          inputs. The same file carries order_1 for the bracket and
          max_over_scale for the worst single cell; p99_over_scale is zero by
          construction and must not be read as an error estimate.
  - question: >-
      Is the nine-point SGS quadrature in the 1-moment microphysics earning the
      throughput it costs?
    answer: >-
      Unresolved, and it belongs to the science owners rather than to profiling
      -- the subgrid PDF sits a median of {mu_over_sigma_p50:.0f} standard
      deviations from the saturation kink the quadrature exists to resolve, with
      {clear_of_kink_10sigma_warp_frac:.2%} of warps entirely clear of it, so
      either the covariance closure is producing variances far smaller than
      intended or the quadrature is unnecessary at this resolution.
    evidence:
      - kind: publication
        path: docs/sgs-quadrature.md
        explanation: >-
          The write-up for the science team.
      - kind: publication
        path: docs/learnings.md
        section: "6a (How much work the SGS quadrature is actually doing)"
        explanation: >-
          The distribution, and why it survives the warp test.
      - kind: value
        path: results/sgs-degeneracy.toml
        key: mu_over_sigma_percentiles.p50
        name: mu_over_sigma_p50
        explanation: >-
          Median |mu_S| / sigma_S across all 1,548,288 cells. The same file
          carries p1, so even the worst percentile is clear of the kink.
      - kind: value
        path: results/sgs-degeneracy.toml
        key: criteria.clear_of_kink_10sigma.warp_frac
        name: clear_of_kink_10sigma_warp_frac
        explanation: >-
          The fraction of 32-cell groups in which EVERY cell is clear of the
          kink, which is what decides whether collapsing could pay on a GPU: a
          warp costs the maximum over its lanes, so a criterion true at
          scattered points saves nothing.
      - kind: table
        path: experiments.csv
        explanation: >-
          What the quadrature costs, measured and tagged rather than quoted:
          compare 2026-09-08-quadrature-order-1 against
          2026-09-07-evaluator-repeat, the same stack with the nine-point rule.
          A configuration-only change that alters results and was reverted -- an
          upper bound attached to the question, not a proposal.
  - question: >-
      How much of a GPU profiling job is compilation rather than computation,
      and can any caching strategy recover it between jobs?
    hypothesis: >-
      Most of a profiling job is compilation, and caching it between jobs --
      first GPUCompiler's on-disk kernel cache, then a PrecompileTools warmup
      package -- should recover a large part of it.
    answer: >-
      Compilation is {compile_share_pct}% of the job and it is host-side Julia
      JIT rather than GPU kernel compilation, so neither strategy recovered any
      of it: GPUCompiler's disk cache writes zero files in this stack, and the
      AMIPWarmup package made the job {warmup_penalty_pct}% slower, with the
      penalty landing inside the very phase it was built to speed up.
    evidence:
      - kind: publication
        path: docs/compile-time.md
        explanation: >-
          The measurement, both failed strategies, and the recipe for re-running the study at its tag.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_off.totals.wall_s
        name: warmup_off_wall_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          Status quo, and the reference the whole study rests on. Pinned to the
          only rev where this stage's inputs exist: the AMIPWarmup wiring was
          reverted immediately after the measurement, because keeping it would
          impose the measured penalty on every future profiling job. At that tag
          the stage is not frozen, so calkit run compile-time-study reproduces it.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_on.totals.wall_s
        name: warmup_on_wall_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          The test, in the same SLURM job on the same GPU, running second --
          the ordering that would flatter it if anything. Higher than
          warmup_off, which is the negative result.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_on.coupled_simulation.wall_s
        name: warmup_on_coupled_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          Where the penalty is: simulation construction, the phase AMIPWarmup
          targets, so the cost is not merely the price of loading a package.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_off.totals.host_compile_s
        name: warmup_off_host_compile_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          Host-side JIT only, from Julia's own @timed compile_time accounting.
          GPU kernel compilation is NOT counted here, since GPUCompiler runs
          outside it -- which is what rules out the whole class of
          GPU-kernel-caching fixes independently of the disk cache being broken.
      - kind: value
        path: results/compile-time/compile-time.toml
        key: warmup_off.second_step.wall_s
        name: warmup_off_second_step_s
        git_ref: compile-time-warmup-ab
        explanation: >-
          Steady-state cost of one step once everything is compiled -- the
          fraction of a second that the surrounding half hour exists to produce.
      - kind: value
        path: results/compile-time/doc-values.json
        key: warmup_off.compile_share_pct
        name: compile_share_pct
        explanation: >-
          Host-side JIT as a share of the whole job, derived from the pinned
          measurement above by the compile-time-doc stage. Unpinned on purpose:
          this is the file the write-up injects from, so the answer and
          docs/compile-time.md cannot disagree.
      - kind: value
        path: results/compile-time/doc-values.json
        key: penalty.wall_pct
        name: warmup_penalty_pct
        explanation: >-
          What AMIPWarmup cost, as a share of the job it was meant to speed up.
          The sign is the result: this was a negative result, not a null one.

tables:
  - path: results/top-kernels.csv
    title: Top 20 GPU kernels, baseline vs. mod
    description: >-
      Per-kernel Nsight Systems aggregates for the top 20 kernels ranked by
      baseline total time, covering both the baseline and modified runs:
      invocation counts, total and mean duration, share of total GPU time,
      registers per thread, and the percent change in total time.

  - path: results/kernel-resources.csv
    title: Per-kernel register, spill, and occupancy stats
    description: >-
      Nsight Compute resource metrics for the profiled microphysics kernels,
      baseline vs. mod: registers per thread, register spilling (requests and
      the share of memory traffic they cost), stack frame, and achieved vs.
      theoretical occupancy.

      This exists because the nsys table above cannot show the mechanism behind
      the headline speedup. The hot kernel can sit pinned at the 255-register
      cap in BOTH cases, so by the columns nsys collects nothing changed at all,
      while its total time falls by half. Registers at the cap is not the same
      thing as spilling, and nsys does not collect spill metrics -- only Nsight
      Compute does. Specific figures are deliberately left to the table rather
      than quoted here, so this description cannot go stale against the data it
      describes.

environments:
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_options:
      - --gpus=1
      - --time=120
  sassy:
    kind: system
    host: sassy.caltech.edu
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.13"

pipeline:
  stages:
    record-treatment:
      # Reports git state -- submodule SHAs, refs, whether a tree was dirty --
      # which DVC cannot see, because its declared inputs are file contents.
      # Committing a submodule changes no content, so the stage was skipped as
      # unchanged while the very thing it records had changed, and it kept
      # reporting a stale SHA and a dirty tree that was no longer dirty.
      # It is CPU-only and takes seconds, so it runs every time.
      always_run: true
      kind: python-script
      environment: py
      script_path: scripts/record-treatment.py
      # What actually ran, as opposed to what a commit message says ran. A
      # superproject commit pins every submodule SHA, but not whether a package
      # was dev'd into the AMIP environments (a submodule can be checked out and
      # irrelevant), nor whether a tree was dirty, nor which CLIMA_* variables
      # the stages exported. Each of those has changed the meaning of a result
      # in this project at least once.
      #
      # Depends on diffs/ rather than the submodules directly, so it re-runs
      # after make-diffs has observed the same state, and cannot disagree with
      # the archived diff.
      inputs:
        - from_stage_outputs: make-diffs
        - calkit.yaml
      outputs:
        - path: results/treatment.json
          storage: git
    make-diffs:
      kind: shell-script
      environment: _system
      script_path: scripts/make-diffs.sh
      inputs:
        - ClimaCoupler.jl
        - ClimaCoupler.jl-mod
        - ClimaCore.jl
        - ClimaCore.jl-mod
        - ClimaAtmos.jl
        - ClimaAtmos.jl-mod
        - CloudMicrophysics.jl-mod
        - RRTMGP.jl
        - RRTMGP.jl-mod
      outputs:
        - path: diffs
          storage: git
    baseline-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/baseline
        - ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/nsys/baseline.nsys-rep
        - results/nsys/baseline.sqlite
    mod-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/nsys/mod
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
        - ClimaAtmos.jl-mod/config
      outputs:
        - results/nsys/mod.nsys-rep
        - results/nsys/mod.sqlite
    baseline-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
      # describes.
      # FROZEN 2026-09-03, both together and at the same revision. They cost
      # ~1.5 h each, more than half the pipeline's cluster time. Unfreeze BOTH
      # or NEITHER: they were previously frozen independently and last ran three
      # days apart (baseline 2026-08-20, a null test; mod 2026-08-23, the
      # clear-air early-out), so results/kernel-resources.csv presented two
      # unrelated runs as one comparison. See "Freeze and unfreeze the two ncu
      # stages together" in AGENTS.md.
      frozen: true    # refreshed 2026-09-05 against the 128-register kernel; both re-frozen together
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      args:
        - results/ncu/baseline
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the baseline tree. It
        # also matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl/experiments/AMIP
        - --config
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/ncu/baseline.ncu-rep
        - path: results/ncu/baseline-details.csv
          storage: git
          delete_before_run: true
    mod-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
      # describes.
      # FROZEN 2026-09-03, both together and at the same revision. They cost
      # ~1.5 h each, more than half the pipeline's cluster time. Unfreeze BOTH
      # or NEITHER: they were previously frozen independently and last ran three
      # days apart (baseline 2026-08-20, a null test; mod 2026-08-23, the
      # clear-air early-out), so results/kernel-resources.csv presented two
      # unrelated runs as one comparison. See "Freeze and unfreeze the two ncu
      # stages together" in AGENTS.md.
      frozen: true    # refreshed 2026-09-05 against the 128-register kernel; both re-frozen together
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/ncu/mod
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the mod tree. It also
        # matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_mod_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl-mod/experiments/AMIP
        - --config
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
      outputs:
        - results/ncu/mod.ncu-rep
        - path: results/ncu/mod-details.csv
          storage: git
          delete_before_run: true
    amip-baseline:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      args:
        - --project=ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - --config_file
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --job_id
        - gpu_amip_progedmf_1M_land_he16_baseline
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
        - ClimaAtmos.jl/toml
    amip-mod:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/experiments/AMIP/run_simulation.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --job_id
        - gpu_amip_progedmf_1M_land_he16_mod
      inputs:
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - ClimaCoupler.jl-mod/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
        - ClimaAtmos.jl-mod/toml
        - ClimaAtmos.jl-mod/config
    summarize:
      kind: python-script
      environment: py
      script_path: scripts/summarize.py
      inputs:
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: results/summary.json
          storage: git
    compare-kernels:
      kind: jupyter-notebook
      notebook_path: notebooks/compare-kernels.ipynb
      environment: py
      inputs:
        - from_stage_outputs: baseline-nsys
        - from_stage_outputs: mod-nsys
      outputs:
        - path: results/top-kernels.csv
          storage: git
      html_storage: git
      executed_ipynb_storage: git
    export-kernel-resources:
      kind: python-script
      environment: py
      script_path: scripts/export-kernel-resources.py
      # Reads the CSVs Nsight Compute already exported, so this needs no GPU and
      # is not frozen alongside the ncu stages that produce them.
      inputs:
        - from_stage_outputs: baseline-ncu
        - from_stage_outputs: mod-ncu
      outputs:
        - path: results/kernel-resources.csv
          storage: git
    earlyout-hits:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      scheduler:
        options:
          - --gpus=1
          - --time=60
      args:
        - --project=ClimaCoupler.jl/experiments/AMIP
        - scripts/measure-earlyout-hits.jl
        - --config_file
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --out
        - results/earlyout-hits.toml
      inputs:
        - scripts/measure-earlyout-hits.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaAtmos.jl/src
      outputs:
        - path: results/earlyout-hits.toml
          storage: git
    compile-time-doc:
      kind: markdown
      target_path: docs/compile-time.md
      environment: py
      # Live on main, unlike the experiment documents. Its only input is the
      # committed results/compile-time/compile-time.toml, which the frozen
      # compile-time-study stage does not regenerate here, so re-running this
      # cannot restate the experiment against a different run.
    launch-cost:
      kind: markdown
      target_path: docs/experiments/launch-cost.md
      environment: py
      # Frozen on main, live at meas/2026-09-19-launch-cost, following
      # compile-time-study and launch-overhead-doc. The 2026-09-21 submodule
      # update moved the whole stack, which makes both nsys stages this
      # document declares stale. Re-running them here would re-profile for
      # hours and then restate the experiment against a different stack --
      # and because a templated value renders from the WORKING TREE rather
      # than from its git_ref, the fusion-ceiling answers would quietly start
      # displaying the new numbers while their evidence still checked against
      # the tag. Re-measure by tagging a new experiment, not by re-running
      # this one.
      frozen: true
    launch-overhead-doc:
      kind: markdown
      target_path: docs/experiments/launch-overhead.md
      environment: py
      # Frozen on main, unfrozen at meas/2026-09-17-launch-overhead, following
      # compile-time-study. results/nsys/baseline.sqlite holds whatever profiled
      # last, so leaving this live would regenerate the write-up against a
      # different run and silently restate the experiment. The probe half is
      # already immune -- it reads the committed results/launch-probe.json
      # rather than the transient mod profile -- but the baseline half is not.
      frozen: true
    sgs-degeneracy:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # Builds the coupled simulation, takes three steps to settle, then reads
      # the SGS covariances off the state. Answers whether the nine-point
      # quadrature is doing work -- |mu_S| against σ_S -- and whether it
      # clusters into whole warps, which is what decides if collapsing it could
      # pay. See docs/learnings.md 6a. The measurement takes minutes but setup
      # and JIT do not: after the 2026-09-21 update a 60-minute limit expired
      # before the first step.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/measure-sgs-degeneracy.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --out
        - results/sgs-degeneracy.toml
      inputs:
        - scripts/measure-sgs-degeneracy.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaAtmos.jl-mod/src
        - CloudMicrophysics.jl-mod/src
      outputs:
        # Small TOML answering the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/sgs-degeneracy.toml
          storage: git

    radiation-ncu:
      kind: shell-script
      environment: clima
      # Radiation is 43.9% of GPU kernel time -- four rte_*_2stream kernels at
      # 255 registers and 12.5% occupancy with zero spill (docs/learnings.md 4k).
      # Occupancy targeting was tried and rejected (+3.93%), so the next step is
      # to see what actually limits them rather than guess again: the
      # microphysics work went wrong repeatedly when it targeted from stale or
      # absent profile data.
      #
      # ONE ARM ONLY, deliberately. This is diagnosis, not comparison, so the
      # freeze-both-together rule for baseline-ncu/mod-ncu does not apply -- and
      # it must not be turned into a comparison later without adding a mod-side
      # sibling and running them as a pair.
      #
      # Radiation fires every 20 steps, so the four kernels launch 6 times each
      # across the 120-step window. Skip 2 to clear first-call effects, take 2.
      script_path: scripts/run-ncu.sh
      scheduler:
        options:
          - --gpus=1
          - --time=180
      args:
        - results/ncu/radiation
        - --kernel-name
        # No parentheses: calkit passes stage args through a shell unquoted, so
        # `(lw|sw)` is a syntax error and the job dies before producing a log.
        # `.` matches the l/s and keeps the pattern shell-safe -- the same reason
        # the microphysics stages use only bracket classes.
        - 'regex:rte_.w_2stream_solve_CUDA'
        - --project
        - ClimaCoupler.jl/experiments/AMIP
        - --config
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - '2'
        - --launch-count
        - '2'
      inputs:
        - scripts/run-ncu.sh
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaAtmos.jl/src
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
      outputs:
        - results/ncu/radiation.ncu-rep
        - path: results/ncu/radiation-details.csv
          storage: git

    step-breakdown:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # How much of a coupler step is GPU work, measured WITHOUT a profiler.
      # nsys cannot answer this: docs/learnings.md 2b-i showed its own
      # instrumentation dominates the idle measurement here, and the profiled mod
      # arm reports MORE idle than baseline while being faster in SYPD. This uses
      # CUDA events instead -- two records per ~277 ms step -- and reports wall,
      # GPU span, and the gap between them. gpu_span includes inter-kernel gaps,
      # so it bounds GPU busy from above and the gap is a LOWER bound on host
      # time outside the GPU timeline.
      #
      # Must run through this wrapper, not a bare srun: without `module load
      # climacommon` Julia picks up system CUDA libraries and a step takes 118 s
      # instead of 277 ms, which is how the first attempt at this measurement was
      # wasted.
      scheduler:
        options:
          - --gpus=1
          - --time=90
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/measure-step-breakdown.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        # 2880 steps = one simulated day. The 40-step benchmark window fires
        # radiation (20 steps) but NEVER fires either gravity-wave scheme (60),
        # the cloud-fraction update (120), or the hourly diagnostics write (120).
        # One day covers all of those many times over, and the daily ocean and
        # sea-ice diagnostics once. Only the monthly and 30-day work stays out of
        # reach. At ~150 ms/step this is ~7 minutes of stepping.
        - --steps
        - '2880'
        - --t_end
        - 90000secs
        - --out
        - results/step-breakdown.toml
      inputs:
        - scripts/measure-step-breakdown.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaAtmos.jl-mod/src
        - CloudMicrophysics.jl-mod/src
      outputs:
        - path: results/step-breakdown.toml
          storage: git

    cm-registers:
      kind: shell-script
      environment: clima
      script_path: scripts/run-cm-registers.sh
      # Minutes, not an hour: compiles kernels and reads register counts rather
      # than running a simulation. Answers where the hot kernel's registers go,
      # in two halves -- the CloudMicrophysics evaluation on its own, and the
      # ClimaCore broadcast layers it runs inside.
      #
      # NOT FROZEN, BUT ONLY HALF OF IT ALWAYS RUNS. The broadcast layers are
      # read out of `ClimaCoreCUDAExt.LAUNCH_BOUNDS_CACHE`, which exists only on
      # ClimaCore.jl-mod branch `pb/launch-bounds` (PR 2601). With any other
      # ClimaCore checked out, measure-cm-registers.jl logs "ClimaCore lacks the
      # launch-bounds record; skipping the broadcast layers" and emits the
      # CloudMicrophysics layers alone -- a partial file, not a failed one. So
      # the framework half of the 163/68 decomposition is reproducible only with
      # that branch checked out, and a run without it silently drops the layers
      # rather than erroring. Check for the A-D keys before reading a comparison
      # out of this file, and see the revision caveat on the Q3 evidence entry.
      scheduler:
        options:
          - --gpus=1
          - --time=40
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
      inputs:
        - scripts/measure-cm-registers.jl
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
        - ClimaCore.jl-mod/ext
      outputs:
        - path: results/cm-registers.toml
          storage: git

    kernel-population:
      kind: python-script
      environment: py
      script_path: scripts/analyze-kernel-population.py
      # Cheap: reads the nsys SQLite exports on the login node, no GPU. Answers
      # the questions the per-kernel tables cannot -- how many kernels there are,
      # how much of the time the GPU is idle, and how much work sits in kernels
      # too small to be worth launching.
      inputs:
        - scripts/analyze-kernel-population.py
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
      outputs:
        - path: results/kernel-population.json
          storage: git

    launch-bounds-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-launch-bounds-study.sh
      # Frozen: this stage answered its question and cannot re-run here. It
      # measures ClimaCore's `__launch_bounds__` occupancy targeting, which
      # exists only on ClimaCore.jl-mod branch `pb/launch-bounds` (PR 2601,
      # commits 5428c6e2c and 45bf1792c). That branch is not checked out --
      # both ClimaCore arms currently sit at upstream main -- so
      # measure-launch-bounds.jl dies at its first reference to
      # `CUDAExt.LAUNCH_BOUNDS_TARGET_WARPS_PER_SM[]`, before it builds a
      # CoupledSimulation. The recorded TOML is not at risk (the write is far
      # downstream of that failure), but each of the three phases burns a GPU
      # on a shared node to fail the same way, which is what this flag prevents.
      #
      # To re-evaluate, check out the tag where the inputs exist:
      #   git checkout exp/2026-08-24-launch-bounds
      #   git submodule update --init --recursive
      #   calkit run launch-bounds-study
      # That tag pins ClimaCore.jl-mod at 45bf1792c. At the tag the stage is
      # not frozen and runs normally, which is what makes the recipe work.
      #
      # Unfreeze on this rev only after re-pointing ClimaCore.jl-mod at
      # `pb/launch-bounds` AND re-dev'ing it (see scripts/dev-local-repos-coupler.sh
      # -- a submodule can be checked out without reaching the run).
      frozen: true
      # Three full setup+JIT phases in one job, so the clima environment's
      # default 120 min is not enough. `env_default_options` defaults to
      # `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/launch-bounds/launch-bounds.toml
      inputs:
        - scripts/measure-launch-bounds.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # The mod arm devs CloudMicrophysics.jl-mod (see the manifest and
        # scripts/dev-local-repos-coupler.sh), so a CM-only treatment is invisible
        # to DVC without this and the stage silently reuses a cached result.
        - CloudMicrophysics.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/launch-bounds/launch-bounds.toml
          storage: git

    compile-time-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-compile-study.sh
      # Frozen: this stage answered its question and must not re-run here. Its
      # warmup arm needs AMIPWarmup dev'd into the AMIP environments, which
      # exists only at tag compile-time-warmup-ab -- the wiring cost a measured
      # 5.1% and was reverted. Re-running on this rev would produce a warmup arm
      # with no warmup, i.e. two identical arms overwriting the evidence with a
      # result that looks like a measurement. (measure-compile-time.jl also
      # fails hard in that case; this keeps `calkit run` from reaching it.)
      # To re-evaluate, check out the tag and run it there.
      frozen: true
      # Two full setup+JIT phases in one job (~32 min each), so the default 120
      # min from the clima environment is not enough. `env_default_options`
      # defaults to `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/compile-time/compile-time.toml
      inputs:
        - scripts/measure-compile-time.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/compile-time/compile-time.toml
          storage: git
    build-experiment-index:
      kind: python-script
      environment: py
      script_path: scripts/build-experiment-index.py
      # Generated rather than hand-maintained, so the index cannot drift from
      # what was recorded: every row is read out of git at its `exp/*` tag.
      #
      # Depends on results/summary.json because that is what changes when a new
      # experiment is produced. Git tags are not files, so DVC cannot watch them
      # directly -- which is also why an experiment's own row appears only after
      # the tag is created and this stage is re-run.
      inputs:
        - results/summary.json
      outputs:
        - path: experiments.md
          storage: git
        - path: experiments.csv
          storage: git
    analyze-logs:
      kind: jupyter-notebook
      notebook_path: notebooks/analyze-logs.ipynb
      environment: py
      inputs:
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: figures/sypd-time-series.png
          storage: git
      html_storage: git
      executed_ipynb_storage: git

showcase:
  - notebook: notebooks/analyze-logs.ipynb
