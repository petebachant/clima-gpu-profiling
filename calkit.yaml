owner: petebachant
name: clima-gpu-profiling
title: CliMA GPU profiling
description: Profiling GPU performance for CliMA.
git_repo_url: https://github.com/petebachant/clima-gpu-profiling

questions:
  # Answers are one sentence pointing at reproducible evidence; the reasoning
  # lives in docs/. Numbers are templated from value evidence by name rather
  # than typed -- but ONLY where the cited file is the same artifact in the
  # working tree as at the pin, because rendering reads the working tree and
  # ignores git_ref. A pinned citation of a regenerated artifact such as
  # results/summary.json must therefore NOT be templated: it would render
  # whichever run wrote that file last. Those figures stay typed and pinned.
  - question: >-
      How much of a GPU kernel-time saving actually reaches SYPD?
    answer: >-
      It depends on where the saving is, and the difference is large enough to change what is worth doing: radiation work converts at {radiation_mean:.0f}% ({radiation_min:.0f}-{radiation_max:.0f}% over {radiation_n} experiments), microphysics work at {microphysics_mean:.0f}% ({microphysics_min:.0f}-{microphysics_max:.0f}% over {microphysics_n}).
      But subsystem is the wrong label for the split, and the parameter fold is what shows it: it is microphysics work that converted at {microphysics_max:.0f}%, inside the radiation range and nowhere near the {microphysics_min:.0f}% the two fusion experiments gave.
      The two measurements of it are the third and fourth microphysics points, and between them they widened that band from a cluster to a spread, which is the signal that the band was never measuring a subsystem.
      What it was measuring is kernel shape. The rule of thumb this project carried for months -- about a third of a kernel-time saving shows up end to end -- came from two experiments whose savings were spread over the hundreds of launches per step that the linearization and microphysics-cache paths each make, where whatever else is in flight can absorb them.
      The fold's saving is not: it is concentrated in one kernel that runs {fold_quad_launches:.0f} times averaging {fold_quad_mean_ms:.0f} ms, a few long dense launches with nothing to overlap against, which is exactly the shape every radiation treatment had.
      So the earlier hypothesis here -- that radiation converts better because it is a few long kernels rather than one of thousands -- is no longer just plausible; this is a test of it that did not have to come out this way, on a treatment in the subsystem that was supposed to convert badly.
      Both halves of every ratio are read out of the tag that recorded them: kernel time from the profiled nsys stages, SYPD from the unprofiled AMIP ones, which is the only number that answers "is the model faster".
      Two cautions. {microphysics_n} and {radiation_n} experiments are not many, and the ratios are quotients of two measured quantities, so the +-2% SYPD noise floor propagates into them -- read them as bands rather than to the point.
      The microphysics mean in particular is now an average over two kernel shapes rather than a description of one, which is exactly the reading this answer argues against; the {microphysics_min:.0f}% and {microphysics_max:.0f}% ends of it are the figures that mean something.
      And `pass_through_pct` divides the per-step walltime fraction by the kernel-time change, not the SYPD gain by it; the two differ by about three points at these magnitudes, so a figure computed the other way does not belong beside these.
    evidence:
      - kind: result
        path: results/pass-through.json
        values:
          radiation_mean: by_subsystem.radiation.mean_pct
          radiation_min: by_subsystem.radiation.min_pct
          radiation_max: by_subsystem.radiation.max_pct
          radiation_n: by_subsystem.radiation.n
          microphysics_mean: by_subsystem.microphysics.mean_pct
          microphysics_min: by_subsystem.microphysics.min_pct
          microphysics_max: by_subsystem.microphysics.max_pct
          microphysics_n: by_subsystem.microphysics.n
        explanation: >-
          Both subsystems' conversion ratios, as mean, range and sample count.
          Each ratio is an end-to-end SYPD gain divided by the GPU kernel-time
          reduction that produced it, and the pass-through stage reads both
          halves out of the experiment tags with git show rather than from the
          working tree. The microphysics mean is where the "about a third" rule
          came from; radiation converts at roughly twice that.
      - kind: result
        path: results/fold-record/param-fold.json
        values:
          fold_quad_launches: kernels.microphysics_quadrature.baseline.launches
          fold_quad_mean_ms: kernels.microphysics_quadrature.baseline.mean_ms
        explanation: >-
          The shape of the kernel the fold saved its time in, which is what the
          reframing rests on. A few long dense launches behave like radiation;
          thousands of small ones per step behave like the two fusion
          experiments. The figures are the baseline arm's, i.e. the kernel
          without the fold -- which is no longer a stack anyone can run, since
          ClimaAtmos main now carries the fold, so they are read out of the
          snapshot of the measurement's tag rather than the live file.
      - kind: table
        path: experiments.csv
        explanation: >-
          The experiments themselves, each reproducible from its tag. The
          pass-through stage reads both halves of every ratio out of those
          tags with git show rather than from the working tree.
  - question: >-
      Does putting the parameters in `Val` make pointwise kernels measurably faster across the board, as CliMA/ClimaCore.jl#2676 asks?
    answer: >-
      Not across the board, and the bound is measured rather than argued: {mileage_ceiling:.2f}% of device time sits in kernels where a register saving could raise occupancy at all, {mileage_treated:.2f}% of that is the kernels this project has already folded, and what is left for anyone applying the pattern somewhere new is {mileage_untreated:.2f}% spread over {mileage_untreated_n:.0f} kernels.
      Where it does bite it is large, so the useful form of the answer is which kernels and why.
      Four kernels in ClimaAtmos have the fold, measured in the model rather than in isolation, and three of them cross an occupancy step: the SGS quadrature goes {fold_quad_regs_baseline:.0f} -> {fold_quad_regs_mod:.0f} registers, {fold_quad_warps_baseline:.0f} -> {fold_quad_warps_mod:.0f} warps per SM, {fold_quad_change:.1f}% on the kernel; the updraft path {fold_upd_regs_baseline:.0f} -> {fold_upd_regs_mod:.0f} registers, {fold_upd_warps_baseline:.0f} -> {fold_upd_warps_mod:.0f} warps, {fold_upd_change:.1f}%; the cloud-fraction kernel {fold_cf_regs_baseline:.0f} -> {fold_cf_regs_mod:.0f}, {fold_cf_warps_baseline:.0f} -> {fold_cf_warps_mod:.0f} warps, {fold_cf_change:.1f}%.
      Crossing a step is necessary and not sufficient, and the cloud-fraction kernel is the demonstration: it crosses and returns {fold_cf_change:.1f}%, because {fold_cf_ms:.1f} ms of a {fold_dev_ms:.0f} ms device total has nothing in it to return.
      The SGS-moments kernel is the control the other three need: the fold was applied to it the same way, it sheds {fold_sgs_regs_saved:.0f} registers, it stays at {fold_sgs_warps_mod:.0f} warps where the next step would need {fold_sgs_next_step:.0f}, and its {fold_sgs_change:.1f}% is noise rather than a payoff.
      So there are two gates rather than one -- distance to the next occupancy step, and share of the device -- and both can be computed before any code is written, since ClimaCore sizes the launch block from the register count and warps per SM follow from the pair.
      Register count predicts neither gate: the quadrature kernel starts at the {fold_quad_regs_baseline:.0f}-register cap and crosses, a {fold_cf_regs_baseline:.0f}-register one crosses as well, and the largest untreated candidate in the whole population is a {mileage_largest_pct:.2f}% ClimaCore broadcast kernel that would cross by shedding {mileage_largest_shed:.0f} registers and carries no parameter struct to fold in the first place.
      Across the four kernels the fold is worth {fold_own_change:.2f}% of their own time, {fold_total_saved:.0f} ms on a 120-step window, {fold_total_change:.2f}% of the whole device -- and the quadrature kernel is most of that.
      That subtotal and the whole-arm device saving now agree, {fold_total_saved:.0f} ms against {fold_dev_saved:.0f} ms, which is the arms differing by the fold and nothing else; earlier passes had a second treatment in the mod arm and the two figures could not be read as one.
      One caution on durability: the same fold on the same kernels measured {fold_upd_prior_change:.1f}% on the updraft path and {fold_cf_prior_change:.1f}% on the cloud-fraction kernel one stack earlier, against {fold_upd_change:.1f}% and {fold_cf_change:.1f}% here, because the upstream rewrites in between changed the kernel bodies.
      A payoff is a property of the body as it currently stands, not of the pattern.
      The mechanism is settled: Val folds an isbits parameter set to literals and lands on the const-global register count exactly, taking an isolated microphysics evaluation body from {val_args:.0f} registers to {val_val:.0f}, {arg_warps:.0f} to {val_warps:.0f} warps per SM.
      What defeats people applying it is the struct field boundary rather than inlining: an evaluator holding the parameters as FIELDS boxes the constant and reads it back per point, {eval_field_regs:.0f} registers and {eval_field_spill:.0f} bytes of spill against {eval_type_regs:.0f} and {eval_type_spill:.0f} for the same body with the parameters in the type.
      That boundary is also why `Val` applied naively to the quadrature body buys nothing: unwrapped and stored it stays at {quad_val:.0f} registers and {quad_val_spill:.0f} bytes of spill, indistinguishable from runtime arguments ({quad_args:.0f} and {quad_spill:.0f}) and from compile-time const globals ({quad_const:.0f}), while carried through still wrapped it drops to {quad_val_carried:.0f} registers and {quad_val_carried_spill:.0f} bytes.
      And it settles how much further this can be pushed on the one kernel big enough to matter: in the model that kernel now sits at {fold_quad_regs_mod:.0f} registers and needs {fold_quad_next_step:.0f} for a second block per SM, while the fully folded body floors at {quad_val_carried:.0f} in isolation with nothing else in it, so there is no second step to buy there by folding harder.
      The population says the same thing by counting rather than timing: of {kernels:.0f} kernels profiled, {addressable:.0f} ({addressable_pct}%) are capped by registers alone AND below full occupancy, while {at_full_occupancy:.0f} are already at full occupancy and can gain nothing however well their parameters fold.
      Read the {mileage_ceiling:.2f}% as a lower bound on the ceiling rather than the ceiling itself: the ncu population covers {mileage_matched:.1f}% of device time, so kernels it did not reach could add to it.
    evidence:
      - kind: result
        path: results/val-mileage.json
        values:
          mileage_ceiling: ceiling_pct_of_device
          mileage_treated: treated_pct_of_device
          mileage_untreated: untreated_pct_of_device
          mileage_untreated_n: untreated_kernels
          mileage_largest_pct: largest_untreated_pct_of_device
          mileage_largest_shed: largest_untreated_registers_to_shed
          mileage_matched: matched_pct_of_device
        explanation: >-
          The question asked in units of time rather than kernels, which is what
          SYPD is made of: a hundred addressable kernels holding 2% of the device
          are worth less than one unaddressable kernel holding 20%. Expense comes
          from the nsys profile, which times every kernel in the window;
          addressability from the ncu static pass, which records each kernel's
          occupancy limiter. The join is keyed on name, registers AND block size,
          because one kernel name covers several compiled specializations --
          keying on name alone collapsed the ClimaCore broadcast kernel's 42
          variants into one row and produced a ceiling more than twice this.
          It is an upper bound and nothing more: being addressable means a
          register saving COULD buy a block per SM, not that folding parameters
          sheds enough registers or that a block per SM is worth anything.
      - kind: result
        path: results/val-params-registers.toml
        values:
          val_args: runtime_arguments.registers
          val_val: val_type_parameters.registers
          arg_warps: runtime_arguments.warps_per_sm
          val_warps: val_type_parameters.warps_per_sm
          quad_args: quad_runtime_arguments.registers
          quad_val: quad_val_type_parameters.registers
          quad_spill: quad_runtime_arguments.local_bytes
          quad_val_spill: quad_val_type_parameters.local_bytes
          quad_const: quad_const_globals.registers
          quad_val_carried: quad_val_carried_in.registers
          quad_val_carried_spill: quad_val_carried_in.local_bytes
          eval_field_regs: evaluator_params_as_fields.registers
          eval_field_spill: evaluator_params_as_fields.local_bytes
          eval_type_regs: evaluator_params_in_type.registers
          eval_type_spill: evaluator_params_in_type.local_bytes
        explanation: >-
          One microphysics body compiled several ways -- parameters as runtime
          arguments, as const globals, and folded through Val -- for an isolated
          evaluation and for the quadrature path the model calls. The const-global
          column is the target, so Val matching it is the mechanism working rather
          than a coincidence. The two quadrature Val columns are the ones to read
          together: they look almost identical and measure opposite things, one
          unwrapping the parameters and storing them, the other keeping them
          wrapped across the struct boundary. Compile-only with
          `CUDA.@cuda launch=false`, so nothing executes, and standalone, so it
          needs no coupled simulation: the stage is minutes.
      - kind: result
        path: results/pointwise-registers.json
        values:
          kernels: kernels
          addressable: addressable
          addressable_pct: addressable_pct
          at_full_occupancy: at_full_occupancy
        explanation: >-
          The population the question asks about, measured rather than
          extrapolated: for every kernel in a 120-step run, its registers and
          which of the four occupancy limits binds. Static launch metrics only,
          so ncu needs no kernel replay and the whole population costs one job
          instead of the ninety minutes per six kernels that the frozen --set
          full stages cost. results/pointwise-registers.csv has the per-kernel
          rows behind it, including which kernels sit at the cap.
      - kind: result
        path: results/fold-record/param-fold.json
        values:
          fold_quad_regs_baseline: kernels.microphysics_quadrature.baseline.registers
          fold_quad_regs_mod: kernels.microphysics_quadrature.mod.registers
          fold_quad_warps_baseline: kernels.microphysics_quadrature.baseline.warps_per_sm
          fold_quad_warps_mod: kernels.microphysics_quadrature.mod.warps_per_sm
          fold_quad_next_step: kernels.microphysics_quadrature.mod.registers_for_next_step
          fold_quad_change: kernels.microphysics_quadrature.mean_change_pct
          fold_upd_regs_baseline: kernels.microphysics_updraft.baseline.registers
          fold_upd_regs_mod: kernels.microphysics_updraft.mod.registers
          fold_upd_warps_baseline: kernels.microphysics_updraft.baseline.warps_per_sm
          fold_upd_warps_mod: kernels.microphysics_updraft.mod.warps_per_sm
          fold_upd_change: kernels.microphysics_updraft.mean_change_pct
          fold_upd_prior_change: vs_prior_stack.kernels.microphysics_updraft.prior_change_pct
          fold_cf_regs_baseline: kernels.cloud_fraction.baseline.registers
          fold_cf_regs_mod: kernels.cloud_fraction.mod.registers
          fold_cf_warps_baseline: kernels.cloud_fraction.baseline.warps_per_sm
          fold_cf_warps_mod: kernels.cloud_fraction.mod.warps_per_sm
          fold_cf_change: kernels.cloud_fraction.mean_change_pct
          fold_cf_prior_change: vs_prior_stack.kernels.cloud_fraction.prior_change_pct
          fold_cf_ms: kernels.cloud_fraction.baseline.total_ms
          fold_sgs_warps_mod: kernels.sgs_moments.mod.warps_per_sm
          fold_sgs_change: kernels.sgs_moments.mean_change_pct
          fold_sgs_regs_saved: kernels.sgs_moments.registers_saved
          fold_sgs_next_step: kernels.sgs_moments.mod.registers_for_next_step
          fold_dev_ms: device_total.baseline_ms
          fold_dev_saved: device_total.ms_saved
          fold_total_change: fold_attributable.pct_of_device_total
          fold_total_saved: fold_attributable.ms_saved
          fold_own_change: fold_attributable.change_pct
        explanation: >-
          The four kernels the pattern was applied to, as the profiled runs
          compiled them: registers per thread, the block size ClimaCore chose
          from them, the warps per SM the pair allows, and the time. This is what
          makes the answer an in-model result rather than a compile-only one --
          and the SGS-moments row is the control the other three need, since it
          had the fold applied the same way and did not cross a step. Read from
          the nsys databases rather than results/top-kernels.csv, which averages
          over a kernel name that here covers two kernels at different register
          counts. The subtotal over these four kernels and the whole-arm device
          total now agree, because the arms differ by the fold and nothing else;
          the earlier run of this stage had to warn that they did not. Read out
          of results/fold-record/, a verbatim copy of the measurement's tag that
          scripts/snapshot-tag-records.py re-makes on every pass, since
          ClimaAtmos main now carries the fold and the live file describes a null
          test.
      - kind: value
        path: results/cm-registers.toml
        key: layers.LinearizedAverage nsub=2.registers
        explanation: >-
          Why a layer compiled on its own misleads: it has room for a payload
          saving to appear in its register count, where the broadcast the model
          runs is split into several smaller kernels whose limits differ. Any
          register experiment answers for the body it compiles.

  - question: >-
      Is it worth spreading the `Val(params)` pattern into Thermodynamics and CloudMicrophysics, as CliMA/ClimaCore.jl#2694 asks?
    answer: >-
      No, on the evidence so far, and the reason is that the pattern has already collected what there is to collect from the caller's side.
      CloudMicrophysics is settled by measurement rather than argument: wrapping the parameters at the ClimaAtmos call site takes the isolated microphysics body from {val_args:.0f} registers to {val_val:.0f}, which is exactly the {val_const:.0f} a compile-time const global reaches.
      Const globals are the ceiling of any constant-folding scheme, so no change inside CloudMicrophysics can beat what ClimaAtmos already gets by wrapping on its own side.
      That matters practically as well as logically, because neither arm of this project devs CloudMicrophysics and a CM release is the slowest path available.
      On the path the model actually runs, const globals buy nothing at all: the quadrature body compiles to {quad_args:.0f} registers with the parameters as runtime arguments and {quad_const:.0f} as const globals.
      Whatever pins that kernel at the register cap, it is not the cost of getting parameters into it, so a deeper fold has no target there either.
      The device budget bounds whatever is left. Of the {mileage_ceiling:.2f}% of device time where cheaper registers could raise occupancy at all, {mileage_treated:.2f}% is the kernels already folded, leaving {mileage_untreated:.2f}% over {mileage_untreated_n:.0f} kernels -- and the largest single piece of that, {mileage_largest_pct:.2f}% of the device, is a ClimaCore broadcast kernel with no parameter struct in it to fold.
      So there is no kernel left that is both large enough to matter and shaped so that pushing the pattern into a dependency would reach it.
      Thermodynamics was the half not yet measured, and the prediction was recorded before the run rather than after: at the pinned v1.3.0 both `q_vap_saturation` methods the folded kernels call are `@inline` and forward the parameter set straight down, so Thermodynamics has no struct field boundary of the kind that erased the fold inside ClimaAtmos's own evaluator, and const globals saving registers on that call would have falsified this answer.
      It held, and more cleanly than predicted. The call compiles to {td_args:.0f} registers with the parameter set as a runtime argument, {td_const:.0f} as a const global and {td_val:.0f} through `Val` -- the same number three times, so its {td_bytes:.0f}-byte parameter struct costs nothing to pass however it is passed.
      The prediction was that folding would not pay there; the measurement says the call never paid for its parameters in the first place, which closes the question rather than bounding it.
    evidence:
      - kind: result
        path: results/val-params-registers.toml
        values:
          val_args: runtime_arguments.registers
          val_val: val_type_parameters.registers
          val_const: const_globals.registers
          quad_args: quad_runtime_arguments.registers
          quad_const: quad_const_globals.registers
          td_args: td_runtime_arguments.registers
          td_const: td_const_globals.registers
          td_val: td_val_type_parameters.registers
          td_bytes: tps_sizeof_bytes
        explanation: >-
          The three ways a parameter set can reach a kernel, compiled on the
          CloudMicrophysics body, on the quadrature path that calls it, and on
          the Thermodynamics call that path makes. The
          const-global column is what makes this an answer about the dependency
          rather than about Val: it is the best any constant-folding scheme can
          do, reachable only because the harness is standalone, and a dependency
          change cannot go past it. Compile-only with
          `CUDA.@cuda launch=false`, so nothing executes.
      - kind: result
        path: results/val-mileage.json
        values:
          mileage_ceiling: ceiling_pct_of_device
          mileage_treated: treated_pct_of_device
          mileage_untreated: untreated_pct_of_device
          mileage_untreated_n: untreated_kernels
          mileage_largest_pct: largest_untreated_pct_of_device
        explanation: >-
          What is left to aim at, in device time rather than kernel counts. A
          dependency-wide change has to pay for itself out of this, and the
          figure to compare it against is the untreated remainder, not the
          ceiling: the ceiling's two largest entries are the kernels this
          project has already folded from the ClimaAtmos side.

  - question: >-
      A kernel optimization saves N ms of device time on every step. How much wall clock does it return?
    answer: >-
      Essentially all of it, once the benchmark resembles the run you care about. On a benchmark that does not, most of it disappears -- and that is a property of the benchmark, not of the optimization.
      The typical step converts the device saving completely: {typ_saved:.2f} ms measured against the {typ_device:.2f} ms the profiled device time predicts, {conversion:.0f}%, across {plain_steps:,.0f} ordinary steps. Nothing is lost between the kernel and the clock.
      It also survives to the run total. The window reports {saved_pct:.2f}% against the {cf_pct:.2f}% that per-step rate would give, a shortfall of {shortfall:.2f} points -- nothing. So there is no conversion gap to explain.
      The benchmark that does not is the one this project measured on first: a one-day window at a 30-second coupled timestep, which wrote diagnostics 24 times a simulated day instead of once and left ordinary steps about half the wall clock, so an every-step saving had half the budget to act on and reported a fraction of itself. See the window rationale in AGENTS.md.
      Mirroring the nightly configuration instead -- `dt` 120secs, `dt_rad` 1hours, four simulated days -- leaves ordinary steps {plain_wall:.1f}% of the wall clock and the {diag_steps:.0f} daily diagnostics writes {diag_wall:.1f}%, still {diag_mult:.0f}x an ordinary step each and still absorbing almost none of the saving, {diag_saving_pct:.1f}% of it. The periodic ceiling did not go away; it stopped dominating.
      Compilation shrank with it: {pen_steps:.0f} ordinary steps, {pen_pct:.1f}% of them, are slower in the specialized arm, {pen_s:.1f} s in total or {pen_per_step:.2f} ms averaged over every ordinary step, worst single step {pen_worst_ms:,.0f} ms and the last above 200 ms at step {pen_last:,.0f}. It is first-call compilation of the specialized methods rather than noise, which would be symmetric, but at {pen_s:.1f} s it no longer moves the headline.
      The steady-state figure now agrees with the whole window rather than correcting it: {ss_pct:.2f}% over the final {ss_cycles:.0f} diagnostics cycles, {ss_exdiag_pct:.2f}% excluding the diagnostics steps, against {saved_pct:.2f}% for the window entire. It is flat wherever the cutoff is put -- {sens720:.2f}% from step 720, {sens1440:.2f}% from step 1440, {sens2400:.2f}% from step 2400 -- which is what a run with little compilation left in it looks like.
      End to end, on the unprofiled AMIP pair rather than this step-breakdown pair, the treatment is worth {speedup_pct:.2f}% of wall clock, {sypd_base:.4f} to {sypd_mod:.4f} SYPD -- the figures CliMA/ClimaAtmos.jl#4879 quotes. Three measurements of one treatment on three pairs of runs will not agree to the last digit, and the SYPD pair is a throughput ratio while {saved_pct:.2f}% is a duration reduction, so the two must never be quoted as one number.
      The null test prices that disagreement instead of conceding it. With CliMA/ClimaAtmos.jl#4879 merged both arms sit on one commit, so the same three measurements describe a treatment of nothing: {null_amip:.2f}% on the unprofiled AMIP pair, {null_step:.2f}% on the step-breakdown pair, {null_nsys:.2f}% profiled, and {null_ss:.2f}% in steady state. All four are zero, and two have the wrong sign. The device chain agrees it is zero where it should -- {null_device:.2f}% across the treated kernels, {null_arm:.2f}% over the whole arm -- which is the direct check that device-side nsys figures are the trustworthy ones.
      So the floor is a few points of wall clock, and read against it this treatment's {speedup_pct:.2f}% is a small multiple of the spread rather than comfortably clear of it.
      Repeating a pair says what kind of floor it is, and the answer is not the one this project assumed for months. The treatment measured in this pass -- the updraft cache, not the fold above -- has been run end to end {repeat_n:.0f} times on the same committed code, giving {repeat_min:.2f}% to {repeat_max:.2f}%: a mean of {repeat_mean:.2f}% and a spread of {repeat_spread:.2f} points.
      Run-to-run repeatability is therefore about half a point, several times tighter than the {null_amip:.2f}% the null test found between two IDENTICAL arms, so those two figures cannot both be jitter -- one of them is a confound that repeats, and a confound that repeats is not reduced by averaging.
      Two candidates were available and both are now measured. The arms run one after the other, so running second could be worth something; and SLURM hands out whichever device is free, so the arms need not even share a GPU.
      Neither is the confound. Reversing the order -- mod first, baseline second, forced onto the same committed code -- was predicted to return {repeat_predicted:.2f}% if the null's {null_amip:.2f}% were entirely the advantage of running second, and it returned {repeat_reverse:.2f}%: running second is worth {repeat_order_effect:.2f} points, and the order-corrected figure is {repeat_corrected:.2f}%.
      GPU assignment is ruled out the same way, from the record rather than by argument: the pairs span a matched assignment, a mismatched one, and a second matched one -- one of them with the baseline arm on the GPU this cluster used to blacklist -- and they agree inside {repeat_spread:.2f} points regardless.
      So the null test's {null_amip:.2f}% is not explained by order and not by hardware, and it is several times the spread of three repeats. The history says the same: {census_n:.0f} passes in this repository have arms that `record-treatment` found identical in content and a measurement committed by the same pass, and the {census_earlier:.0f} run on earlier benchmark windows land within {census_earlier_max:.3f} points of zero -- the {null_amip:.2f}% is the only one at the window in use now.
      The likeliest reading is therefore that this window's single null pair was an outlier draw rather than a bias, which would put the floor near the repeats' own {repeat_spread:.2f} points and leave this treatment's {repeat_mean:.2f}% comfortably clear of it.
      That is a reading and not a measurement: it rests on one null pair at this configuration, and repeating the null test -- two unprofiled AMIP runs -- is still what would settle it. Until it is settled the conservative course is to quote the {repeat_margin:.2f}-point margin over the null alongside the headline, and to treat a candidate worth a percent or two as unresolved by a single pair.
      So the lesson is not about conversion, which was never the problem. It is that a benchmark whose periodic work dominates its wall clock will report a fraction of any every-step saving, and will do so without any sign that it is doing it. Convert a kernel result through the step distribution before promising it as a speedup, and check what fraction of the window the ordinary steps actually hold.
      Measure both arms. The one-arm version of this stage reported {mod_frac:.1f}% of wall in the mod arm's expensive steps against {base_frac:.1f}% in the baseline's, which reads as a treatment effect and is not one: the threshold is 1.25x each arm's OWN median, and the fold moved the median from {base_med:.1f} to {mod_med:.1f} ms, so an unchanged distribution crosses a lower bar. Those fields cannot be read across arms; a fixed periodic classification can.
    evidence:
      - kind: result
        path: results/fold-record/step-comparison.json
        values:
          typ_saved: typical_step.saved_median_ms
          typ_device: typical_step.device_predicted_ms
          conversion: typical_step.conversion_pct
          plain_steps: classes.plain.steps
          plain_wall: classes.plain.pct_of_baseline_wall
          diag_steps: classes.diagnostics.steps
          diag_wall: classes.diagnostics.pct_of_baseline_wall
          diag_mult: classes.diagnostics.multiple_of_plain_step
          diag_saving_pct: classes.diagnostics.pct_of_saving
          saved_pct: saved_pct
          cf_pct: counterfactual.saved_pct
          shortfall: counterfactual.shortfall_points
          pen_steps: compile_penalty.steps
          pen_pct: compile_penalty.pct_of_plain_steps
          pen_s: compile_penalty.total_s
          pen_per_step: compile_penalty.ms_per_plain_step
          pen_worst_ms: compile_penalty.worst_step_ms
          pen_last: compile_penalty.last_step_over_200ms
          mod_frac: own_threshold.mod_expensive_wall_frac
          base_frac: own_threshold.baseline_expensive_wall_frac
          base_med: own_threshold.baseline_median_ms
          mod_med: own_threshold.mod_median_ms
          ss_pct: steady_state.saved_pct
          ss_exdiag_pct: steady_state.saved_pct_ex_diagnostics
          ss_cycles: steady_state.cycles
          sens720: steady_state.sensitivity.from_step_720
          sens1440: steady_state.sensitivity.from_step_1440
          sens2400: steady_state.sensitivity.from_step_2400
        explanation: >-
          Paired per-step wall clock from the two unprofiled arms on the same
          config, so step index i is the same work in both and the difference is
          a paired one rather than a comparison of aggregates. The typical-step
          figure is the MEDIAN paired difference, not the mean: the mean is
          lower by exactly the compilation penalty this answer decomposes, so
          quoting the mean would hide the effect inside the headline. The device
          prediction comes from results/fold-record/param-fold.json, the subtotal over the
          four folded kernels divided by the profiled window, so the comparison
          is device saving against wall-clock saving for one treatment.
          The counterfactual holds every ordinary step at the median rate and
          takes the periodic steps as measured; it is what this treatment would
          return without its own compilation, not a claim about any other
          change.
          The steady-state window starts at the first hour boundary at or after
          the last compilation spike, which is derived from the penalty rather
          than chosen; `sensitivity` records the saving from five other start
          points so the choice can be audited. It is a reanalysis of the same
          one-day pair, not a longer run: it shows the fixed costs amortizing
          within the window measured, and does not measure a regime where the
          diagnostics cadence itself changes.
      - kind: result
        path: results/fold-record/summary.json
        values:
          speedup_pct: speedup_pct
          sypd_base: baseline.sypd
          sypd_mod: mod.sypd
        explanation: >-
          The end-to-end figures, from the two unprofiled AMIP arms rather than
          the step-breakdown pair the rest of this answer uses. They are cited
          here because CliMA/ClimaAtmos.jl#4879 quotes them, and a figure a PR
          body quotes has to be one the pipeline checks. `speedup_pct` is a
          reduction in wall clock and the two `sypd` values are a throughput
          ratio; they describe the same treatment and are not interchangeable.
          Read out of results/fold-record/, which scripts/snapshot-tag-records.py
          re-copies from the measurement's tag on every pass. The live
          results/summary.json describes whatever ran last, and what ran last is
          now a null test: ClimaAtmos main carries the fold, so both arms are
          identical and the live file would render ~0% under this prose.
      - kind: result
        path: results/sypd-repeats.json
        values:
          repeat_n: latest_treatment.n_pairs
          repeat_mean: latest_treatment.mean_pct
          repeat_min: latest_treatment.min_pct
          repeat_max: latest_treatment.max_pct
          repeat_spread: latest_treatment.spread_points
          repeat_margin: latest_treatment.margin_over_null_points
          repeat_reverse: latest_treatment.by_order.mod_first.mean_pct
          repeat_order_effect: latest_treatment.order_effect_points
          repeat_corrected: latest_treatment.order_corrected_pct
          repeat_predicted: latest_treatment.predicted_if_order_explains_null_pct
        explanation: >-
          Independent repeats of one treatment, appended by
          scripts/record-sypd-repeat.py rather than written by a stage: its
          input is the AMIP stages' scheduler logs, which the next repeat
          deletes and rewrites, so the record has to survive its own source.
          Each entry carries the treatment's diff digest and the whole
          submodule pointer map, and pairs are grouped by digest, so runs of
          different code can never be averaged together; `latest_treatment` is
          the group holding the most recent pair, which is what this answer
          cites. Every pair records which arm ran second and which GPU each arm
          was given, so the two confounds a single pair cannot see past are
          measurable across pairs rather than assumed away;
          `predicted_if_order_explains_null_pct` was committed before the
          reversed pair ran, so it is a prediction the record can be checked
          against rather than a description written afterwards. The repeats
          needed CALKIT_FORCE=1 to resubmit at all -- a forced scheduler stage
          otherwise harvests its own previous job and re-measures nothing.
      - kind: result
        path: results/null-census.json
        values:
          census_n: n_nulls
          census_earlier: n_earlier_windows
          census_earlier_max: earlier_abs_max_pct
        explanation: >-
          Every null test in the committed history, collected by walking it
          rather than remembered: a pass whose arms record-treatment found
          identical in content is a measurement of nothing, and the collection
          is the only evidence here about how wide the wall-clock noise is. A
          commit counts only where one pass wrote both the treatment record and
          the summary, because before record-treatment carried `always_run` it
          could be skipped while the pass went ahead -- one such commit claims
          identical arms beside a +12.6% speedup. The split by benchmark window
          matters as much as the count: all but one null predates the current
          window, and a shorter window at a coarser timestep does not measure
          this one's noise.
      - kind: result
        path: results/null-record/summary.json
        values:
          null_amip: speedup_pct
          null_nsys: nsys_speedup_pct
          null_ss: steady_state_pct
        explanation: >-
          The same pipeline run with both arms on one commit, so every figure it
          reports is a measurement of nothing. It is what the treatment's
          percentages must be read against, and it is as perishable as they are
          -- so it is pinned out of its tag by the same stage, not read live.
      - kind: result
        path: results/null-record/step-comparison.json
        values:
          null_step: saved_pct
        explanation: >-
          The step-breakdown pair's own verdict on the null test, which is the
          third of the three wall-clock measurements and disagrees in sign with
          the AMIP pair. Also the run that showed the steady-state cutoff was
          calibrated inside this noise: with no compilation difference possible
          it still found spikes, one of them late enough to empty the window.
      - kind: result
        path: results/null-record/param-fold.json
        values:
          null_device: fold_attributable.change_pct
          null_arm: device_total.change_pct
        explanation: >-
          The device side of the null test. Unlike the wall clock it comes back
          flat, which is the evidence for treating kernel times as the solid
          measurement and wall clock as the noisy one rather than the reverse.
  - question: >-
      How much of the wall clock do diagnostics cost, and is it worth optimizing them?
    answer: >-
      Diagnostics cost {total_pct:.1f}% of the wall clock on the benchmark window, so the whole of them is worth {sypd_headroom:.1f}% in SYPD -- that is the ceiling on any work to speed them up, and it is the number to compare an optimization's cost against before starting.
      The split matters more than the total, because the two halves need different work. The {diag_steps:.0f} daily write events carry {write_pct:.1f}% of wall on their own, at {diag_mult:.0f}x an ordinary step each, which is I/O and reduction flushing concentrated in a handful of steps. The rest is the sampling that feeds them, spread thinly across every ordinary step, where it is invisible in the median and cannot be found by looking for expensive steps.
      How much of the rest, this design cannot say, and that is now measured rather than hedged. The residual left after the write steps is {sampling_pct:.2f} points of wall clock, against a {repeat_spread:.2f}-point spread between independent repeats of one AMIP pair of identical code -- so the residual is smaller than the variation of the runs it is differenced from, and it bounds the sampling share without measuring it.
      The demonstration is on the record: re-running the baseline arm alone, twice, with no code change at all, swung the residual from its original value to zero and most of the way back -- the three values are in the committed history of results/diagnostics-cost.json. So the write steps account for essentially the whole of the diagnostics cost this measurement can see, and pricing the sampling would take a separately instrumented run rather than another difference of two.
      Nothing else in this pipeline can answer the question, which is why the measurement is a whole extra run. The 120-step nsys window is shorter than the 720-step daily write period, so it contains no write at all and its kernel table reports the sampling as ordinary every-step work. The step breakdown finds the writes precisely, because they are the most expensive steps in the window, and by construction cannot find the sampling for the same reason.
      Read the total as an upper bound. It differences two whole runs, {wall_on:.0f} s against {wall_off:.0f} s over {n_steps:,.0f} steps, so it also contains the compilation the diagnostics-off run does not pay. The direction of that bias is known and its size is not, which is the honest limit of a difference-of-runs design and the reason the write-step share is cited from a separate measurement rather than derived from this one.
    evidence:
      - kind: result
        path: results/diagnostics-cost.json
        values:
          total_pct: total_pct_of_wall
          sypd_headroom: sypd_headroom_pct
          write_pct: write_steps_pct_of_wall
          sampling_pct: sampling_pct_of_wall
          repeat_spread: repeat_spread_points
          wall_on: with_diagnostics.wall_time_total_s
          wall_off: without_diagnostics.wall_time_total_s
          n_steps: n_steps_timed
        explanation: >-
          The baseline arm run twice on the same config, differing only in
          whether diagnostics are enabled, so the wall-clock difference is what
          they cost in total -- computation and writing together. The stage
          asserts that both runs stepped the same window, because a config that
          failed to apply would otherwise show up as a diagnostics saving. The
          generated diagnostics-off config is deleted when the job exits rather
          than committed, so the submodule stays clean and `record-treatment`
          does not report a dirty tree. Cited unpinned because it describes the
          current benchmark; both halves are regenerated together by the same
          pass, so the ratio cannot mix two configurations.
      - kind: result
        path: results/step-comparison.json
        values:
          diag_steps: classes.diagnostics.steps
          diag_mult: classes.diagnostics.multiple_of_plain_step
        explanation: >-
          How many write events the window holds and how expensive each is
          relative to an ordinary step, measured independently of the run above
          by classifying steps on the periodic schedule. This is the half of the
          cost that a step breakdown CAN see; it is cited here to make clear that
          the other half is not a residual anyone forgot to measure but one this
          method cannot reach.

  - question: >-
      Is there a rule of thumb for when folding parameters into the type is worth it, or does it always take a profile to find out?
    answer: >-
      There is a rule, it is not the one the question suggests, and a five-minute compile replaces the profile: counting the parameters predicts nothing, while compiling the body with its parameters as const globals settles whether a fold on that body can pay at all.
      The parameter set ClimaAtmos folds is {payload_bytes:.0f} bytes, or {payload_registers:.0f} registers, and that one payload produced savings of {savings_list} registers at {payload_sites:.0f} sites in the same source -- a spread of {saving_spread:.0f} registers on identical parameters, so the size takes every value from nothing to everything.
      The payload does bound them -- none of the {payload_sites:.0f} exceeded it and the largest landed exactly on it -- so the size prices the prize and orders nothing, which is the distinction worth keeping: a bound that outcomes from zero to all of it respect predicts none of them.
      Read it as a tight bound rather than a hard one, since these are compile-only figures and they move when the stack moves, the same way the in-model payoffs do.
      Nor does a small payload mean a small prize -- the Thermodynamics call carries a {td_payload_registers:.0f}-register payload into a {td_registers:.0f}-register kernel and saved nothing however the parameters arrived, which is a kernel that was never paying for them.
      What the size does give is the scale once a fold is known to land: over the {landing_sites:.0f} sites where nothing boxed the parameters and the kernel was larger than the payload, the saving came to {recovered_min_pct:.1f}% to {recovered_max_pct:.0f}% of it, so `sizeof(params)/4` brackets the prize within {recovered_spread_pct:.1f} points of the payload and says nothing about the odds of collecting it.
      The test that does predict is const globals, which are the ceiling of any constant-folding scheme -- a value the compiler already has, with no wrapper to lose it through -- so a body that does not move with them cannot be folded by any means.
      It is compile-only: `CUDA.@cuda launch=false` compiles the kernel and `CUDA.registers` reads the count without executing it, so `val-params-registers` is minutes with no simulation and no coupled model, against hours for a profile pair.
      It matched `Val` at {ceiling_agree:.0f} of {ceiling_sites:.0f} sites with a largest disagreement of {ceiling_disagreement:.0f} registers, and the part that makes it a decision rule rather than a correlation is that it flagged {ceiling_flagged:.0f} sites in advance which are exactly the two where a fold went on to return nothing, with {ceiling_false_alarms:.0f} sites condemned that would have paid.
      Both failures this project actually hit were caught that way before any fold was written, and only one of them was final: a kernel not spending registers on its parameters is closed, while an evaluator holding them as struct FIELDS stores the constant and reads it back per point, which is a code shape to change rather than a verdict on the kernel -- the same body with the parameters moved into the evaluator's type goes {boxed_registers:.0f} -> {unboxed_registers:.0f} registers, {unboxed_saving:.0f} saved, and that is another compile-only probe.
      So a `no` from the ceiling closes the fold as written and asks which of the two causes it is, rather than closing the kernel, and both answers cost a compile.
      What the compile cannot tell you is the size, and for that the quantity is warps per SM rather than registers, since ClimaCore sizes the launch block from the register count.
      Both payoffs started at {paid_warps} warps per SM, returning {best_change_pct:.2f}% ({best_warps_before:.0f} -> {best_warps_after:.0f} warps) and {biggest_change_pct:.2f}% ({biggest_warps_before:.0f} -> {biggest_warps_after:.0f}), while everything flat started at {flat_warps} warps, against a control kernel the fold left at the same register count whose own time still moved {noise_band_pct:.2f}%.
      Crossing a step is necessary and nowhere near sufficient: the cloud-fraction kernel shed {crossed_flat_registers_saved:.0f} registers and crossed {crossed_flat_warps_before:.0f} -> {crossed_flat_warps_after:.0f} warps for {crossed_flat_change_pct:.2f}%, less than the control that crossed nothing.
      So the procedure, cheapest first: confirm the parameter set is `isbits`, read the occupancy limiter and the distance to the next step off the static ncu pass the pipeline already holds, check the kernel holds enough device time to repay the work, then compile with const globals and stop there if nothing moves.
      That is free or minutes, and it called every outcome on the record for the body it was handed -- including the ClimaAtmos change behind the largest payoff here, which was decided from the compile-only probes and only afterwards priced by a profile.
      Which is the answer to the second half of the question: a profile prices a fold, it does not decide one.
      Two limits travel with this. The threshold between {paid_warps} warps per SM, where folds paid, and {flat_warps}, where they did not, is bracketed rather than located; and in this record every flat kernel is also a small one, holding at most {largest_flat_pct_of_device:.1f}% of device time against {smallest_paying_pct_of_device:.1f}% for the smallest payoff, so occupancy headroom and device share cannot be separated from these four kernels alone.
      Population-wide the screen is what keeps the rule cheap to apply: of {kernels_profiled:.0f} kernels in a 120-step run, {addressable:.0f} ({addressable_pct}%) are capped by registers alone and below full occupancy, {at_full_occupancy:.0f} are already at full occupancy and can gain nothing however well their parameters fold, and the largest untreated candidate -- {largest_untreated_pct:.2f}% of the device, {largest_untreated_shed:.0f} registers from its next step -- carries no parameter struct to fold in the first place.
    evidence:
      - kind: result
        path: results/fold-decision.json
        values:
          payload_bytes: summary.payload_bytes
          payload_registers: summary.payload_registers
          payload_sites: summary.payload_sites
          savings_list: summary.savings_list
          saving_spread: summary.saving_spread
          landing_sites: summary.landing_sites
          recovered_min_pct: summary.recovered_min_pct
          recovered_max_pct: summary.recovered_max_pct
          recovered_spread_pct: summary.recovered_spread_pct
          td_payload_registers: summary.td_payload_registers
          td_registers: summary.td_registers
          ceiling_sites: summary.ceiling_sites
          ceiling_agree: summary.ceiling_agree
          ceiling_flagged: summary.ceiling_flagged
          ceiling_false_alarms: summary.ceiling_false_alarms
          ceiling_disagreement: summary.ceiling_disagreement
          unboxed_saving: summary.unboxed_saving
          unboxed_registers: summary.unboxed_registers
          boxed_registers: summary.boxed_registers
          noise_band_pct: summary.noise_band_pct
          paid_warps: summary.paid_warps
          flat_warps: summary.flat_warps
          best_change_pct: summary.best_change_pct
          best_warps_before: summary.best_warps_before
          best_warps_after: summary.best_warps_after
          biggest_change_pct: summary.biggest_change_pct
          biggest_warps_before: summary.biggest_warps_before
          biggest_warps_after: summary.biggest_warps_after
          crossed_flat_change_pct: summary.crossed_flat_change_pct
          crossed_flat_warps_before: summary.crossed_flat_warps_before
          crossed_flat_warps_after: summary.crossed_flat_warps_after
          crossed_flat_registers_saved: summary.crossed_flat_registers_saved
          largest_flat_pct_of_device: summary.largest_flat_pct_of_device
          smallest_paying_pct_of_device: summary.smallest_paying_pct_of_device
          kernels_profiled: summary.kernels_profiled
          addressable: summary.addressable
          addressable_pct: summary.addressable_pct
          at_full_occupancy: summary.at_full_occupancy
          largest_untreated_pct: summary.largest_untreated_pct
          largest_untreated_shed: summary.largest_untreated_shed
        explanation: >-
          Every parameter-fold attempt the project has measured -- five
          compile-only probes and the four kernels folded in the model -- put
          against three candidate predictors, with the reasoning in
          docs/fold-decision-rule.md. It is assembled from earlier stages'
          outputs and runs no GPU, which is the point: if the decision needed a
          profile this file could not exist. Two cross-checks are what make it
          a test rather than a summary. `ceiling_test` records whether the
          const-global probe's zeros coincide with the sites where a fold
          returned nothing, in both directions, so a probe that condemned a
          site that would have paid would show up. And `magnitude_test` reports
          that its flat sites are also its smallest, so the file states the
          confound rather than letting the occupancy reading take credit for
          both gates. The control is the fourth folded kernel, whose register
          count the fold did not move: its change is the per-kernel noise the
          measurement resolves, and one kernel that crossed an occupancy step
          came in under it.
tables:
  - path: results/top-kernels.csv
    title: Top 20 GPU kernels, baseline vs. mod
    description: >-
      Per-kernel Nsight Systems aggregates for the top 20 kernels, ranked by
      whichever arm spends longer in them so a kernel that exists only in the
      modified arm is not dropped: invocation counts, total and mean duration,
      share of total GPU time, registers per thread, and the percent change in
      total time. `pairing` says how each row's two arms were matched --
      `exact` on the full mangled name, `rank` where an upstream edit renumbered
      the kernel's source line and the group was separated enough in time to
      match it unambiguously, or `baseline only`/`mod only` where no confident
      match exists and the row is left half empty rather than guessed.

  - path: results/kernel-resources.csv
    title: Per-kernel register, spill, and occupancy stats
    description: >-
      Nsight Compute resource metrics for the profiled microphysics kernels,
      baseline vs. mod: registers per thread, register spilling (requests and
      the share of memory traffic they cost), stack frame, and achieved vs.
      theoretical occupancy.

      This exists because the nsys table above cannot show the mechanism behind
      the headline speedup. The hot kernel can sit pinned at the 255-register
      cap in BOTH cases, so by the columns nsys collects nothing changed at all,
      while its total time falls by half. Registers at the cap is not the same
      thing as spilling, and nsys does not collect spill metrics -- only Nsight
      Compute does. Specific figures are deliberately left to the table rather
      than quoted here, so this description cannot go stale against the data it
      describes.

environments:
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_options:
      - --gpus=1
      - --time=120
  sassy:
    kind: system
    host: sassy.caltech.edu
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.13"

pipeline:
  stages:
    record-treatment:
      # Reports git state -- submodule SHAs, refs, whether a tree was dirty --
      # which DVC cannot see, because its declared inputs are file contents.
      # Committing a submodule changes no content, so the stage was skipped as
      # unchanged while the very thing it records had changed, and it kept
      # reporting a stale SHA and a dirty tree that was no longer dirty.
      # It is CPU-only and takes seconds, so it runs every time.
      always_run: true
      kind: python-script
      environment: py
      script_path: scripts/record-treatment.py
      # What actually ran, as opposed to what a commit message says ran. A
      # superproject commit pins every submodule SHA, but not whether a package
      # was dev'd into the AMIP environments (a submodule can be checked out and
      # irrelevant), nor whether a tree was dirty, nor which CLIMA_* variables
      # the stages exported. Each of those has changed the meaning of a result
      # in this project at least once.
      #
      # Depends on diffs/ rather than the submodules directly, so it re-runs
      # after make-diffs has observed the same state, and cannot disagree with
      # the archived diff.
      inputs:
        - from_stage_outputs: make-diffs
        - calkit.yaml
      outputs:
        - path: results/treatment.json
          storage: git
    make-diffs:
      kind: shell-script
      environment: _system
      script_path: scripts/make-diffs.sh
      inputs:
        - ClimaCoupler.jl
        - ClimaCoupler.jl-mod
        - ClimaCore.jl
        - ClimaCore.jl-mod
        - ClimaAtmos.jl
        - ClimaAtmos.jl-mod
        - CloudMicrophysics.jl-mod
        - RRTMGP.jl
        - RRTMGP.jl-mod
      outputs:
        - path: diffs
          storage: git
    baseline-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/baseline
        - ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/nsys/baseline.nsys-rep
        - results/nsys/baseline.sqlite
    mod-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/nsys/mod
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        # CloudMicrophysics.jl-mod/src is deliberately NOT an input: neither arm
        # devs it (the AMIP manifest pins v0.45.0 by git-tree-sha1, and
        # scripts/dev-local-repos-coupler.sh devs only ClimaCore, ClimaAtmos and
        # RRTMGP), so editing that submodule cannot change what any mod stage
        # runs, and listing it made a harmless edit cost hours of re-profiling.
        - ClimaAtmos.jl-mod/config
      outputs:
        - results/nsys/mod.nsys-rep
        - results/nsys/mod.sqlite
    baseline-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
      # describes.
      #
      # Re-frozen 2026-10-22 after the unfreeze that produced
      # exp/2026-10-21-fold-same-revision. The arms are byte-identical on main
      # now that the fold is upstream, so re-running this pair would replace a
      # table showing 255 -> 153 registers and 41.65% -> 0% spill with a table of
      # zeros, at the cost of about three GPU hours.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      args:
        - results/ncu/baseline
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the baseline tree. It
        # also matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl/experiments/AMIP
        - --config
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/ncu/baseline.ncu-rep
        - path: results/ncu/baseline-details.csv
          storage: git
          delete_before_run: true
    mod-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
