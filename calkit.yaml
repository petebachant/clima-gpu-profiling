    amip-nodiag:
      # Frozen 2026-11-03: one reservation per pass for the diagnostics-off
      # arm. The cost is measured and written up, and no kernel treatment
      # changes it, so the pass was paying for a constant.
      #
      # Frozen together with diagnostics-cost, which differences this arm
      # against amip-baseline. Freezing one alone is the ncu failure in another
      # costume: a stale diagnostics-off run paired with a fresh
      # diagnostics-on run, reported as a sampling cost with nothing saying so.
      #
      # The figures behind it were taken at z_elem 63. The benchmark config
      # moved to z_elem 79 with update_cache_every: stage on 2026-11-03, which
      # changes the share of wall a write step carries, so unfreeze the pair and
      # re-measure before quoting write_steps_pct_of_wall against the current
      # config.
      frozen: true
      # The baseline arm with diagnostics disabled, for differencing against
      # amip-baseline. The config is generated by the script and deleted on exit
      # rather than committed, so the submodule never goes dirty mid-pipeline.
      kind: shell-script
      environment: clima
      script_path: scripts/run-amip-nodiag.sh
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
        - ClimaAtmos.jl/toml
    diagnostics-cost:
      # Frozen 2026-11-03 with amip-nodiag, which supplies its off arm; see the
      # reasoning there. It is CPU-only and cheap -- it is frozen for
      # correctness, not for time, because it would otherwise divide a frozen
      # off arm against a fresh on arm every pass.
      frozen: true
      kind: python-script
      environment: py
      script_path: scripts/diagnostics-cost.py
      inputs:
        - results/step-comparison.json
        # Not a stage output: appended by scripts/record-sypd-repeat.py. It
        # supplies the spread the sampling residual has to clear to be a
        # measurement, so a new pair should restate whether it clears it.
        - results/sypd-repeats.json
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-nodiag
      outputs:
        - path: results/diagnostics-cost.json
          storage: git
    summarize:
      kind: python-script
      environment: py
      script_path: scripts/summarize.py
      inputs:
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
        - results/step-comparison.json
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: results/summary.json
          storage: git
    compare-kernels:
      kind: jupyter-notebook
      notebook_path: notebooks/compare-kernels.ipynb
      environment: py
      inputs:
        - from_stage_outputs: baseline-nsys
        - from_stage_outputs: mod-nsys
      outputs:
        - path: results/top-kernels.csv
          storage: git
      html_storage: git
      executed_ipynb_storage: git
    pass-through:
      kind: python-script
      script_path: scripts/pass-through.py
      environment: py
      # Reads each experiment out of its tag with git show, so it has no file
      # inputs and nothing in the working tree can change what it reports.
      always_run: true
      outputs:
        - path: results/pass-through.json
          storage: git

    record-sypd-repeat:
      kind: python-script
      script_path: scripts/record-sypd-repeat.py
      environment: py
      # Appends one AMIP pair per pass to an accumulating record, keyed on a
      # hash of both logs so re-running without a new measurement cannot
      # inflate the count. `delete_before_run: false` is load-bearing: DVC
      # deletes a stage's outputs before running it, which for an append-only
      # record would destroy every earlier pair. Always runs because what makes
      # a pair new is the logs being rewritten, which the dedupe guard checks.
      always_run: true
      inputs:
        - results/null-record/summary.json
        # Declared so the census runs first: the floor a pair is read against is
        # the mean over every null at this window, not the one pinned above it.
        - results/null-census.json
        - from_stage_outputs: record-treatment
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: results/sypd-repeats.json
          storage: git
          delete_before_run: false
    census-null-tests:
      kind: python-script
      script_path: scripts/census-null-tests.py
      environment: py
      # Walks the committed history for passes whose arms were identical, so its
      # source is git rather than any file DVC can hash. Every new pass can add
      # one, and a null test is the only thing that measures the noise floor.
      always_run: true
      outputs:
        - path: results/null-census.json
          storage: git
    snapshot-tag-records:
      kind: python-script
      script_path: scripts/snapshot-tag-records.py
      environment: py
      # Copies each measurement's figures out of its tag with git show, so it has
      # no file inputs and the next pass cannot rewrite what it reports. The fold
      # is one record and the null test that calibrates it is the other.
      always_run: true
      outputs:
        - path: results/fold-record/summary.json
          storage: git
        - path: results/fold-record/step-comparison.json
          storage: git
        - path: results/fold-record/param-fold.json
          storage: git
        - path: results/fold-record/provenance.json
          storage: git
        - path: results/null-record/summary.json
          storage: git
        - path: results/null-record/step-comparison.json
          storage: git
        - path: results/null-record/param-fold.json
          storage: git
        - path: results/null-record/provenance.json
          storage: git

    export-kernel-resources:
      kind: python-script
      environment: py
      script_path: scripts/export-kernel-resources.py
      # Reads the CSVs Nsight Compute already exported, so this needs no GPU and
      # is not frozen alongside the ncu stages that produce them.
      inputs:
        - from_stage_outputs: baseline-ncu
        - from_stage_outputs: mod-ncu
      outputs:
        - path: results/kernel-resources.csv
          storage: git
    compile-time-doc:
      kind: markdown
      target_path: docs/compile-time.md
      environment: py
      # Live on main, unlike the experiment documents. Its only input is the
      # committed results/compile-time/compile-time.toml, which the frozen
      # compile-time-study stage does not regenerate here, so re-running this
      # cannot restate the experiment against a different run.
    pass-through-doc:
      kind: markdown
      target_path: docs/pass-through.md
      environment: py
      # Live on main. It declares a values stage that reads the two results
      # files its prose quotes, which is what makes the document a pipeline node
      # rather than hand-written text: it goes stale when they do, and `calkit
      # run` restates it. One of those files is a snapshot of a measurement's
      # tag, so the figures do not move when a later pass measures something
      # else.
    val-fold-scope-doc:
      kind: markdown
      target_path: docs/val-fold-scope.md
      environment: py
      # Live on main, and cited by two questions at different sections -- the
      # occupancy gates and the dependency scope are one argument, and splitting
      # them across two documents would duplicate the device budget both rest
      # on. Its values stage is also doing real work rather than copying: two of
      # its inputs are TOML, which a value marker cannot read.
    wall-clock-conversion-doc:
      kind: markdown
      target_path: docs/wall-clock-conversion.md
      environment: py
      # Live on main. Every figure it quotes comes from the snapshot copies
      # under results/fold-record/ and results/null-record/ rather than the live
      # results files, because the live ones describe whatever ran last -- and
      # what ran last is a null test, which would render this prose at roughly
      # zero.
    diagnostics-cost-doc:
      kind: markdown
      target_path: docs/diagnostics-cost.md
      environment: py
      # Live on main, and unpinned on purpose: it describes the current
      # benchmark, and both halves of the difference it reports are regenerated
      # together by the same pass, so the ratio cannot come to mix two
      # configurations.
    sedimentation-velocity-fold-doc:
      kind: markdown
      target_path: docs/experiments/sedimentation-velocity-fold.md
      environment: py
      # Live on main although it is an experiment document. Its figures come
      # from the frozen results/sedimentation-fold.json, and the four it takes
      # from the live results/fold-decision.json are that file's record of the
      # prior fold sites, which is read out of results/fold-record rather than
      # off a profile. So nothing it quotes moves when the next experiment
      # overwrites results/nsys.
    fold-decision-doc:
      kind: markdown
      target_path: docs/fold-decision-rule.md
      environment: py
      # Live on main like compile-time-doc, not frozen like the experiment
      # documents. It declares its own analysis stage, which derives
      # results/fold-decision.json from four earlier stages' outputs and runs
      # no GPU, so re-running it restates nothing against a different run --
      # it re-reads the files the pass just wrote.
    fold-compile-cost-doc:
      kind: markdown
      target_path: docs/fold-compile-cost.md
      environment: py
      # Live on main, like fold-decision-doc, and split out of
      # docs/experiments/sedimentation-velocity-fold.md on 2026-11-03. It was a
      # section there, which made that document half frozen and half live: its
      # own figures come from a pinned snapshot of the 2026-10-31 stack, while
      # these are re-measured by the live fold-compile-cost stage against
      # whatever is current, so the two were rewritten on different schedules
      # inside one file and `calkit check questions` reported the pinned
      # citation as evidence the pipeline would rebuild. Separated, the
      # experiment stops moving and this reprices the open pull request on
      # every pass, which is what it is for.
    launch-cost:
      kind: markdown
      target_path: docs/experiments/launch-cost.md
      environment: py
      # Frozen on main, live at meas/2026-09-19-launch-cost, following
      # compile-time-study. The 2026-09-21 submodule
      # update moved the whole stack, which makes both nsys stages this
      # document declares stale. Re-running them here would re-profile for
      # hours and then restate the experiment against a different stack --
      # and because a templated value renders from the WORKING TREE rather
      # than from its git_ref, the fusion-ceiling answers would quietly start
      # displaying the new numbers while their evidence still checked against
      # the tag. Re-measure by tagging a new experiment, not by re-running
      # this one.
      frozen: true
    step-breakdown:
      # Frozen 2026-11-03: two 90-minute reservations per pass for a
      # measurement no live claim rests on. The CUDA-event breakdown answered
      # how much of a coupler step is GPU work -- the question nsys cannot
      # answer, docs/learnings.md 2b-i -- and that question is settled. The
      # documents that quote a conversion read the pinned
      # results/fold-record/ and results/null-record/ snapshots, not this
      # stage's live output. That live output also still carries the section-8g
      # near-zero-divisor pathology, a conversion of tens of thousands of
      # percent, so regenerating it every pass reproduces a known-bad number at
      # a cost of three cluster hours.
      #
      # Unfreeze BOTH step-breakdown stages together, the way the ncu pair is
      # unfrozen, so the two arms describe one revision. compare-step-breakdowns
      # needs no freeze: with both .toml inputs frozen its inputs stop changing
      # and DVC leaves it alone.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # How much of a coupler step is GPU work, measured WITHOUT a profiler.
      # nsys cannot answer this: docs/learnings.md 2b-i showed its own
      # instrumentation dominates the idle measurement here, and the profiled mod
      # arm reports MORE idle than baseline while being faster in SYPD. This uses
      # CUDA events instead -- two records per ~277 ms step -- and reports wall,
      # GPU span, and the gap between them. gpu_span includes inter-kernel gaps,
      # so it bounds GPU busy from above and the gap is a LOWER bound on host
      # time outside the GPU timeline.
      #
      # Must run through this wrapper, not a bare srun: without `module load
      # climacommon` Julia picks up system CUDA libraries and a step takes 118 s
      # instead of 277 ms, which is how the first attempt at this measurement was
      # wasted.
      scheduler:
        options:
          - --gpus=1
          - --time=90
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/measure-step-breakdown.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        # The benchmark's whole run: 2880 steps = 4 simulated days at dt = 120 s.
        - --steps
        - '2880'
        - --out
        - results/step-breakdown.toml
      inputs:
        - scripts/measure-step-breakdown.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaAtmos.jl-mod/src
      outputs:
        - path: results/step-breakdown.toml
          storage: git

    step-breakdown-baseline:
      # Frozen 2026-11-03 with its sibling step-breakdown; see the reasoning
      # there. Unfreeze the two together or the arms describe different
      # revisions.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # The same measurement on the baseline arm, which the mod arm alone
      # cannot substitute for. On 2026-10-12 the mod arm showed 300 of 2880
      # steps carrying 55.4% of the wall clock, and that skew was read as a
      # property of the model -- but with only one arm measured there is no way
      # to tell a distribution the model always had from one the treatment
      # caused. It is also what the conversion gap needs: a 16.9 ms/step device
      # saving against a 315 ms mean step predicts ~5.4% and steady state
      # measures 2.86%, and attributing that needs the baseline's own step
      # distribution rather than an assumption that it matches.
      #
      # Deliberately NOT named step-breakdown-mod with the existing stage
      # renamed to match. Renaming a DVC stage drops its lock entry and re-runs
      # it, which on a shared machine costs ~40 minutes of GPU to reproduce
      # numbers that are already committed. The arm each file describes is in
      # its name and in its deps in dvc.lock.
      #
      # Read the two as a pair: they are only a comparison if both came from the
      # same revision of the stack, so re-run them together (the hazard
      # kernel-resources.csv hit on 2026-09-03, recorded above).
      scheduler:
        options:
          - --gpus=1
          - --time=90
      args:
        - --project=ClimaCoupler.jl/experiments/AMIP
        - scripts/measure-step-breakdown.jl
        - --config_file
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        # Matches the mod arm exactly.
        - --steps
        - '2880'
        - --out
        - results/step-breakdown-baseline.toml
      inputs:
        - scripts/measure-step-breakdown.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaAtmos.jl/src
      outputs:
        - path: results/step-breakdown-baseline.toml
          storage: git

    compare-step-breakdowns:
      kind: python-script
      environment: py
      script_path: scripts/compare-step-breakdowns.py
      # Pairs the two arms by step index rather than comparing aggregates. The
      # `expensive_*` fields the source TOMLs carry are thresholded against each
      # arm's own median, so they cannot be read across arms; this stage
      # classifies steps by the periodic schedule instead, which is fixed.
      inputs:
        - scripts/compare-step-breakdowns.py
        - results/step-breakdown.toml
        - results/step-breakdown-baseline.toml
        - results/param-fold.json
      outputs:
        - path: results/step-comparison.json
          storage: git

    pointwise-registers:
      # Frozen 2026-11-03: a 240-minute reservation, the longest live GPU stage
      # in the pipeline, for the register-cap half of CliMA/ClimaCore.jl#2676.
      # That survey is complete and its conclusion is written down in
      # docs/fold-decision-rule.md: counting parameters predicts nothing, and
      # compiling the body with const globals predicts `Val` exactly.
      #
      # The cheap test that replaced it for day-to-day work is
      # val-params-registers, which stays live at 40 minutes. Unfreeze this one
      # for a new kernel population -- a stack bump that moves the whole
      # inventory -- not for a new treatment.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu-pointwise.sh
      # Answers the half of CliMA/ClimaCore.jl#2676 that needs no code change:
      # across the whole kernel population, which kernels are capped by
      # registers at all? Val can only pay where they are, so this bounds the
      # answer before anyone wraps a parameter.
      #
      # Static launch/occupancy metrics only, so ncu needs no kernel replay --
      # minutes over every kernel, where the frozen --set full stages cost an
      # hour and a half for six.
      #
      # No --launch-skip: ncu intercepts every launch it skips, and skipping
      # 4000 of them burned a 90-minute allocation without profiling anything.
      # These metrics are properties of the compiled kernel rather than of the
      # run, so a warm model buys nothing here.
      scheduler:
        options:
          - --gpus=1
          - --time=240
      args:
        - results/ncu/pointwise
        - --project
        - ClimaCoupler.jl-mod/experiments/AMIP
        - --config
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-count
        - "1500"
      inputs:
        - scripts/run-ncu-pointwise.sh
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
      outputs:
        - path: results/ncu/pointwise.ncu-rep
          storage: dvc
        - path: results/ncu/pointwise-details.csv
          storage: dvc

    export-pointwise-registers:
      kind: python-script
      environment: py
      script_path: scripts/export-pointwise-registers.py
      args:
        - results/ncu/pointwise-details.csv
      inputs:
        - scripts/export-pointwise-registers.py
        - results/ncu/pointwise-details.csv
      outputs:
        - path: results/pointwise-registers.csv
          storage: git
        - path: results/pointwise-registers.json
          storage: git

    export-sedimentation-fold:
      kind: python-script
      environment: py
      script_path: scripts/export-sedimentation-fold.py
      inputs:
        - scripts/export-sedimentation-fold.py
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
        # The wall-clock side, through summarize rather than from the amip
        # stages directly: this stage must never be able to trigger a GPU run.
        - results/summary.json
        - results/null-census.json
      outputs:
        - path: results/sedimentation-fold.json
          storage: git
      # Frozen, like every snapshot taken off the shared nsys paths. Those hold
      # whichever experiment profiled last, so leaving this live would restate
      # the file against a different treatment on the next pass. The snapshot
      # records the two arms' refs, both database hashes and both AMIP log
      # hashes so a stale freeze is visible in the file rather than only in
      # the pipeline. Frozen on main and live at
      # exp/2026-10-31-sedimentation-velocity-fold, so the snapshot regenerates
      # from the tag rather than only from whatever main last profiled.
      #
      # Left frozen on 2026-11-03 after an attempt to restate it against the
      # re-baselined arms. Upstream fused the two terminal-velocity kernels into
      # one set_precipitation_velocities, so the env/updraft pair this snapshot
      # is built around has no counterpart in the current inventory and the
      # stage dies on an empty match. The experiment document carries fourteen
      # value markers across those two names, so restating it here would mean
      # inventing a split the code no longer has. A frozen experiment record is
      # the measurement as it was run, and that is what this stays; the fold
      # value on the current stack lives in the live outputs instead.
      frozen: true

    export-gpoint-groups:
      kind: python-script
      environment: py
      script_path: scripts/export-gpoint-groups.py
      # Only the two profiles. The wall-clock side is deliberately absent: a
      # stage that reads anything derived from a scheduler log depends on the
      # AMIP runs through three hops, which is how a Markdown stage submitted
      # amip-mod on 2026-10-31.
      inputs:
        - scripts/export-gpoint-groups.py
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
      outputs:
        - path: results/gpoint-groups.json
          storage: git
      # Live until this pass is tagged, then frozen on main like every snapshot
      # taken off the shared nsys paths, which hold whichever experiment
      # profiled last. The file carries both arms' refs and both database
      # hashes so a stale freeze shows up in the snapshot itself.

    val-mileage:
      # Frozen 2026-11-03 with pointwise-registers, whose population CSV it
      # reads. It is CPU-only and cheap; it is frozen for correctness, not for
      # time. It cross-references that frozen population against the CURRENT
      # device time, so with the population pinned and the stack moved it
      # refuses outright -- "only 1.8% of device time is covered by
      # results/pointwise-registers.csv (need 25.0%)". That guard is right, and
      # the answer is to freeze the consumer with the producer rather than to
      # spend four GPU hours re-surveying a closed question. Unfreeze the pair
      # together, as with the ncu stages.
      frozen: true
      kind: python-script
      environment: py
      script_path: scripts/val-mileage.py
      # Joins kernel expense (nsys, whole population) against occupancy limiter
      # (ncu). Both inputs must describe one build, which is why they are taken
      # from the stages rather than the working tree; the script refuses to write
      # a table when too little device time is accounted for.
      inputs:
        - from_stage_outputs: mod-nsys
        - from_stage_outputs: export-pointwise-registers
      outputs:
        - path: results/val-mileage.json
          storage: git
    export-param-fold:
      kind: python-script
      environment: py
      script_path: scripts/export-param-fold.py
      # Reads the two profiles the pipeline already produced, so no GPU. It
      # exists because top-kernels.csv averages over a kernel name, and one of
      # the names this treatment touches covers two kernels at different
      # register counts.
      inputs:
        - scripts/export-param-fold.py
        - results/param-fold-prior.json
        - from_stage_outputs: baseline-nsys
        - from_stage_outputs: mod-nsys
      outputs:
        - path: results/param-fold.json
          storage: git

    val-params-registers:
      kind: shell-script
      environment: clima
      script_path: scripts/run-val-params-registers.sh
      # Tests whether Val reaches what const globals reach. cm-registers
      # recorded the same body at 246 registers with parameters as runtime
      # arguments and 101 as const globals, which clears two occupancy steps --
      # but const globals are not available to a model whose parameters come
      # from configuration. Val is, and folds for the same reason.
      #
      # Compile-only and standalone: CMP.Microphysics1MParams constructs without
      # a coupled simulation, so this is minutes rather than an hour.
      scheduler:
        options:
          - --gpus=1
          - --time=40
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
      inputs:
        - scripts/measure-val-params-registers.jl
        - scripts/run-val-params-registers.sh
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
      outputs:
        - path: results/val-params-registers.toml
          storage: git

    gpoint-group-sweep:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # Does the longwave g-point split need 16 groups? The default widens
      # every longwave workspace to `ncol * 16`, and that memory is the whole
      # cost of the treatment, so the default should rest on a measurement of
      # where the saving stops.
      #
      # One reservation, not four: the group count is a constructor argument,
      # so all four points are taken in one process against one settled AMIP
      # state, rebuilding only the group workspaces between them. That makes
      # them in-block comparisons -- it never differences two runs, which is
      # the only way to resolve a few percent on this machine.
      #
      # ClimaAtmos and ClimaCore sources are deliberately NOT inputs. A change
      # upstream of the radiation solve moves all four points together and so
      # cannot change which group count suffices; declaring them would re-run
      # a 40-minute GPU stage on every microphysics edit. The stack it ran
      # against is recorded in the output instead.
      scheduler:
        options:
          - --gpus=1
          - --time=75
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - scripts/measure-gpoint-sweep.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - scripts/measure-gpoint-sweep.jl
        - scripts/run-julia-script.sh
        - RRTMGP.jl-mod/src
        - RRTMGP.jl-mod/ext
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
      outputs:
        - path: results/gpoint-sweep.toml
          storage: git

    fold-compile-cost:
      kind: shell-script
      environment: clima
      script_path: scripts/run-fold-compile-cost.sh
      # What CliMA/ClimaAtmos.jl#4947's parameter fold costs in compile time.
      # The fold's benefit is registers; its price is that a runtime value in a
      # type parameter makes a specialization no pkgimage can hold, so its
      # inference and codegen are paid at every start rather than once at
      # precompile.
      #
      # One arm per process, because a compile time is only a compile time the
      # first time: two arms in one session would let the second reuse the
      # first's inference of every shared callee, which is most of the work.
      # Two repeats per arm in reversed order, so the delta can be quoted
      # against a spread rather than bare.
      #
      # Compile-only and standalone -- `cloud_parameters` and
      # `microphys_1m_parameters` both construct from a default TOML dict -- so
      # this is minutes and needs no coupled simulation.
      scheduler:
        options:
          - --gpus=1
          - --time=40
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - results/fold-compile-cost
      inputs:
        - scripts/measure-fold-compile-cost.jl
        - scripts/run-fold-compile-cost.sh
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
      outputs:
        # Four small TOMLs, one per process. Kept in Git so the arms stay
        # readable without a `calkit pull`, and so the per-repeat numbers the
        # spread is computed from are visible rather than only their mean.
        - path: results/fold-compile-cost/unfolded-1.toml
          storage: git
        - path: results/fold-compile-cost/folded-1.toml
          storage: git
        - path: results/fold-compile-cost/folded-2.toml
          storage: git
        - path: results/fold-compile-cost/unfolded-2.toml
          storage: git

    export-fold-arch-portability:
      kind: python-script
      environment: py
      script_path: scripts/export-fold-arch-portability.py
      # Does the fold still pay on a GPU that is not an A100? The cost is
      # architecture-independent; the benefit is registers buying a resident
      # block, which depends on per-architecture limits.
      #
      # The occupancy arithmetic is checked rather than trusted: the stage
      # refuses to emit predictions unless its model reproduces every
      # warps/SM this project has measured on sm_80. It also shells out to
      # nvcc and ptxas to measure how far register allocation moves between
      # targets for identical PTX, which is the scale a fold's headroom has
      # to be compared against; that part records null if the CUDA
      # toolchain is absent rather than failing the stage.
      args:
        - --out
        - results/fold-arch-portability.json
      inputs:
        - scripts/export-fold-arch-portability.py
        - results/sedimentation-fold.json
        - results/val-mileage.json
      outputs:
        - path: results/fold-arch-portability.json
          storage: git

    export-fold-compile-cost:
      kind: python-script
      environment: py
      script_path: scripts/export-fold-compile-cost.py
      # Joins the four processes into one record and tests the fold's delta
      # against the larger of the two arms' own repeat spreads. `resolved` is
      # false when it does not clear it, which is the same rule a SYPD headline
      # is held to against its null census.
      args:
        - --in-dir
        - results/fold-compile-cost
        - --out
        - results/fold-compile-cost.json
      inputs:
        - scripts/export-fold-compile-cost.py
        - results/fold-compile-cost/unfolded-1.toml
        - results/fold-compile-cost/folded-1.toml
        - results/fold-compile-cost/folded-2.toml
        - results/fold-compile-cost/unfolded-2.toml
      outputs:
        - path: results/fold-compile-cost.json
          storage: git

    cm-registers:
      # Frozen because this file cannot be regenerated on the current checkout:
      # the broadcast layers need ClimaCore.jl-mod on `pb/launch-bounds`, and
      # without it the script drops them silently (see below), which would take
      # the layer figure cited by the Val question with it.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-cm-registers.sh
      # Minutes, not an hour: compiles kernels and reads register counts rather
      # than running a simulation. Answers where the hot kernel's registers go,
      # in two halves -- the CloudMicrophysics evaluation on its own, and the
      # ClimaCore broadcast layers it runs inside.
      #
      # NOT FROZEN, BUT ONLY HALF OF IT ALWAYS RUNS. The broadcast layers are
      # read out of `ClimaCoreCUDAExt.LAUNCH_BOUNDS_CACHE`, which exists only on
      # ClimaCore.jl-mod branch `pb/launch-bounds` (PR 2601). With any other
      # ClimaCore checked out, measure-cm-registers.jl logs "ClimaCore lacks the
      # launch-bounds record; skipping the broadcast layers" and emits the
      # CloudMicrophysics layers alone -- a partial file, not a failed one. So
      # the framework half of the 163/68 decomposition is reproducible only with
      # that branch checked out, and a run without it silently drops the layers
      # rather than erroring. Check for the A-D keys before reading a comparison
      # out of this file, and see the revision caveat on the Q3 evidence entry.
      scheduler:
        options:
          - --gpus=1
          - --time=40
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
      inputs:
        - scripts/measure-cm-registers.jl
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
        - ClimaCore.jl-mod/ext
      outputs:
        - path: results/cm-registers.toml
          storage: git

    kernel-population:
      kind: python-script
      environment: py
      script_path: scripts/analyze-kernel-population.py
      # Cheap: reads the nsys SQLite exports on the login node, no GPU. Answers
      # the questions the per-kernel tables cannot -- how many kernels there are,
      # how much of the time the GPU is idle, and how much work sits in kernels
      # too small to be worth launching.
      inputs:
        - scripts/analyze-kernel-population.py
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
      outputs:
        - path: results/kernel-population.json
          storage: git

    launch-bounds-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-launch-bounds-study.sh
      # Frozen: this stage answered its question and cannot re-run here. It
      # measures ClimaCore's `__launch_bounds__` occupancy targeting, which
      # exists only on ClimaCore.jl-mod branch `pb/launch-bounds` (PR 2601,
      # commits 5428c6e2c and 45bf1792c). That branch is not checked out --
      # both ClimaCore arms currently sit at upstream main -- so
      # measure-launch-bounds.jl dies at its first reference to
      # `CUDAExt.LAUNCH_BOUNDS_TARGET_WARPS_PER_SM[]`, before it builds a
      # CoupledSimulation. The recorded TOML is not at risk (the write is far
      # downstream of that failure), but each of the three phases burns a GPU
      # on a shared node to fail the same way, which is what this flag prevents.
      #
      # To re-evaluate, check out the tag where the inputs exist:
      #   git checkout exp/2026-08-24-launch-bounds
      #   git submodule update --init --recursive
      #   calkit run launch-bounds-study
      # That tag pins ClimaCore.jl-mod at 45bf1792c. At the tag the stage is
      # not frozen and runs normally, which is what makes the recipe work.
      #
      # Unfreeze on this rev only after re-pointing ClimaCore.jl-mod at
      # `pb/launch-bounds` AND re-dev'ing it (see scripts/dev-local-repos-coupler.sh
      # -- a submodule can be checked out without reaching the run).
      frozen: true
      # Three full setup+JIT phases in one job, so the clima environment's
      # default 120 min is not enough. `env_default_options` defaults to
      # `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/launch-bounds/launch-bounds.toml
      inputs:
        - scripts/measure-launch-bounds.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/launch-bounds/launch-bounds.toml
          storage: git

    compile-time-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-compile-study.sh
      # Frozen: this stage answered its question and must not re-run here. Its
      # warmup arm needs AMIPWarmup dev'd into the AMIP environments, which
      # exists only at tag compile-time-warmup-ab -- the wiring cost a measured
      # 5.1% and was reverted. Re-running on this rev would produce a warmup arm
      # with no warmup, i.e. two identical arms overwriting the evidence with a
      # result that looks like a measurement. (measure-compile-time.jl also
      # fails hard in that case; this keeps `calkit run` from reaching it.)
      # To re-evaluate, check out the tag and run it there.
      frozen: true
      # Two full setup+JIT phases in one job (~32 min each), so the default 120
      # min from the clima environment is not enough. `env_default_options`
      # defaults to `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/compile-time/compile-time.toml
      inputs:
        - scripts/measure-compile-time.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/config/atmos_configs/climaatmos_progedmf_1m.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/compile-time/compile-time.toml
          storage: git
    build-experiment-index:
      kind: python-script
      environment: py
      script_path: scripts/build-experiment-index.py
      # Generated rather than hand-maintained, so the index cannot drift from
      # what was recorded: every row is read out of git at its `exp/*` tag.
      #
      # Depends on results/summary.json because that is what changes when a new
      # experiment is produced. Git tags are not files, so DVC cannot watch them
      # directly -- which is also why an experiment's own row appears only after
      # the tag is created and this stage is re-run.
      inputs:
        - results/summary.json
      outputs:
        - path: experiments.md
          storage: git
        - path: experiments.csv
          storage: git
