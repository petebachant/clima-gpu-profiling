owner: petebachant
name: clima-gpu-profiling
title: CliMA GPU profiling
description: Profiling GPU performance for CliMA.
git_repo_url: https://github.com/petebachant/clima-gpu-profiling

questions:
  - question: Can we improve the performance of the flagship AMIP simulation?
    answer: Probably.
    evidence:
      - kind: figure
        path: figures/sypd-time-series.png
      - kind: result
        path: results/summary.json
        key: speedup_pct
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          Top 20 GPU kernels by baseline cost, for both arms of whichever
          revision produced it. What the two arms actually were is recorded per
          run in results/treatment.json rather than here, so this description
          cannot go stale against the data: on a null-test revision the
          kernel-by-kernel spread measures run-to-run variation, and on a
          treatment revision it measures the treatment. Spill counts are not
          collected by nsys; see results/kernel-resources.csv and results/ncu/
          for those.

  - question: >-
      Which changes actually improve AMIP performance, by how much, and how do
      we know a result is real rather than run-to-run variation?
    answer: >-
      Two changes have produced real gains, and they are complements rather than
      alternatives. The CloudMicrophysics register-pressure work is worth ~5% on
      its own: it removes the spilling in the hot
      set_microphysics_tendency_cache kernel. ClimaCore's automatic per-kernel
      register cap is worth ~0.1% on its own -- indistinguishable from zero --
      because with stock CloudMicrophysics that kernel already spills at its
      natural register count, so the cap declines to touch it. Together they are
      worth ~9%: the CloudMicrophysics change creates the register headroom, and
      the ClimaCore cap converts it into occupancy. Neither substitutes for the
      other, and the combination beats the sum of the parts.

      The noise floor is much tighter than previously assumed. Four runs in
      which both arms were byte-identical (null tests) landed at -0.43%, -0.09%,
      -0.06% and +0.21%, so run-to-run variation is a few tenths of a percent,
      not the +/-2% this project worked to for months. Differences of ~0.5% are
      therefore measurable, and results in that range should no longer be
      dismissed as noise.
    # Long-form account of this answer; the entrypoint stays short.
    explanation: docs/learnings.md
    evidence:
      - kind: table
        path: experiments.csv
        explanation: >-
          Every recorded experiment in this project's history, generated from
          `exp/*` git tags by scripts/build-experiment-index.py. Each row is read
          out of git at the tagged commit rather than maintained by hand, so the
          index cannot drift from what was recorded, and any row can be
          reproduced with `git checkout <commit> && git submodule update
          --init --recursive && calkit run`. The `treatment` column comes from
          results/treatment.json, which records what actually reached the run --
          which packages each arm dev'd, whether any tree was dirty -- rather
          than what a commit message claims. Rows marked "null test (arms
          identical)" are the noise-floor measurements; rows marked
          "unrecorded" predate that file.
      - kind: result
        path: results/summary.json
        key: speedup_pct

  - question: >-
      What actually limits the hot SGS-quadrature microphysics kernel -- the
      largest single kernel at ~16% of GPU time -- and which of the available
      levers can move it?
    answer: >-
      It is latency-bound at 12.5% occupancy, held there by register pressure,
      and NOT by any of the things the usual GPU playbook targets: DRAM sits at
      4.7%, there are ~1.55M independent points, and no pipe exceeds ~27%. The
      dominant stall is fixed-latency execution dependency (42% of the cycles
      between issued instructions) and IPC is 1.34 of 4.

      The quadrature scaffolding is NOT what costs the registers: the unfused
      single-call kernel uses 246 against the nine-point kernel's 255, so the
      `@noinline` barrier holds and nine evaluations cost 9 registers more than
      one. On sm_80 the occupancy steps are 255 -> 8 warps/SM, 168 -> 12,
      128 -> 16, so nothing saving 9 registers can move occupancy.

      Where the 246 DO come from is open, and an earlier reading of that same
      comparison -- that they are one indivisible CloudMicrophysics evaluation --
      is not supported by it: 246-vs-255 separates the quadrature loop from
      everything else, not the physics from the framework. Compiling the layers
      of one 1M evaluation standalone puts the source terms at 32 registers, one
      linearized implicit step at 58, and the full LinearizedAverage at 101 --
      independent of the substep count. If that survives passing the parameter
      structs as runtime arguments rather than constants, then most of the 246 is
      framework rather than physics, which would move this from a
      CloudMicrophysics problem to a ClimaCore one.

      The lever that works is asking ptxas for an occupancy target via
      `__launch_bounds__` rather than capping registers with `maxregs`: a hard
      cap makes it spill whatever does not fit, which is why the earlier
      register-cap experiments landed at +0.43% and -5.51%. Measured at a 12
      warps/SM target, the single-call kernel goes 246 -> 168 registers, 8 -> 12
      warps/SM for +88 bytes of spill, and -22% in time; total CUDA kernel time
      falls 2.11%.

      OCCUPANCY IS A DEAD END FOR THE HOT KERNEL ITSELF. ptxas can reach 168
      registers on it, but only at +344 bytes of spill, and it then runs 17.5%
      SLOWER (31.63 vs 26.92 ms). The spill-growth guard that rejects it is
      therefore load-bearing: unguarded, the change is net negative, since the
      hot kernel is 16% of GPU time against the 2.3% that benefits.

      AND THE GAIN DOES NOT REACH SYPD. The same treatment measured -0.016% end
      to end -- indistinguishable from zero -- because the benchmark's measured
      window is short and dominated by first-call compilation, so a change that
      only makes compiled kernels faster has little room to show. A tight noise
      floor is not the same as sensitivity. To move SYPD by 5% requires removing
      WORK, not rescheduling it; the binding constraint is 9 quadrature points x
      2 substeps = 18 CloudMicrophysics evaluations per grid point per call,
      which is a modelling choice rather than a compiler outcome.

      docs/learnings.md carries the rest: the cost model that splits the kernel
      into ~52% fixed and ~48% substep work, the decompositions that were
      measured and rejected (splitting per quadrature point, fusing the scratch
      fields, unrolling the quadrature loop), why fast math is excluded on
      reproducibility rather than performance grounds, the host-side launch
      overhead that a first implementation of this mechanism introduced, and the
      ranked list of remaining levers.
    # Long-form account of this answer; the entrypoint stays short.
    explanation: docs/learnings.md
    evidence:
      - kind: result
        path: results/cm-registers.toml
        key: layers.LinearizedAverage nsub=2.registers
        explanation: >-
          A full 1M CloudMicrophysics evaluation compiles to 163 registers -- 12
          warps/SM, i.e. it clears the 168 threshold on its own -- against the
          246 of the real single-call kernel. So roughly 83 registers come from
          outside CloudMicrophysics: the ClimaAtmos evaluator, the quadrature
          accumulators, and ClimaCore's broadcast and data-layout access. Not all
          of that is waste, since the real kernel genuinely reads about twelve
          fields that this one does not. The layer breakdown (source terms 32,
          one linearized implicit step 58) also shows the substep count is free:
          163 at nsub 1, 2 and 3 alike, so microphysics_n_substeps_quadrature
          costs time but not occupancy. Regenerated by the `cm-registers` stage
          in minutes rather than the ~45 an AMIP stage takes.
      - kind: result
        path: results/kernel-population.json
        key: baseline.gpu_idle_pct
        explanation: >-
          The GPU is idle 30.9% of the profiled span, and 57.6% of launches are
          under 25 microseconds while accounting for only 13.4% of kernel time.
          Both are regenerated by the `kernel-population` stage from the nsys
          SQLite exports, so they track whatever the arms currently are. This is
          the half of the waste that occupancy work does not touch, and idle time
          converts to wall clock far more directly than kernel time does.
      - kind: table
        path: results/kernel-resources.csv
        explanation: >-
          Registers, spill requests and their share of memory traffic, stack
          frame, block-limit-registers, and achieved vs theoretical occupancy
          for the profiled microphysics kernels. This is what establishes the
          kernel as register-limited rather than memory-limited, and the
          register figures are what the occupancy-step arithmetic above is
          computed from. Pipe utilisation and stall-reason breakdowns are not in
          this table; they come from the full Nsight Compute report, exported
          via `ncu --import results/ncu/baseline.ncu-rep --page raw --csv`.

          STALE BY DESIGN. The ncu stages that produce this are frozen because
          they cost more than the rest of the pipeline combined, so this table
          describes whichever revision last ran them -- not necessarily the
          current arms. results/treatment.json at that revision records which
          those were. It is cited here for the CHARACTERISATION of the hot
          kernel (register-limited, ~12.5% occupancy, spilling at the 255-register
          cap), which is a property of the baseline kernel and has been stable
          across revisions; it is NOT evidence for any particular treatment's
          effect. Unfreeze both ncu stages together when a claim needs measured
          spill or achieved occupancy for the current arms.
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          Supplies the comparison that pins the register cost on
          CloudMicrophysics rather than on the quadrature: the single-call
          updraft kernel and the nine-point environment kernel appear as
          separate rows with their own register counts and total times, so
          per-evaluation cost can be read off both. Figures are deliberately not
          quoted in this description so it cannot go stale against the data.
      - kind: result
        path: results/launch-bounds/launch-bounds.toml
        key: off.kernels.L1013.mean_ms
        explanation: >-
          The reference every other phase is read against: the hot
          SGS-quadrature kernel with launch bounds disabled, which is what the
          baseline arm runs. Measured in its own process, so the configuration
          is set at ClimaCore load time exactly as a real run sets it.
      - kind: result
        path: results/launch-bounds/launch-bounds.toml
        key: unguarded.kernels.L1013.mean_ms
        explanation: >-
          The counterfactual, and the reason this stage exists. With the spill
          budget loosened until the annotation is accepted, L1013 reaches 168
          registers and 12 warps/SM and gets SLOWER. A rejected configuration
          never appears in an ordinary profiling run, so without this phase the
          spill guard would look like an arbitrary constant instead of the part
          that keeps the change from being net negative. Compare against
          off.kernels.L1013.mean_ms.
      - kind: result
        path: results/launch-bounds/launch-bounds.toml
        key: guarded.kernels.L970.mean_ms
        explanation: >-
          The gain, in the shipped configuration: the single-call microphysics
          kernel annotated at 12 warps/SM for a small spill cost. Compare
          against off.kernels.L970.mean_ms. The `guarded.decisions` array in the
          same file records, per kernel, the registers and occupancy with and
          without the annotation, the spill growth, and whether it was accepted
          -- which is what distinguishes this kernel's outcome from L1013's.
      - kind: result
        path: results/summary.json
        key: speedup_pct
        explanation: >-
          The pipeline-level number this kernel work has to show up in
          eventually. Kernel times are not SYPD: this stage establishes the
          mechanism, and only the profiling and AMIP stages can say what it is
          worth end to end.

  - question: >-
      How much of a GPU profiling job is compilation rather than computation,
      and can any caching strategy recover it between jobs?
    hypothesis: >-
      Two successive hypotheses, both recorded here because both were tested and
      both failed.

      (1) Disk cache. Most of a profiling job is compilation, and a large share
      of that is GPU kernel compilation thrown away at process exit. An
      nsys stage takes ~40 minutes to produce ~1.8 s of measured stepping (30
      coupler steps of NVTX-ranged time), and of the remainder only ~112 s is
      Pkg.precompile and ~2 s is nsys post-processing. Julia caches host native
      code across processes via pkgimages, but GPU kernels are compiled by
      GPUCompiler at run time and discarded unless its `disk_cache` preference
      is set -- and it defaults to "false" and is unset in every environment
      here. If that accounts for a large fraction of the ~34 minutes of setup
      and first-call compilation, enabling the cache should cut it sharply on
      any job whose kernels have not changed, because the cache is keyed on the
      CodeInstance and CompilerConfig and so invalidates only what changed.

      (2) Warmup package. Given (1) failed and the cost turned out to be
      host-side JIT, a local package (AMIPWarmup) carrying a PrecompileTools
      workload should recover it. Julia caches native code into a *package's*
      precompile image, and the AMIP experiment is a script, so none of that
      work is kept today. A --trace-compile of a real job shows 89.4% of
      runtime-compiled methods involve ClimaCore (ClimaAtmos 0.8%,
      CloudMicrophysics 0.4%), so a workload building an AMIP-shaped ClimaCore
      grid and exercising its operators should cover the bulk of it -- while
      depending on neither package under active edit here, so ordinary work does
      not invalidate the cache.
    answer: >-
      Compilation is ~88% of the job and it is host-side Julia JIT, not GPU
      kernel compilation. That share is highly reproducible: 88.3/88.2/88.4%
      across the three disk-cache phases and 88.6/88.7% across the two warmup
      phases, for a job that yields 0.6 s of steady-state stepping.

      Neither caching strategy recovered any of it.

      (1) GPUCompiler's on-disk kernel cache is a no-op in this stack. The
      cache_warm phase was 2.2% faster than cache_off, but cache_cold -- which
      does strictly more work, populating the cache -- was faster than both, so
      that spread is noise. Direct diagnosis then showed why: with the
      preference set, GPUCompiler.disk_cache_enabled() correctly returns true,
      yet compiling a kernel leaves 0 files in disk_cache_path(). It cannot help
      regardless of how much GPU compilation exists (Julia 1.11.5 / CUDA.jl
      Wfi8S / GPUCompiler Yuvf5). Two candidate causes are visible in
      GPUCompiler's `actual_compilation` -- a `nothing` CodeInstance bypasses
      both the disk read and the write, or `cache_file` bails on its build-id
      sentinel -- but which applies is not established.

      (2) The AMIPWarmup PrecompileTools package made the job SLOWER: 1930.8 s
      with it against 1836.4 s without, +94.4 s (+5.1%), both phases in one job
      on one GPU (device 4), with "AMIPWarmup loaded" confirming the arm was
      real. The penalty sits in CoupledSimulation (+78.6 s), precisely the phase
      it was built to speed up. This was not a null result but a negative one.

      The package does work in isolation -- loading it cuts an equivalent grid
      build 45.4 -> 32.4 s and a first operator call 10.2 -> 1.8 s -- which is
      the trap: ~21 s of provable saving is ~1% of a 1836 s job, so the ceiling
      was inside the noise before the package was ever built. Doing that
      arithmetic first would have been cheaper than the experiment. Why loading
      it costs 94 s rather than saving 21 is not established; the leading
      candidate is invalidation, since AMIPWarmup is precompiled against
      ClimaCore alone and the coupler then loads packages that add methods to
      it, discarding the cached code while still paying to load it.

      What remains, none yet tested: reduced-resolution configs so setup and JIT
      shrink together (attacks the 88% directly rather than caching it); a
      PrecompileTools workload inside ClimaAtmos/ClimaCore themselves, where it
      is not exposed to cross-package invalidation; or accepting the cycle time
      and batching experiments. Caching the compile work from outside the
      package stack has now failed twice, in two different ways.

      REPRODUCING THIS RESULT. The measurement depends on state that is reverted
      immediately after it was taken: AMIPWarmup is dev'd into both AMIP
      environments and imported by scripts/run.jl, and keeping that wiring would
      impose a measured ~5% penalty on every future profiling job. The state is
      therefore frozen at the git tag `compile-time-warmup-ab`, which is
      the only rev where this stage's inputs exist. To re-evaluate:

        git checkout compile-time-warmup-ab
        git submodule update --init --recursive   # the wiring lives in the
                                                  # coupler submodules
        calkit run compile-time-study

      On main the stage is marked `frozen: true`, so `calkit run` leaves it and
      its result alone; at the tag it is not frozen and runs normally, which is
      what makes the recipe above work.

      Rewinding this clone in place is the supported path. The coupler manifests
      record AMIPWarmup by ABSOLUTE path
      (/home/pbachant/calkit/clima-gpu-profiling/AMIPWarmup), so in a worktree
      checked out elsewhere that entry resolves back to the original clone rather
      than to the worktree's own copy -- re-point it with
      Pkg.develop(path="<worktree>/AMIPWarmup") in both experiments/AMIP
      environments before running, or the run either fails in instantiate or
      silently measures whichever AMIPWarmup happens to sit at the old path.

      At this rev the four profiling stages (baseline-nsys, mod-nsys,
      amip-baseline, amip-mod) are intentionally stale. The wiring under test is
      an input to all four, and it was never run through them precisely because
      this result says it should not be. Their evidence belongs to the SYPD
      question above and to the revs that answered it, not to this one.
    evidence:
      - kind: result
        path: results/compile-time/compile-time.toml
        key: warmup_off.totals.wall_s
        explanation: >-
          Frozen at git tag `compile-time-warmup-ab`; see the answer for
          how to re-run it, and note that the state it measures does not exist on
          main by design.

          Status quo, and the reference the whole study rests on. Wall time for
          code loading, simulation construction, and two steps without the
          warmup package. Lands within ~5% of the same measurement taken
          standalone weeks earlier, so the harness is measuring the same job it
          did before.
      - kind: result
        path: results/compile-time/compile-time.toml
        key: warmup_on.totals.wall_s
        explanation: >-
          The test. Identical code and config, with AMIPWarmup imported first so
          its precompiled ClimaCore specializations are available. Higher than
          warmup_off, which is the negative result. Both phases run in one SLURM
          job on one GPU so the comparison is not confounded by node or device
          variance, and warmup_on runs second -- the ordering that would flatter
          it, if anything, via warmed filesystem caches.
      - kind: result
        path: results/compile-time/compile-time.toml
        key: warmup_on.coupled_simulation.wall_s
        explanation: >-
          Where the penalty is. Simulation construction is 78.6 s of the 94.4 s
          regression and is the phase AMIPWarmup targets, so the cost is not
          merely the price of loading an extra package -- it lands inside the
          work that was supposed to get cheaper.
      - kind: result
        path: results/compile-time/compile-time.toml
        key: warmup_off.totals.host_compile_s
        explanation: >-
          Host-side JIT only, from Julia's own `@timed` compile_time accounting;
          1628.0 s of the 1836.4 s job. GPU kernel compilation is NOT counted
          here because GPUCompiler runs outside that accounting. This is what
          establishes the cost as host-side and so rules out the entire class of
          GPU-kernel-caching fixes, independently of the disk cache being broken.
      - kind: result
        path: results/compile-time/compile-time.toml
        key: warmup_off.second_step.wall_s
        explanation: >-
          Steady-state cost of one step once everything is compiled. Bounds how
          much of the first step was genuinely compute rather than compilation,
          and is the 0.6 s that the surrounding ~1836 s exists to produce.

tables:
  - path: results/top-kernels.csv
    title: Top 20 GPU kernels, baseline vs. mod
    description: >-
      Per-kernel Nsight Systems aggregates for the top 20 kernels ranked by
      baseline total time, covering both the baseline and modified runs:
      invocation counts, total and mean duration, share of total GPU time,
      registers per thread, and the percent change in total time.

  - path: results/kernel-resources.csv
    title: Per-kernel register, spill, and occupancy stats
    description: >-
      Nsight Compute resource metrics for the profiled microphysics kernels,
      baseline vs. mod: registers per thread, register spilling (requests and
      the share of memory traffic they cost), stack frame, and achieved vs.
      theoretical occupancy.

      This exists because the nsys table above cannot show the mechanism behind
      the headline speedup. The hot kernel can sit pinned at the 255-register
      cap in BOTH cases, so by the columns nsys collects nothing changed at all,
      while its total time falls by half. Registers at the cap is not the same
      thing as spilling, and nsys does not collect spill metrics -- only Nsight
      Compute does. Specific figures are deliberately left to the table rather
      than quoted here, so this description cannot go stale against the data it
      describes.

environments:
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_options:
      - --gpus=1
      - --time=120
  sassy:
    kind: system
    host: sassy.caltech.edu
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.13"

pipeline:
  stages:
    record-treatment:
      kind: python-script
      environment: py
      script_path: scripts/record-treatment.py
      # What actually ran, as opposed to what a commit message says ran. A
      # superproject commit pins every submodule SHA, but not whether a package
      # was dev'd into the AMIP environments (a submodule can be checked out and
      # irrelevant), nor whether a tree was dirty, nor which CLIMA_* variables
      # the stages exported. Each of those has changed the meaning of a result
      # in this project at least once.
      #
      # Depends on diffs/ rather than the submodules directly, so it re-runs
      # after make-diffs has observed the same state, and cannot disagree with
      # the archived diff.
      inputs:
        - from_stage_outputs: make-diffs
        - calkit.yaml
      outputs:
        - path: results/treatment.json
          storage: git
    make-diffs:
      kind: shell-script
      environment: _system
      script_path: scripts/make-diffs.sh
      inputs:
        - ClimaCoupler.jl
        - ClimaCoupler.jl-mod
        - ClimaCore.jl
        - ClimaCore.jl-mod
        - ClimaAtmos.jl
        - ClimaAtmos.jl-mod
        - CloudMicrophysics.jl-mod
      outputs:
        - path: diffs
          storage: git
    baseline-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/baseline
        - ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/nsys/baseline.nsys-rep
        - results/nsys/baseline.sqlite
    mod-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/nsys/mod
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        - ClimaAtmos.jl-mod/config
      outputs:
        - results/nsys/mod.nsys-rep
        - results/nsys/mod.sqlite
    baseline-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
      # describes.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      args:
        - results/ncu/baseline
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the baseline tree. It
        # also matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl/experiments/AMIP
        - --config
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/ncu/baseline.ncu-rep
        - path: results/ncu/baseline-details.csv
          storage: git
          delete_before_run: true
    mod-ncu:
      # Frozen: ncu is the most expensive thing in this pipeline by a wide
      # margin -- ~1h20m to ~1h40m per arm against ~45-55 min for an nsys or
      # AMIP stage, so the two ncu stages alone are over half the pipeline's
      # cluster time. Most treatments do not need it. nsys already reports
      # registers per thread per kernel (see results/top-kernels.csv), and the
      # launch-bounds-study stage records registers, target occupancy and spill
      # growth directly from the CUDA profiler. What ONLY ncu provides is
      # measured spill traffic, stack frame, achieved-vs-theoretical occupancy
      # and stall reasons.
      #
      # Unfreeze deliberately, for a treatment whose claim actually rests on
      # those: set `frozen: false` here and in the sibling ncu stage (both, so
      # the two arms describe the same revision), run `calkit run`, then freeze
      # again. results/treatment.json records which arms the current evidence
      # describes.
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - results/ncu/mod
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the mod tree. It also
        # matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_mod_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl-mod/experiments/AMIP
        - --config
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        - results/ncu/mod.ncu-rep
        - path: results/ncu/mod-details.csv
          storage: git
          delete_before_run: true
    amip-baseline:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      args:
        - --project=ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - --config_file
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --job_id
        - gpu_amip_progedmf_1M_land_he16_baseline
      inputs:
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
        - ClimaAtmos.jl/toml
    amip-mod:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      # ClimaCore's automatic per-kernel register cap, the treatment under test.
      # `env_default_options` defaults to `replace`, so the clima environment's
      # --gpus=1 and --time=120 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=120
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/experiments/AMIP/run_simulation.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --job_id
        - gpu_amip_progedmf_1M_land_he16_mod
      inputs:
        - ClimaCoupler.jl-mod/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        - ClimaAtmos.jl-mod/toml
        - ClimaAtmos.jl-mod/config
    summarize:
      kind: python-script
      environment: py
      script_path: scripts/summarize.py
      inputs:
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: results/summary.json
          storage: git
    compare-kernels:
      kind: jupyter-notebook
      notebook_path: notebooks/compare-kernels.ipynb
      environment: py
      inputs:
        - from_stage_outputs: baseline-nsys
        - from_stage_outputs: mod-nsys
      outputs:
        - path: results/top-kernels.csv
          storage: git
      html_storage: git
      executed_ipynb_storage: git
    export-kernel-resources:
      kind: python-script
      environment: py
      script_path: scripts/export-kernel-resources.py
      # Reads the CSVs Nsight Compute already exported, so this needs no GPU and
      # is not frozen alongside the ncu stages that produce them.
      inputs:
        - from_stage_outputs: baseline-ncu
        - from_stage_outputs: mod-ncu
      outputs:
        - path: results/kernel-resources.csv
          storage: git
    cm-registers:
      kind: shell-script
      environment: clima
      script_path: scripts/run-cm-registers.sh
      # Minutes, not an hour: compiles kernels and reads register counts rather
      # than running a simulation. Answers where the hot kernel's registers go --
      # the microphysics itself, or the framework wrapped around it.
      scheduler:
        options:
          - --gpus=1
          - --time=40
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
      inputs:
        - scripts/measure-cm-registers.jl
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaAtmos.jl-mod/src
      outputs:
        - path: results/cm-registers.toml
          storage: git

    kernel-population:
      kind: python-script
      environment: py
      script_path: scripts/analyze-kernel-population.py
      # Cheap: reads the nsys SQLite exports on the login node, no GPU. Answers
      # the questions the per-kernel tables cannot -- how many kernels there are,
      # how much of the time the GPU is idle, and how much work sits in kernels
      # too small to be worth launching.
      inputs:
        - scripts/analyze-kernel-population.py
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
      outputs:
        - path: results/kernel-population.json
          storage: git

    launch-bounds-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-launch-bounds-study.sh
      # Three full setup+JIT phases in one job, so the clima environment's
      # default 120 min is not enough. `env_default_options` defaults to
      # `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/launch-bounds/launch-bounds.toml
      inputs:
        - scripts/measure-launch-bounds.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/launch-bounds/launch-bounds.toml
          storage: git

    compile-time-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-compile-study.sh
      # Frozen: this stage answered its question and must not re-run here. Its
      # warmup arm needs AMIPWarmup dev'd into the AMIP environments, which
      # exists only at tag compile-time-warmup-ab -- the wiring cost a measured
      # 5.1% and was reverted. Re-running on this rev would produce a warmup arm
      # with no warmup, i.e. two identical arms overwriting the evidence with a
      # result that looks like a measurement. (measure-compile-time.jl also
      # fails hard in that case; this keeps `calkit run` from reaching it.)
      # To re-evaluate, check out the tag and run it there.
      frozen: true
      # Two full setup+JIT phases in one job (~32 min each), so the default 120
      # min from the clima environment is not enough. `env_default_options`
      # defaults to `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/compile-time/compile-time.toml
      inputs:
        - scripts/measure-compile-time.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/compile-time/compile-time.toml
          storage: git
    build-experiment-index:
      kind: python-script
      environment: py
      script_path: scripts/build-experiment-index.py
      # Generated rather than hand-maintained, so the index cannot drift from
      # what was recorded: every row is read out of git at its `exp/*` tag.
      #
      # Depends on results/summary.json because that is what changes when a new
      # experiment is produced. Git tags are not files, so DVC cannot watch them
      # directly -- which is also why an experiment's own row appears only after
      # the tag is created and this stage is re-run.
      inputs:
        - results/summary.json
      outputs:
        - path: experiments.md
          storage: git
        - path: experiments.csv
          storage: git
    analyze-logs:
      kind: jupyter-notebook
      notebook_path: notebooks/analyze-logs.ipynb
      environment: py
      inputs:
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: figures/sypd-time-series.png
          storage: git
      html_storage: git
      executed_ipynb_storage: git

showcase:
  - notebook: notebooks/analyze-logs.ipynb
