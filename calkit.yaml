owner: petebachant
name: clima-gpu-profiling
title: CliMA GPU profiling
description: Profiling GPU performance for CliMA.
git_repo_url: https://github.com/petebachant/clima-gpu-profiling

questions:
  # An answer is the claim and nothing else: one or two sentences, with only the
  # figures it actually quotes templated by name from a results file. The
  # reasoning, the cautions and the rest of the numbers live in a document under
  # docs/, cited as `kind: document` evidence -- which calkit requires a pipeline
  # stage to build, so the prose cannot drift from the results any more than an
  # answer can.
  #
  # Numbers are templated by name rather than typed -- but ONLY where the cited
  # file is the same artifact in the working tree as at the pin, because
  # rendering reads the working tree and ignores git_ref. A pinned citation of a
  # regenerated artifact such as results/summary.json must therefore NOT be
  # templated: it would render whichever run wrote that file last.
  - question: >-
      How much of a GPU kernel-time saving actually reaches SYPD?
    answer: >-
      Kernel shape decides it rather than subsystem: a saving concentrated in a few long dense launches converts at about {radiation_mean:.0f}% of its kernel time, one spread over hundreds of small launches per step at about {microphysics_min:.0f}%.
      The parameter fold is the test that distinguishes them -- microphysics work whose saving sits in one kernel of a few long launches, converting at {microphysics_max:.0f}%, inside the radiation range.
    evidence:
      - kind: document
        path: docs/pass-through.md
        section: Subsystem is the wrong label; kernel shape is the right one
        explanation: >-
          How the bands were built, why the fold's two measurements widened the
          microphysics one from a cluster into a spread, and the cautions on
          reading either of them to the point. Built by the pass-through-doc
          stage from the same results files cited below, so its figures cannot
          drift from them.
      - kind: result
        path: results/pass-through.json
        values:
          radiation_mean: by_subsystem.radiation.mean_pct
          microphysics_min: by_subsystem.microphysics.min_pct
          microphysics_max: by_subsystem.microphysics.max_pct
        explanation: >-
          Both subsystems' conversion ratios, as mean, range and sample count.
          Each ratio is an end-to-end SYPD gain divided by the GPU kernel-time
          reduction that produced it, and the pass-through stage reads both
          halves out of the experiment tags with git show rather than from the
          working tree.
      - kind: result
        path: results/fold-record/param-fold.json
        explanation: >-
          The shape of the kernel the fold saved its time in, which is what the
          reframing rests on: a few long dense launches behave like radiation,
          thousands of small ones per step behave like the two fusion
          experiments. The figures are the baseline arm's, i.e. the kernel
          without the fold -- which is no longer a stack anyone can run, since
          ClimaAtmos main now carries the fold, so they are read out of the
          snapshot of the measurement's tag rather than the live file.
      - kind: table
        path: experiments.csv
        explanation: >-
          The experiments themselves, each reproducible from its tag. The
          pass-through stage reads both halves of every ratio out of those
          tags with git show rather than from the working tree.

  - question: >-
      Does putting the parameters in `Val` make pointwise kernels measurably faster across the board, as CliMA/ClimaCore.jl#2676 asks?
    answer: >-
      Not across the board: {mileage_ceiling:.2f}% of device time sits in kernels where a register saving could raise occupancy at all, and after the four kernels this project has already folded, {mileage_untreated:.2f}% over {mileage_untreated_n:.0f} kernels is what remains for anyone applying the pattern somewhere new.
      Where it does bite it is large, and two gates decide it -- distance to the next occupancy step and share of the device -- both of which can be computed before any code is written.
    evidence:
      - kind: document
        path: docs/val-fold-scope.md
        section: Two gates, both computable in advance
        # Downstream of the frozen register stages, so it cannot be rebuilt on
        # main; pinned to the commit where it last matched them.
        git_ref: 1061496
        explanation: >-
          The four kernels the pattern was applied to as the profiled runs
          compiled them, the control among them that crossed no occupancy step,
          why register count predicts neither gate, and the compile-only probes
          that settle the mechanism. Built by the val-fold-scope-doc stage from
          the results files cited below, two of which are TOML that a value
          marker cannot read directly.
      - kind: result
        path: results/val-mileage.json
        # Downstream of the frozen val-mileage stage, which cannot be rebuilt on
        # main; pinned to the pass where it was last measured against its own arms.
        git_ref: meas/2026-11-03-two-prs-rebaselined
        values:
          mileage_ceiling: ceiling_pct_of_device
          mileage_untreated: untreated_pct_of_device
          mileage_untreated_n: untreated_kernels
        explanation: >-
          The question asked in units of time rather than kernels, which is what
          SYPD is made of: a hundred addressable kernels holding 2% of the device
          are worth less than one unaddressable kernel holding 20%. Expense comes
          from the nsys profile, which times every kernel in the window;
          addressability from the ncu static pass, which records each kernel's
          occupancy limiter. The join is keyed on name, registers AND block size,
          because one kernel name covers several compiled specializations --
          keying on name alone collapsed the ClimaCore broadcast kernel's 42
          variants into one row and produced a ceiling more than twice this.
          It is an upper bound and nothing more: being addressable means a
          register saving COULD buy a block per SM, not that folding parameters
          sheds enough registers or that a block per SM is worth anything.
      - kind: result
        path: results/val-params-registers.toml
        explanation: >-
          One microphysics body compiled several ways -- parameters as runtime
          arguments, as const globals, and folded through Val -- for an isolated
          evaluation and for the quadrature path the model calls. The const-global
          column is the target, so Val matching it is the mechanism working rather
          than a coincidence. Compile-only with `CUDA.@cuda launch=false`, so
          nothing executes, and standalone, so it needs no coupled simulation:
          the stage is minutes.
      - kind: result
        path: results/pointwise-registers.json
        # Output of the frozen export-pointwise-registers stage; pinned to the pass
        # whose device time its population was surveyed against.
        git_ref: meas/2026-11-03-two-prs-rebaselined
        explanation: >-
          The population the question asks about, measured rather than
          extrapolated: for every kernel in a 120-step run, its registers and
          which of the four occupancy limits binds. Static launch metrics only,
          so ncu needs no kernel replay and the whole population costs one job
          instead of the ninety minutes per six kernels that the frozen --set
          full stages cost. results/pointwise-registers.csv has the per-kernel
          rows behind it, including which kernels sit at the cap.
      - kind: result
        path: results/fold-record/param-fold.json
        explanation: >-
          The four kernels the pattern was applied to, as the profiled runs
          compiled them: registers per thread, the block size ClimaCore chose
          from them, the warps per SM the pair allows, and the time. This is what
          makes the answer an in-model result rather than a compile-only one --
          and the SGS-moments row is the control the other three need, since it
          had the fold applied the same way and did not cross a step. Read from
          the nsys databases rather than results/top-kernels.csv, which averages
          over a kernel name that here covers two kernels at different register
          counts. Read out of results/fold-record/, a verbatim copy of the
          measurement's tag that scripts/snapshot-tag-records.py re-makes on
          every pass, since ClimaAtmos main now carries the fold and the live
          file describes a null test.
      - kind: result
        path: results/cm-registers.toml
        git_ref: 64436aa
        explanation: >-
          Why a layer compiled on its own misleads: it has room for a payload
          saving to appear in its register count, where the broadcast the model
          runs is split into several smaller kernels whose limits differ. Pinned
          because the stage is frozen -- the broadcast layers need
          ClimaCore.jl-mod on `pb/launch-bounds` and a run without that branch
          drops them silently -- so this is the revision where the figures were
          measured rather than whatever main holds.

  - question: >-
      Is it worth spreading the `Val(params)` pattern into Thermodynamics and CloudMicrophysics, as CliMA/ClimaCore.jl#2694 asks?
    answer: >-
      No: wrapping the parameters at the ClimaAtmos call site already takes the microphysics body to {val_const:.0f} registers, exactly what compile-time const globals reach, and const globals are the ceiling of any constant-folding scheme -- so no change inside CloudMicrophysics can beat what the caller already gets.
      Thermodynamics never paid for its parameters in the first place: the call compiles to {td_args:.0f} registers as a runtime argument, as a const global and through `Val` alike.
    evidence:
      - kind: document
        path: docs/val-fold-scope.md
        section: Pushing the pattern into the dependencies
        # Downstream of the frozen register stages, so it cannot be rebuilt on
        # main; pinned to the commit where it last matched them.
        git_ref: 1061496
        explanation: >-
          Why the const-global ceiling settles CloudMicrophysics by measurement
          rather than argument, why the quadrature path has no target for a
          deeper fold either, what device budget is left to aim at, and the
          Thermodynamics prediction that was recorded before the run.
      - kind: result
        path: results/val-params-registers.toml
        values:
          val_const: const_globals.registers
          td_args: td_runtime_arguments.registers
        explanation: >-
          The three ways a parameter set can reach a kernel, compiled on the
          CloudMicrophysics body, on the quadrature path that calls it, and on
          the Thermodynamics call that path makes. The const-global column is
          what makes this an answer about the dependency rather than about Val:
          it is the best any constant-folding scheme can do, reachable only
          because the harness is standalone, and a dependency change cannot go
          past it. Compile-only with `CUDA.@cuda launch=false`, so nothing
          executes.
      - kind: result
        path: results/val-mileage.json
        # Same frozen stage as above, cited here for the untreated remainder.
        git_ref: meas/2026-11-03-two-prs-rebaselined
        explanation: >-
          What is left to aim at, in device time rather than kernel counts. A
          dependency-wide change has to pay for itself out of this, and the
          figure to compare it against is the untreated remainder, not the
          ceiling: the ceiling's two largest entries are the kernels this
          project has already folded from the ClimaAtmos side.

  - question: >-
      A kernel optimization saves N ms of device time on every step. How much wall clock does it return?
    answer: >-
      Essentially all of it once the benchmark resembles the run you care about -- the typical step converts {conversion:.0f}% of the device saving and the window total shows no shortfall against it -- and a fraction of it on a benchmark whose periodic work dominates the wall clock, which is a property of the benchmark rather than of the optimization.
      What limits the answer now is the floor rather than the conversion: {repeat_n} repeats of one pair agree within {repeat_spread:.2f} points while the {null_n:.0f} null tests between identical arms average {null_mean:.2f}% and never change sign, and neither run order nor GPU assignment explains the gap.
    evidence:
      - kind: document
        path: docs/wall-clock-conversion.md
        section: "What kind of floor: repeats, run order and GPU assignment"
        explanation: >-
          The step-by-step conversion, the benchmark that hid it, the four
          wall-clock measurements of the null test against the device chain's
          agreement that it is zero, the pre-registered order test, the GPU
          assignment recovered from the record, and the census of every null
          test in this repository's history. Built by the
          wall-clock-conversion-doc stage from the results files cited below.
      - kind: result
        path: results/fold-record/step-comparison.json
        values:
          conversion: typical_step.conversion_pct
        explanation: >-
          Paired per-step wall clock from the two unprofiled arms on the same
          config, so step index i is the same work in both and the difference is
          a paired one rather than a comparison of aggregates. The typical-step
          figure is the MEDIAN paired difference, not the mean: the mean is
          lower by exactly the compilation penalty the document decomposes, so
          quoting the mean would hide the effect inside the headline. The device
          prediction comes from results/fold-record/param-fold.json, the
          subtotal over the four folded kernels divided by the profiled window,
          so the comparison is device saving against wall-clock saving for one
          treatment.
      - kind: result
        path: results/fold-record/summary.json
        explanation: >-
          The end-to-end figures, from the two unprofiled AMIP arms rather than
          the step-breakdown pair. They are cited because
          CliMA/ClimaAtmos.jl#4879 quotes them, and a figure a PR body quotes
          has to be one the pipeline checks. `speedup_pct` is a reduction in
          wall clock and the two `sypd` values are a throughput ratio; they
          describe the same treatment and are not interchangeable. Read out of
          results/fold-record/, which scripts/snapshot-tag-records.py re-copies
          from the measurement's tag on every pass; the live
          results/summary.json describes whatever ran last, and what ran last is
          a null test.
      - kind: result
        path: results/sypd-repeats.json
        values:
          # The most-repeated group, not the latest: a re-baseline starts a
          # fresh group, whose spread is 0 until it is repeated.
          repeat_n: most_repeated_treatment.n_pairs
          repeat_spread: most_repeated_treatment.spread_points
        explanation: >-
          Independent repeats of one treatment, appended by the
          record-sypd-repeat stage. Its output carries
          `delete_before_run: false` because its input is the AMIP stages'
          scheduler logs, which the next repeat deletes and rewrites, so the
          record has to survive its own source. Each entry carries the
          treatment's diff digest and the whole submodule pointer map, and pairs
          are grouped by digest, so runs of different code can never be averaged
          together; `latest_treatment` is the group holding the most recent
          pair and `most_repeated_treatment` the one holding the most pairs,
          which are not the same group after a re-baseline -- a fresh group's
          spread is 0 until it is repeated, so anything asking what the floor
          is must read the latter. Every pair records which arm ran second and which GPU each arm
          was given, so the two confounds a single pair cannot see past are
          measurable across pairs rather than assumed away;
          `predicted_if_order_explains_null_pct` was committed before the
          reversed pair ran, so it is a prediction the record can be checked
          against rather than a description written afterwards. The repeats
          needed CALKIT_FORCE=1 to resubmit at all -- a forced scheduler stage
          otherwise harvests its own previous job and re-measures nothing.
      - kind: result
        path: results/null-census.json
        values:
          null_n: n_current_window
          null_mean: current_window_mean_pct
        explanation: >-
          Every null test in the committed history, collected by walking it
          rather than remembered: a pass whose arms record-treatment found
          identical in content is a measurement of nothing, and the collection
          is the only evidence here about how wide the wall-clock noise is. A
          commit counts only where one pass wrote both the treatment record and
          the summary, because before record-treatment carried `always_run` it
          could be skipped while the pass went ahead -- one such commit claims
          identical arms beside a +12.6% speedup. The split by benchmark window
          matters as much as the count: the nulls on earlier windows land within
          a fifth of a point of zero and do not measure this window's noise, so
          the floor quoted in the answer is the mean over the current-window
          ones alone. They have not changed sign, which is what separates a
          jitter around zero from a confound that repeats -- averaging reduces
          the first and not the second.
      - kind: result
        path: results/null-record/summary.json
        explanation: >-
          The same pipeline run with both arms on one commit, so every figure it
          reports is a measurement of nothing. It is what the treatment's
          percentages must be read against, and it is as perishable as they are
          -- so it is pinned out of its tag by the same stage, not read live.
      - kind: result
        path: results/null-record/step-comparison.json
        explanation: >-
          The step-breakdown pair's own verdict on the null test, which is the
          third of the three wall-clock measurements and disagrees in sign with
          the AMIP pair. Also the run that showed the steady-state cutoff was
          calibrated inside this noise: with no compilation difference possible
          it still found spikes, one of them late enough to empty the window.
      - kind: result
        path: results/null-record/param-fold.json
        explanation: >-
          The device side of the null test. Unlike the wall clock it comes back
          flat, which is the evidence for treating kernel times as the solid
          measurement and wall clock as the noisy one rather than the reverse.

  - question: >-
      How much of the wall clock do diagnostics cost, and is it worth optimizing them?
    answer: >-
      Diagnostics cost {total_pct:.1f}% of the wall clock on the benchmark window, so the whole of them is worth {sypd_headroom:.1f}% in SYPD -- that is the ceiling to compare an optimization's cost against before starting.
      The {write_pct:.1f}% carried by the daily write events is the great majority of it, leaving the sampling that feeds them a residual of {sampling_pct:.2f} points -- just enough to clear the spread between repeats of identical code and read the split at all, and not enough to price the sampling more precisely than under a point.
    evidence:
      - kind: document
        path: docs/diagnostics-cost.md
        section: The split matters more than the total
        explanation: >-
          Why the total is an upper bound, why the two halves need different
          work, the demonstration that the sampling residual moves without any
          code changing, and why answering this at all takes a whole extra run
          rather than a reading off the profile. Built by the
          diagnostics-cost-doc stage from the results files cited below.
      - kind: result
        path: results/diagnostics-cost.json
        values:
          total_pct: total_pct_of_wall
          sypd_headroom: sypd_headroom_pct
          write_pct: write_steps_pct_of_wall
          sampling_pct: sampling_pct_of_wall
        explanation: >-
          The baseline arm run twice on the same config, differing only in
          whether diagnostics are enabled, so the wall-clock difference is what
          they cost in total -- computation and writing together. The stage
          asserts that both runs stepped the same window, because a config that
          failed to apply would otherwise show up as a diagnostics saving. The
          generated diagnostics-off config is deleted when the job exits rather
          than committed, so the submodule stays clean and `record-treatment`
          does not report a dirty tree. Cited unpinned because it describes the
          current benchmark; both halves are regenerated together by the same
          pass, so the ratio cannot mix two configurations.
      - kind: result
        path: results/step-comparison.json
        explanation: >-
          How many write events the window holds and how expensive each is
          relative to an ordinary step, measured independently of the run above
          by classifying steps on the periodic schedule. This is the half of the
          cost that a step breakdown CAN see; it is cited here to make clear that
          the other half is not a residual anyone forgot to measure but one this
          method cannot reach.

  - question: >-
      Is there a rule of thumb for when folding parameters into the type is worth it, or does it always take a profile to find out?
    answer: >-
      There is a rule and it is not counting the parameters: one {payload_registers:.0f}-register payload produced savings of {savings_list} registers at {payload_sites:.0f} sites in the same source, so the size prices the prize and orders nothing.
      What predicts is compiling the body with its parameters as const globals -- the ceiling of any constant-folding scheme -- which costs minutes rather than a profile and called every outcome on this record, so a profile prices a fold and does not decide one.
      That leaves two gates rather than one: the ceiling test says whether a fold will land, device share says whether it will matter, and a site with the occupancy headroom of a flat one and a smaller share than any before it still returned {sed_change_pct:.2f}% on its own kernels.
    evidence:
      - kind: document
        path: docs/fold-decision-rule.md
        section: "The rule that works: compile the body with const globals"
        # Built by the frozen fold-decision-doc stage; pinned to the pass where its
        # inputs last matched dvc.lock.
        git_ref: meas/2026-11-03-two-prs-rebaselined
        explanation: >-
          The three candidate rules tested against every fold attempt on the
          record, the two failures the const-global probe caught before any code
          was written, what sets the size of a payoff once one is known to land,
          the procedure in cheapest-first order, and the two limits that travel
          with it. Built by the fold-decision-doc stage, which declares its own
          analysis of the four earlier stages' outputs and runs no GPU -- which
          is also what it concludes.
      - kind: result
        path: results/fold-decision.json
        values:
          payload_registers: summary.payload_registers
          payload_sites: summary.payload_sites
          savings_list: summary.savings_list
        explanation: >-
          Every parameter-fold attempt the project has measured -- five
          compile-only probes and the four kernels folded in the model -- put
          against three candidate predictors. It is assembled from earlier
          stages' outputs and runs no GPU, which is the point: if the decision
          needed a profile this file could not exist. Two cross-checks are what
          make it a test rather than a summary. `ceiling_test` records whether
          the const-global probe's zeros coincide with the sites where a fold
          returned nothing, in both directions, so a probe that condemned a site
          that would have paid would show up. And `magnitude_test` reports that
          its flat sites are also its smallest, so the file states the confound
          rather than letting the occupancy reading take credit for both gates.
          The control is the fourth folded kernel, whose register count the fold
          did not move: its change is the per-kernel noise the measurement
          resolves, and one kernel that crossed an occupancy step came in under
          it.
      - kind: document
        path: docs/experiments/sedimentation-velocity-fold.md
        section: "Why it is worth recording anyway: headroom and share come apart"
        # Built by the frozen sedimentation-velocity-fold-doc stage. The section
        # cited is the frozen experiment record; pinned so it reads against the
        # snapshot it was derived from rather than a later stack.
        git_ref: meas/2026-11-03-two-prs-rebaselined
        explanation: >-
          The experiment that separates the two gates the file above reports as
          confounded. The sedimentation velocity kernels have the occupancy
          headroom of a flat site and a smaller share of the device than any
          site on the record, and the fold still crossed a step on both and took
          a sixth off their time -- so occupancy headroom predicts the change in
          the kernel, and device share decides whether it reaches anything.
          Built by the sedimentation-velocity-fold-doc stage off a frozen
          snapshot, because the profiles it was derived from are overwritten by
          the next experiment.
      - kind: result
        path: results/sedimentation-fold.json
        # The frozen snapshot itself, pinned to the pass that carries it.
        git_ref: meas/2026-11-03-two-prs-rebaselined
        values:
          sed_change_pct: treated_change_pct
        explanation: >-
          The frozen snapshot behind that document: both treated kernels'
          registers, occupancy and time, the untreated broadcasts of the same
          block as controls, and the two verdicts kept apart --
          `saving_resolved_against_controls`, which is true, and
          `arm_total_resolved`, which is false because the untreated kernels
          drifted further than the treatment saved. It carries both arms' refs
          and both nsys databases' hashes, so a stale freeze is visible in the
          file.

tables:
  - path: results/top-kernels.csv
    title: Top 20 GPU kernels, baseline vs. mod
    description: >-
      Per-kernel Nsight Systems aggregates for the top 20 kernels, ranked by
      whichever arm spends longer in them so a kernel that exists only in the
      modified arm is not dropped: invocation counts, total and mean duration,
      share of total GPU time, registers per thread, and the percent change in
      total time. `pairing` says how each row's two arms were matched --
      `exact` on the full mangled name, `rank` where an upstream edit renumbered
      the kernel's source line and the group was separated enough in time to
      match it unambiguously, or `baseline only`/`mod only` where no confident
      match exists and the row is left half empty rather than guessed.

  - path: results/kernel-resources.csv
    title: Per-kernel register, spill, and occupancy stats
    description: >-
      Nsight Compute resource metrics for the profiled microphysics kernels,
      baseline vs. mod: registers per thread, register spilling (requests and
      the share of memory traffic they cost), stack frame, and achieved vs.
      theoretical occupancy.

      This exists because the nsys table above cannot show the mechanism behind
      the headline speedup. The hot kernel can sit pinned at the 255-register
      cap in BOTH cases, so by the columns nsys collects nothing changed at all,
      while its total time falls by half. Registers at the cap is not the same
      thing as spilling, and nsys does not collect spill metrics -- only Nsight
      Compute does. Specific figures are deliberately left to the table rather
      than quoted here, so this description cannot go stale against the data it
      describes.

environments:
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_options:
      - --gpus=1
      - --time=120
  sassy:
    kind: system
    host: sassy.caltech.edu
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.13"

pipeline:
  stages:
    record-treatment:
      # Reports git state -- submodule SHAs, refs, whether a tree was dirty --
      # which DVC cannot see, because its declared inputs are file contents.
      # Committing a submodule changes no content, so the stage was skipped as
      # unchanged while the very thing it records had changed, and it kept
      # reporting a stale SHA and a dirty tree that was no longer dirty.
      # It is CPU-only and takes seconds, so it runs every time.
      always_run: true
      kind: python-script
      environment: py
      script_path: scripts/record-treatment.py
      # What actually ran, as opposed to what a commit message says ran. A
      # superproject commit pins every submodule SHA, but not whether a package
      # was dev'd into the AMIP environments (a submodule can be checked out and
      # irrelevant), nor whether a tree was dirty, nor which CLIMA_* variables
      # the stages exported. Each of those has changed the meaning of a result
      # in this project at least once.
      #
      # Depends on diffs/ rather than the submodules directly, so it re-runs
      # after make-diffs has observed the same state, and cannot disagree with
      # the archived diff.
      inputs:
        - from_stage_outputs: make-diffs
        - calkit.yaml
      outputs:
        - path: results/treatment.json
          storage: git
    make-diffs:
      kind: shell-script
      environment: _system
      script_path: scripts/make-diffs.sh
      inputs:
        - ClimaCoupler.jl
        - ClimaCoupler.jl-mod
        - ClimaCore.jl
        - ClimaCore.jl-mod
        - ClimaAtmos.jl
        - ClimaAtmos.jl-mod
        - CloudMicrophysics.jl-mod
        - RRTMGP.jl
        - RRTMGP.jl-mod
      outputs:
        - path: diffs
          storage: git
    baseline-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/baseline
        - ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - RRTMGP.jl/src
        - RRTMGP.jl/ext
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
