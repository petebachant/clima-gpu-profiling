owner: petebachant
name: clima-gpu-profiling
title: CliMA GPU profiling
description: Profiling GPU performance for CliMA.
git_repo_url: https://github.com/petebachant/clima-gpu-profiling

questions:
  - question: Can we improve the performance of the flagship AMIP simulation?
    answer: Probably.
    evidence:
      - kind: figure
        path: figures/sypd-time-series.png
      - kind: result
        path: results/summary.json
        key: speedup_pct
      - kind: table
        path: results/top-kernels.csv
        explanation: >-
          Top 20 GPU kernels by baseline cost, for both cases. Shows the
          speedup is concentrated in the two set_microphysics_tendency_cache
          kernels (-54% and -57%) while every other kernel is unchanged
          within ~1%, so the gain is a real, localized effect rather than
          run-to-run drift. Registers per thread shows the mechanism where
          it is visible: the lighter sibling kernel drops 255 -> 146 and
          gains occupancy, while the hot kernel stays pinned at the 255
          cap. Spill counts are not in nsys; see results/ncu/ for those.

  - question: >-
      How much of a GPU profiling job is compilation rather than computation,
      and how much of it is recoverable between jobs by enabling GPUCompiler's
      on-disk kernel cache?
    hypothesis: >-
      Most of a profiling job is compilation, and a large share of that is GPU
      kernel compilation that is currently thrown away at process exit. An
      nsys stage takes ~40 minutes to produce ~1.8 s of measured stepping (30
      coupler steps of NVTX-ranged time), and of the remainder only ~112 s is
      Pkg.precompile and ~2 s is nsys post-processing. Julia caches host native
      code across processes via pkgimages, but GPU kernels are compiled by
      GPUCompiler at run time and discarded unless its `disk_cache` preference
      is set -- and it defaults to "false" and is unset in every environment
      here. If that accounts for a large fraction of the ~34 minutes of setup
      and first-call compilation, enabling the cache should cut it sharply on
      any job whose kernels have not changed, because the cache is keyed on the
      CodeInstance and CompilerConfig and so invalidates only what changed.
    answer: >-
      Compilation is ~88% of the job, and it is host-side Julia JIT, not GPU
      kernel compilation. Across all three phases the split was near-identical
      (1715/1942 s, 1662/1885 s, 1679/1899 s = 88.3/88.2/88.4%), for a job that
      yields 0.6 s of steady-state stepping.

      GPUCompiler's on-disk kernel cache is NOT the lever, for a stronger reason
      than the timings alone show. The cache_warm phase was 2.2% faster than
      cache_off, but cache_cold -- which does strictly more work, populating the
      cache -- was faster than both, so that spread is noise. Follow-up
      diagnosis found the cache writes nothing at all: with the preference set,
      GPUCompiler.disk_cache_enabled() correctly returns true, yet compiling a
      kernel leaves 0 files in disk_cache_path(). The feature is a no-op in this
      stack (Julia 1.11.5 / CUDA.jl Wfi8S / GPUCompiler Yuvf5), so enabling it
      cannot help regardless of how much GPU compilation there is. Two candidate
      causes are visible in GPUCompiler's `actual_compilation` -- a `nothing`
      CodeInstance bypasses both the disk read and the write, or `cache_file`
      bails on its build-id sentinel -- but which one applies is not established.

      So the remaining levers are host-side: PrecompileTools workloads in the
      CliMA packages, or iterating on a reduced-resolution config so setup and
      JIT shrink with it. Note this study measures a workload the disk cache
      never acted on; it does not measure how large the GPU-compilation share
      would be if the cache worked.
    evidence:
      - kind: result
        path: results/compile-time/compile-time.toml
        key: cache_off.totals.wall_s
        explanation: >-
          Status quo. Wall time for code loading, simulation construction, and
          two steps with the disk cache explicitly disabled and cleared, so a
          cache left behind by earlier work cannot flatter the baseline.
      - kind: result
        path: results/compile-time/compile-time.toml
        key: cache_warm.totals.wall_s
        explanation: >-
          The payoff. Same workload with the disk cache enabled and already
          populated by the preceding cache_cold phase. The difference against
          cache_off is the per-job wall time recoverable by turning the cache
          on. All three phases run in one SLURM job on one GPU so the
          comparison is not confounded by node or device variance.
      - kind: result
        path: results/compile-time/compile-time.toml
        key: cache_off.totals.host_compile_s
        explanation: >-
          Host-side JIT only, from Julia's own `@timed` compile_time
          accounting. GPU kernel compilation is not counted here because
          GPUCompiler runs outside that accounting, which is exactly why the
          GPU share must be inferred from the cache_off/cache_warm wall delta
          rather than measured directly. Splitting the two matters for what to
          do next: host-dominated points at PrecompileTools workloads in the
          CliMA packages, GPU-dominated points at the disk cache.
      - kind: result
        path: results/compile-time/compile-time.toml
        key: cache_off.second_step.wall_s
        explanation: >-
          Steady-state cost of one step once everything is compiled, which
          bounds how much of the first step was genuinely compute rather than
          compilation.

tables:
  - path: results/top-kernels.csv
    title: Top 20 GPU kernels, baseline vs. mod
    description: >-
      Per-kernel Nsight Systems aggregates for the top 20 kernels ranked by
      baseline total time, covering both the baseline and modified runs:
      invocation counts, total and mean duration, share of total GPU time,
      registers per thread, and the percent change in total time.

environments:
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_options:
      - --gpus=1
      - --time=120
  sassy:
    kind: system
    host: sassy.caltech.edu
  py:
    path: requirements.txt
    kind: uv-venv
    prefix: .venv
    python: "3.13"

pipeline:
  stages:
    make-diffs:
      kind: shell-script
      environment: _system
      script_path: scripts/make-diffs.sh
      inputs:
        - ClimaCoupler.jl
        - ClimaCoupler.jl-mod
        - ClimaCore.jl
        - ClimaCore.jl-mod
        - ClimaAtmos.jl
        - ClimaAtmos.jl-mod
        - CloudMicrophysics.jl-mod
      outputs:
        - path: diffs
          storage: git
    baseline-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/baseline
        - ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/nsys/baseline.nsys-rep
        - results/nsys/baseline.sqlite
    mod-nsys:
      kind: shell-script
      environment: clima
      script_path: scripts/run-nsys.sh
      args:
        - results/nsys/mod
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        - ClimaAtmos.jl-mod/config
        - CloudMicrophysics.jl-mod/src
      outputs:
        - results/nsys/mod.nsys-rep
        - results/nsys/mod.sqlite
    baseline-ncu:
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      args:
        - results/ncu/baseline
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the baseline tree. It
        # also matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl/experiments/AMIP
        - --config
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
      outputs:
        - results/ncu/baseline.ncu-rep
        - path: results/ncu/baseline-details.csv
          storage: git
          delete_before_run: true
    mod-ncu:
      frozen: true
      kind: shell-script
      environment: clima
      script_path: scripts/run-ncu.sh
      args:
        - results/ncu/mod
        # Line-number-agnostic so the filter survives edits above the
        # call site (which renumber the kernel, e.g. L1024 -> L1045).
        # Still pinned to this function + file in the mod tree. It also
        # matches the cheaper sibling set_microphysics_tendency_cache
        # kernel in this file; the compare-kernels notebook selects the
        # hottest, so the report stays valid. If launch-count no longer
        # captures enough of the hot kernel, raise it.
        - --kernel-name
        - regex:set_microphysics_tendency_cache__FILE_ClimaAtmos_jl_mod_src_cache_microphysics_cache_jl_L[0-9]+
        - --project
        - ClimaCoupler.jl-mod/experiments/AMIP
        - --config
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --launch-skip
        - "3"
        - --launch-count
        - "6"
      inputs:
        - scripts/run.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        - CloudMicrophysics.jl-mod/src
      outputs:
        - results/ncu/mod.ncu-rep
        - path: results/ncu/mod-details.csv
          storage: git
          delete_before_run: true
    amip-baseline:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      args:
        - --project=ClimaCoupler.jl/experiments/AMIP
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - --config_file
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --job_id
        - gpu_amip_progedmf_1M_land_he16_baseline
      inputs:
        - ClimaCoupler.jl/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl/src
        - ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl/experiments/AMIP/code_loading.jl
        - ClimaCore.jl/ext
        - ClimaCore.jl/src
        - ClimaCore.jl/lib
        - ClimaAtmos.jl/src
        - ClimaAtmos.jl/toml
    amip-mod:
      kind: shell-script
      environment: clima
      script_path: scripts/run-julia-script.sh
      args:
        - --project=ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/experiments/AMIP/run_simulation.jl
        - --config_file
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - --job_id
        - gpu_amip_progedmf_1M_land_he16_mod
      inputs:
        - ClimaCoupler.jl-mod/experiments/AMIP/run_simulation.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        - ClimaAtmos.jl-mod/toml
        - ClimaAtmos.jl-mod/config
        - CloudMicrophysics.jl-mod/src
    summarize:
      kind: python-script
      environment: py
      script_path: scripts/summarize.py
      inputs:
        - results/nsys/baseline.sqlite
        - results/nsys/mod.sqlite
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: results/summary.json
          storage: git
    compare-kernels:
      kind: jupyter-notebook
      notebook_path: notebooks/compare-kernels.ipynb
      environment: py
      inputs:
        - from_stage_outputs: baseline-nsys
        - from_stage_outputs: mod-nsys
      outputs:
        - path: results/top-kernels.csv
          storage: git
      html_storage: git
      executed_ipynb_storage: git
    compile-time-study:
      kind: shell-script
      environment: clima
      script_path: scripts/run-compile-study.sh
      # Three full setup+JIT phases in one job, so the default 120 min from the
      # clima environment is not enough. `env_default_options` defaults to
      # `replace`, so --gpus=1 must be restated here.
      scheduler:
        options:
          - --gpus=1
          - --time=300
      args:
        - ClimaCoupler.jl-mod/experiments/AMIP
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - results/compile-time/compile-time.toml
      inputs:
        - scripts/measure-compile-time.jl
        - ClimaCoupler.jl-mod/src
        - ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
        - ClimaCoupler.jl-mod/experiments/AMIP/Manifest-v1.11.toml
        - ClimaCoupler.jl-mod/experiments/AMIP/code_loading.jl
        - ClimaCore.jl-mod/ext
        - ClimaCore.jl-mod/src
        - ClimaCore.jl-mod/lib
        - ClimaAtmos.jl-mod/src
        - CloudMicrophysics.jl-mod/src
      outputs:
        # Small TOML that answers the question directly -- keep it in Git so the
        # evidence is readable without a `calkit pull`.
        - path: results/compile-time/compile-time.toml
          storage: git
    analyze-logs:
      kind: jupyter-notebook
      notebook_path: notebooks/analyze-logs.ipynb
      environment: py
      inputs:
        - from_stage_outputs: amip-baseline
        - from_stage_outputs: amip-mod
      outputs:
        - path: figures/sypd-time-series.png
          storage: git
      html_storage: git
      executed_ipynb_storage: git

showcase:
  - notebook: notebooks/analyze-logs.ipynb
