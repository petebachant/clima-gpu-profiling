nlay = 80
note = "rounds_ms times the grouped g-point rounds of one band -- every round's optics and sweeps launch, which is what the block size configures -- and not the whole solve, so it excludes the reduction and the state refresh, whose launches the block size does not reach. Every point shares one simulation's state, lookups and workspaces and differs only in the launch configuration, so these are in-block comparisons and not a difference of runs. change_pct is against the shipped block size, and a point is only faster if it clears repeat_spread_pct, the shipped point's own spread. rounds_ms is the median over every repeat of both passes, and pass_gap_pct is how far the two passes' own medians disagree: the second pass runs the sweep backwards, so a point whose two medians agree is reporting a property of the block size rather than a drift across the sweep. warps_per_sm is the CUDA driver's cuOccupancyMaxActiveBlocksPerMultiprocessor times the block's warps, not a model of the register file. A block size past a kernel's register budget cannot be launched at all and is recorded as skipped_too_many_registers rather than timed. bit_for_bit_with_shipped must hold everywhere: a thread's wide column is its global id whatever the block, so a difference would be a bug and not roundoff."
repeats = 9
shipped_block_threads = 128
shipped_is_at_equal_occupancy = true
warmup_steps = 3

