note = "solve_ms times the whole shortwave both-skies solve, so it charges the grouped path for its reduction, its hoisted aerosol mask and its state refresh -- it is the net figure, not the kernel's. Every point shares one simulation's state and buffers and differs only in group count, so these are in-block comparisons and not a difference of runs. worst_flux_deviation is against ngroups = 1, the ungrouped specialization, and covers the direct beam as well as up, down and net in both skies: the split is not bit-for-bit, since a g-point sum taken in N partials is a different summation order. aod_bit_identical is equality rather than a tolerance because the 550 nm optical depth is a per-column read-modify-write with one nominated writer, so any difference there is groups interleaving and not roundoff. sufficient_is_sweep_maximum says whether the sweep found a knee or only moved the bound to its own endpoint. A group count whose predicted workspace does not fit the device is skipped rather than run, and carries skipped_out_of_memory instead of a timing."
