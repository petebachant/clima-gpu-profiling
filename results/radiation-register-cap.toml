block_threads = 128
config_file = "ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml"
float_type = "Float32"
ncol = 24576
ngroups = 16
nlay = 80
note = "Asks what `ptxas` charges to shed registers off the four kernels the g-point-grouped radiation solves launch, now that the phase split has taken them off the 255-register cap. Every point launches at the shipped block size and differs only in the `maxregs` passed to one or both halves of a round, so the comparison is a register budget and not a launch configuration -- that question is closed separately in results/group-block-size.toml. Caps are computed, not chosen: for each kernel the highest multiple of 8 below its own count that the allocation granularity says reaches more warps, and the next such step below it. `predicted_warps` is that model and `warps_per_sm` is the driver's own cuOccupancyMaxActiveBlocksPerMultiprocessor, so a step the model gets wrong reads as a disagreement rather than as a silent premise; a cap the driver gives no extra warps is recorded in `skipped` and never timed. `local_bytes_added` bounds what the cap cost in spill but does not measure it: the allocator can also meet a budget by rematerializing, which costs instructions and no local memory, so a clean local frame is not a free cap and the decision rests on the clock. Timing is interleaved and paired rather than blocked: each round visits every configuration once in an order that rotates by one per round, and `change_pct` is the median of the per-round differences against the uncapped point of the same round, so a drift slow compared with a round falls on both arms of every difference. `sign_test_p` is an exact two-sided sign test over those differences and is what `best_is_resolved` tests, because the spread of one point's own repeats is set by the device's drift and is not an error bar for the difference. The rounds are split in half and reported as `change_pct_first_half` and `change_pct_second_half`: a magnitude whose halves disagree is reporting drift as well as a cap. A register budget cannot change arithmetic -- the allocator spills and rematerializes, it does not reassociate -- so `bit_for_bit_with_uncapped` should hold everywhere, and a failure means the cap is doing something other than what this measures."
register_alloc_unit = 256
regs_per_sm = 65536
rounds_interleaved = 12
timings_per_round = 3
warmup_steps = 3

