note = "Three arms on one simulation's state and buffers, so these are in-block comparisons and not a difference of runs. `fused` and `split` share one group workspace and differ only in its split_optics flag. bit_for_bit counts values that differ when the two arms' fluxes, cloud cover and 550 nm optical depth are compared as integers: the split moves no arithmetic, so anything but zero is a bug rather than roundoff. driver_warps_per_sm is the CUDA driver's own cuOccupancyMaxActiveBlocksPerMultiprocessor; model_warps_per_sm is the allocator model ClimaCore's max_active_blocks implements, which is what predicted this split was worth building. Where they disagree the driver is right. solve_ms times the whole both-skies solve, so the grouped arms are charged for their reduction and their state refresh, and the split arm for its extra launch per round."
