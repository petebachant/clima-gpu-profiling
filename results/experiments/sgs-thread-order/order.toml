note = "Each configuration calls the live `set_environment_1m_tendency!` on one simulation state, so the configurations differ by the thread order and the destination field and no two runs are differenced. `vertical` is `DataLayouts.NoMask()`, the order the launch uses unasked: the parent layout's own, with the vertical fastest, so a warp is 32 levels of one column. `level_aligned` is `DataLayouts.LevelAlignedOrder()`, which gives a warp the cells of one level. Both mark every point active and evaluate the same function at the same cells with no reduction between them, so they must agree to the bit; bitwise_identical is that check, taken on the production field's own storage reinterpreted as integers so a NaN cannot pass as equal. The device drifts during a run, so the configurations are interleaved: one round visits all four, the visiting order rotates each round, and an effect is the median of the per-round differences. resolved is a two-sided sign test on those differences at p < 0.01 rather than a comparison against a spread, because the drift sets the spread and one contended round can reverse a single difference without putting the effect in doubt; rounds_agreeing and sign_test_p carry the test and differences_ms the differences themselves. Figures outside `configs` are read off the production destination, and destination_effect is what the probe's own choice of field is worth. window_saved_ms scales the per-call figure by the calls a step makes and the 120 steps the profile covers. The guard the order collects is live on both paths, since `mode` binds the positional argument ahead of `args...`."
orders = ["vertical", "level_aligned"]
rounds = 31
steps = 120
warmup_steps = 3

