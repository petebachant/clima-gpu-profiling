n_substeps_quad = 2
note = "Each point calls the live `set_environment_1m_tendency!` on one simulation state with a different thread order and nothing else changed, so the points differ by the order and no two runs are differenced. `vertical` is `DataLayouts.NoMask()`, the order the launch uses unasked: the parent layout's own, with the vertical fastest, so a warp is 32 levels of one column. `level_aligned` is `DataLayouts.LevelAlignedOrder()`, which gives a warp the cells of one level. Both mark every point active and evaluate the same function at the same cells with no reduction between them, so they must agree to the bit; bitwise_identical is that check, taken on the fields' own storage reinterpreted as integers so a NaN cannot pass as equal. The saving is a per call figure and window_saved_ms scales it by the calls a step makes and the 120 steps the profile covers. The guard the order collects is live on both paths, since `mode` binds the positional argument ahead of `args...`. Both destinations are timed because they are not interchangeable: `production` is the precomputed field the model writes and `fresh` is a `similar` allocation, and fresh_vs_production_pct is what the choice alone costs at the order in use today. Every figure outside `points` is read off the production destination."
orders = ["vertical", "level_aligned"]
repeats = 7
steps = 120
warmup_steps = 3

