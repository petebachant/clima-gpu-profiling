nlev = 79
note = "Every mask is over environment cells of one settled AMIP state, read from the scratch fields the explicit closure call just materialized. guard_live is the condition `_sum_1m_over_sgs` tests before returning a zero tendency, so its cell_fraction is the rate at which the closure's own early-out fires; eq_nonfinite_cells is the `!isfinite(λ_eq)` term on its own. edges_beyond_K_sigma replaces that term with the distance of the node rule's two cloud edges, `min(-λ_lagrange/α, -λ_eq)/σ_S`, which is what decides whether any node of a dry cell carries weight: skipping such a cell is not bit-for-bit, since the outermost interval keeps two nodes of weight Q(K), so K is swept rather than chosen. Each mask is censused under two thread orders and three group sizes: a group is skippable only when every lane is, and all_skippable_fraction at 32 is the warp rate a treatment would have to move. The saving fractions are relative to the current order's warp rate, which is what is being paid now; compaction_saving_fraction is the per-cell bound no order reaches."
orders = ["vertical_fastest", "level_aligned"]
repeats = 7
sgs_displacement_truncation = 3.0
sgs_variance_curvature = false
warmup_steps = 3

