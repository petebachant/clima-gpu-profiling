config_file = "ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml"
float_type = "Float32"
flux_tolerance_rel = 1.0e-5
ncol = 24576
nlay = 80
note = "Equivalence of the grouped g-point solve against the ungrouped one, on the live AMIP state at full resolution. Group counts include values that divide neither g-point count, which both sweeps miss: 4, 8, 16 and 32 divide 256 and 224 exactly, so every group gets an equal stride and the ragged final stride never runs. Fluxes get a relative tolerance because the split is not bit-for-bit -- a g-point sum taken in N partials is a different summation order -- and the figure that matters is that the deviation does not grow with the group count, which is what separates roundoff from a dropped or double-counted g-point. Cloud cover is a count and is asserted exactly. The 550 nm aerosol optical depth is asserted exactly and shortwave only: it is a per-column read-modify-write with one nominated writer, so any difference is groups interleaving. This does NOT cover ngroups > n_gpt, where a group has no g-points at all; that needs more groups than there are g-points and so belongs in the unit tests, at a column count where the workspace is affordable."
passed = true
warmup_steps = 3

