block_threads = 128
config_file = "ClimaCoupler.jl-mod/config/benchmark_configs/amip_progedmf_1m_land_he16.yml"
float_type = "Float32"
ncol = 24576
ngroups = 16
nlay = 80
note = "Asks what the grouped cloud mask's memory layout is worth, and whether it is worth more once the register caps have raised occupancy. Every other wide workspace a grouped round writes is column-fast -- the optics arrays come from `_coalesced_3d_zeros(DA, FT, ncol, nlay, 3)` and the partial accumulators are `(ncolw, nlay + 1, planes)` -- so a `(nlay, ncolw)` mask stands a warp's threads `nlay` bytes apart and makes one one-byte access touch 32 sectors where it could touch one. What that costs is wavefronts rather than bandwidth: the tile a warp walks is the same either way and L1 absorbs it, so the layer-fast layout does not move more bytes off the device, it issues 32 times the requests to move them. The cap state is an axis and not a constant because raising occupancy over the phase split made these kernels MORE latency-exposed (`long_scoreboard` 59% -> 80%), so a treatment that removes requests should be worth more at the caps than without them; `layout_worth_more_at_the_caps` is that comparison and `cap_only` and `both_treatments` put the two treatments in one table. Each layout is differenced against the layer-fast arm of its OWN cap state, so a layout figure is never carrying a cap. Timing is interleaved and paired as in results/radiation-register-cap.toml, and for the same reason: a blocked design on this machine attributes the device's drift to the treatment. A layout cannot change the answer -- the McICA draw is keyed on `(key, gcol, igpt, ilay)` and not on memory order -- so `all_bit_for_bit` must hold, and the mask itself is compared in the canonical `(nlay, ncolw)` orientation so that a transposition error cannot read as agreement."
rounds_interleaved = 20
timings_per_round = 3
warmup_steps = 3

