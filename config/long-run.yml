# Overrides for the AMIP throughput (SYPD) stages. Shared by both arms so
# neither ClimaCoupler checkout deviates from its upstream branch.
#
# The benchmark config's 1200 s is 40 coupler steps, which is (a) shorter than
# the gravity-wave period of 60 steps, so neither scheme ever fires, and (b)
# short enough that first-call compilation dominates the average: the model
# reports 0.2767 s per coupling step over that window while direct CUDA-event
# measurement of steady-state steps gives 0.146 s. Nearly half the reported
# per-step cost is JIT amortized over too few steps.
#
# One simulated day (2880 steps) fires every sub-daily process many times and
# the daily ocean/sea-ice diagnostics once, and dilutes first-call compilation
# to roughly a fiftieth of its current weight. Costs ~7 min of stepping on a job
# whose compilation is ~35 min regardless.
#
# NB a bare `--t_end 86400secs` on the command line is IGNORED -- the config file
# wins. Overrides have to arrive as an additional --config_file, which is how
# run-nsys.sh does it and why the nsys arms picked up their window while the
# AMIP arms silently did not.
t_end: "86400secs"
