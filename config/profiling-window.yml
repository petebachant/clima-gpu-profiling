# Overrides applied on top of the benchmark config for the nsys profiling stages
# only. Lives here rather than in either ClimaCoupler submodule so both arms pick
# up the identical value and neither submodule deviates from its upstream branch.
#
# scripts/run.jl profiles 120 steps after 3 warmup steps. 123 steps x 30 s =
# 3690 s, so the integrator needs t_end beyond that or it stops early and the
# profiled window is silently short.
#
# 120 steps = one simulated hour = LCM(20, 60, 120) of this configuration's
# periodic processes: radiation every 20 steps, both gravity-wave schemes every
# 60, cloud fraction and the diagnostics write every 120. A window of exactly the
# LCM is phase-independent, so every process appears at its true long-run
# frequency and the profile needs no reweighting. The previous 1200 s (40 steps)
# was shorter than the gravity-wave period, so neither scheme ever fired.
t_end: "4000secs"
